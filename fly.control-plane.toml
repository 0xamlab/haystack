# algenta-control-plane — the hosted Algenta CONTROL PLANE (P4), behind Cloudflare.
#
# ONE image, role flag: same ghcr image as codna-api, but ALGENTA_SERVICE_ROLE=control_plane +
# the asgi entrypoint (apps.api_server.asgi:app) selects the engine-free control-plane app —
# auth / account / team / billing / credits / metering / devices / license (JWKS·CRL·renewal) /
# meta. NO engine, NO Mojo, NO /mcp. It owns its OWN Postgres (NEVER codna's) and runs the same
# alembic migrations against it.
#
# Deploy:  flyctl deploy -c fly.control-plane.toml -i ghcr.io/thyn-ai/algenta/api:<tag>
#
# OWNER-ONLY provisioning (real resources + secrets — see the PR body / DEPLOY notes):
#   fly apps create algenta-control-plane
#   fly postgres create (algenta-control-plane-pg) && fly postgres attach --app algenta-control-plane
#   fly secrets set -a algenta-control-plane \
#       DATABASE_URL=postgresql+asyncpg://... DATABASE_URL_SYNC=postgresql://... \
#       JWT_SECRET=... STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=... \
#       STRIPE_PRICE_DEVELOPER=... STRIPE_PRICE_PRO=... METRICS_SECRET=... REDIS_URL=... \
#       LICENSE_SIGNER_BACKEND=cf_worker LICENSE_SIGNER_URL=https://license.algenta.ai/sign \
#       LICENSE_SIGNER_AUTH_TOKEN=... LICENSE_SIGNER_KID=... LICENSE_SIGNER_WORKER_PUBLIC_KEY=...
#   fly certs add api.algenta.ai -a algenta-control-plane   (+ Cloudflare DNS in infra/cloudflare)
# The RS256 PRIVATE key lives ONLY in the Cloudflare signer Worker (P4c), never on Fly.

app = "algenta-control-plane"
primary_region = "iad"

[build]
  # Dedicated ENGINE-FREE image (no Mojo, no private GHCR base) so the control plane is small and
  # deploys with `flyctl deploy --remote-only` — no local docker, no GHCR read token, no heavy
  # shared api/mojo image. The control-plane app imports zero engine modules (verified by
  # test_control_plane_role), so it needs none of the engine payload.
  dockerfile = "infra/docker/Dockerfile.control-plane"

[processes]
  # Role-selecting entrypoint: asgi:app reads ALGENTA_SERVICE_ROLE → the control-plane app.
  app = "python -m uvicorn apps.api_server.asgi:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log"

[deploy]
  # Migrate the control plane's OWN Postgres (DATABASE_URL_SYNC secret → algenta-control-plane-pg),
  # once per release on a throwaway Machine. Same migration chain; never touches codna-pg.
  release_command = "python -m alembic -c apps/api_server/alembic.ini upgrade head"
  strategy = "rolling"

[env]
  API_ENV = "production"
  LOG_LEVEL = "info"
  ALGENTA_SERVICE_ROLE = "control_plane"
  # Multi-replica idempotency/coordination via the shared Redis (REDIS_URL is a secret; degrades
  # to local store if unset). NO engine env (no Mojo / S3 / agent-core / sources / runtime dirs).
  ALGENTA_COORDINATION = "redis"
  # Microsoft Entra SSO auto-links a verified identity to a subscription on first sign-in
  # (join the tenant's shared Team/Enterprise org if a seat is free, else an individual
  # Community org) — mirrors the Supabase org auto-provision. See entra_org_resolver.
  ALGENTA_ENTRA_AUTO_PROVISION = "1"
  CORS_ORIGINS = "https://app.algenta.ai,https://algenta.ai"
  # Shared Supabase identity project — required to verify the Supabase JWTs forwarded by accounts.thyn.ai /
  # app.algenta.ai (device-grant approve + /v1/telys/onboard). It is a PUBLIC URL (shipped in every browser
  # bundle), so it lives here as plain config, not a secret. WITHOUT it, verify_supabase_jwt() raises
  # "not_configured" and every /oauth/device/approve + onboard call 401s — which the CLI/portal surfaces as a
  # bogus "session expired". Tracked here so a reprovision never drops it again.
  SUPABASE_URL = "https://qxxnqenpvutophhcmebr.supabase.co"

[http_service]
  internal_port = 8000
  # Bind the HTTP service to the named "app" process (required once [processes] is defined).
  processes = ["app"]
  force_https = true
  # Scale to ZERO when idle. The product is self-hosted (licenses verify offline on the customer's
  # own machine); this control plane only handles bursty, latency-tolerant calls (license
  # mint/renew, deployment activation, Stripe webhook, accounts seam), so paying to stay warm 24/7
  # is waste. "suspend" snapshots RAM → Fly Proxy wakes the machine in <1s on the next request
  # (auto_start), so there's effectively no cold-start penalty and zero idle compute cost. Stripe
  # webhooks wake it on delivery and are retried for 3 days, so a wake miss is safe.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  # Small/cheap: the control plane does no engine work (no Mojo pool). shared-cpu-1x is ample for
  # the light, request-driven licensing/auth/billing surface. Resizable in place with
  # `fly scale vm <size> -a algenta-control-plane` if load ever warrants. Memory kept at 1gb so
  # the full FastAPI import graph + 2 workers boot comfortably (smaller RAM = smaller suspend snap,
  # but 512mb risks OOM on the heavy import set — bump only after profiling).
  size = "shared-cpu-1x"
  memory = "1gb"
