# Fleet manifest for the thyn-ai Spaces. Read by apps/spaces/tools/manifest.py;
# unknown keys fail the load, so every key here is one the tooling understands.
#
# Live Spaces run the SDK their README frontmatter declares today (docker for algenta and
# governed-agent, gradio for speed-arena until its Dockerfile lands in M2) and stay always-on
# (sleep_time = -1). Retired Spaces are static redirects: free, never sleep, no hardware,
# no secrets.
#
# `shared_shell` says whether the app renders the shared `algenta_spaces` footer with its
# build stamp. It is false for every live Space today; verify_remote skips the footer stamp
# check loudly while it is false and enforces it once an app flips it to true (M2).
#
# `secrets` are names only. Values are set by the owner with
# `HfApi.add_space_secret` and never appear in this repository.

[fleet]
org = "thyn-ai"
shared_package = "_shared/algenta_spaces"
budget_usd = 650

[spaces.algenta]
repo_id = "thyn-ai/algenta"
sdk = "docker"
source = "algenta"
python = "3.14"
hardware = "cpu-upgrade"
sleep_time = -1
shared_shell = false
secrets = ["ALGENTA_API_KEY", "HF_TOKEN"]
verify = "verify_remote:check_algenta"
api_names = [
  "run_duel",
  "tokenize",
  "retrieve",
  "attention",
  "gov_log_decision",
  "gov_execute_decision",
  "mcp_filter",
]

[spaces.algenta.variables]
ALGENTA_BASE_URL = "https://api.algenta.ai"

[spaces.speed-arena]
repo_id = "thyn-ai/algenta-speed-arena"
sdk = "gradio"
source = "speed-arena"
python = "3.12"
hardware = "cpu-upgrade"
sleep_time = -1
shared_shell = false
secrets = ["HF_TOKEN"]
verify = "verify_remote:check_speed_arena"
api_names = ["run_duel_ui"]

[spaces.governed-agent]
repo_id = "thyn-ai/algenta-governed-agent"
sdk = "docker"
source = "governed-agent"
python = "3.14"
hardware = "l4x1"
sleep_time = -1
shared_shell = false
secrets = ["ALGENTA_API_KEY", "HF_TOKEN"]
verify = "verify_remote:check_governed_agent"
api_names = ["agent_turn"]

[spaces.governed-agent.variables]
ALGENTA_BASE_URL = "https://api.algenta.ai"
ALGENTA_PROVIDER = "nscale"
ALGENTA_PROVIDER_MODEL = "Qwen/Qwen3-4B-Instruct-2507"

[spaces.for-llm-agents]
repo_id = "thyn-ai/algenta-for-llm-agents"
sdk = "static"
source = "_redirects/for-llm-agents"
redirect_to = "https://huggingface.co/spaces/thyn-ai/algenta"
verify = "verify_remote:check_redirect"

[spaces.governed-tool-calls]
repo_id = "thyn-ai/algenta-governed-tool-calls"
sdk = "static"
source = "_redirects/governed-tool-calls"
redirect_to = "https://huggingface.co/spaces/thyn-ai/algenta?tab=gov"
verify = "verify_remote:check_redirect"

[spaces.llm-modules]
repo_id = "thyn-ai/algenta-llm-modules"
sdk = "static"
source = "_redirects/llm-modules"
redirect_to = "https://huggingface.co/spaces/thyn-ai/algenta?tab=llm"
verify = "verify_remote:check_redirect"
