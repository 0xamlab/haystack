#cloud-config
# ci-orch -- orchestrator VM of the thyn-ai/algenta Azure CI compute plane.
#
# Hosts two things:
#   (a) a PERSISTENT self-hosted actions runner labeled `az-orch,self-hosted`
#       for orchestration/light jobs (e.g. the az-ci-smoke workflow);
#   (b) the az_orchestrator.py queue-watcher daemon, which polls GitHub every
#       15s for queued jobs requesting `az-ephemeral` and provisions one
#       ephemeral worker VM per job (workers self-delete after their job; a
#       90-minute reaper is the safety net).
#
# Rendered by infra/ci/deploy_orchestrator.sh -- the double-underscore tokens
# are substituted at deploy time and the result is passed as --custom-data.
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - docker.io
  - python3
write_files:
  - path: /opt/ci/az_orchestrator.py.b64
    permissions: '0600'
    content: |
      __ORCHESTRATOR_PY_B64__
  - path: /etc/az-orchestrator.env
    permissions: '0600'
    content: |
      GITHUB_CI_TOKEN=__GITHUB_CI_TOKEN__
      GITHUB_REPO=thyn-ai/algenta
      AZURE_SUBSCRIPTION_ID=__AZURE_SUBSCRIPTION_ID__
      AZURE_TENANT_ID=__AZURE_TENANT_ID__
      AZURE_SP_CLIENT_ID=__AZURE_SP_CLIENT_ID__
      AZURE_SP_CLIENT_SECRET=__AZURE_SP_CLIENT_SECRET__
      AZURE_RESOURCE_GROUP=thyn-ci
      AZURE_LOCATION=eastus
      AZURE_SUBNET_ID=__AZURE_SUBNET_ID__
      AZURE_VM_SIZES=__AZURE_VM_SIZES__
      POLL_SECONDS=15
      MAX_VM_AGE_MINUTES=90
  - path: /etc/systemd/system/az-orchestrator.service
    content: |
      [Unit]
      Description=Azure ephemeral CI orchestrator for thyn-ai/algenta
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      EnvironmentFile=/etc/az-orchestrator.env
      ExecStart=/usr/bin/python3 /opt/ci/az_orchestrator.py
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl enable --now docker
  # Azure CLI -- the orchestrator provisions and reaps worker VMs with it.
  - curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-archive-keyring.gpg
  - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/repos/azure-cli/ jammy main" > /etc/apt/sources.list.d/azure-cli.list
  - apt-get update
  - apt-get install -y azure-cli
  # SSH keypair the orchestrator stamps into the worker VMs it provisions.
  - test -f /root/.ssh/ci_plane_key || ssh-keygen -t ed25519 -N "" -f /root/.ssh/ci_plane_key
  # (a) persistent orchestrator runner, labels az-orch,self-hosted.
  - mkdir -p /opt/actions-runner
  - bash -c 'RUNNER_VERSION=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r .tag_name | tr -d v) && curl -fsSL -o /opt/actions-runner/runner.tar.gz "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz" && tar xzf /opt/actions-runner/runner.tar.gz -C /opt/actions-runner && rm -f /opt/actions-runner/runner.tar.gz'
  - chown -R azureuser:azureuser /opt/actions-runner
  - cd /opt/actions-runner && sudo -u azureuser ./config.sh --url https://github.com/thyn-ai/algenta --token __ORCH_RUNNER_REG_TOKEN__ --name ci-orch --labels az-orch,self-hosted --unattended
  - cd /opt/actions-runner && sudo -u azureuser ./svc.sh install && sudo -u azureuser ./svc.sh start
  # (b) queue-watcher daemon.
  - base64 -d /opt/ci/az_orchestrator.py.b64 > /opt/ci/az_orchestrator.py && rm -f /opt/ci/az_orchestrator.py.b64
  - chmod 0600 /opt/ci/az_orchestrator.py
  - mkdir -p /var/lib/az-orchestrator
  - systemctl daemon-reload && systemctl enable --now az-orchestrator.service
