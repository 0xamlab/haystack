# The az-ephemeral runner image contract.
#
# THIS FILE IS THE SOURCE OF TRUTH for what a thyn-ai CI runner guarantees. It exists because
# the gallery image `ci-worker/1.0.0` had NO source in the repository at all -- `git grep
# ci-worker` returned only the ID string in az_orchestrator.py. An image nobody can rebuild is
# an image nobody can extend, so every gap got patched at boot instead of fixed once:
# `python` and `unzip` both went in as per-boot repairs in August 2026.
#
# The failure mode this prevents is specific and already happened three times. The image is a
# FROZEN capture of CLOUD_INIT as it stood at one commit. CLOUD_INIT kept gaining packages
# afterwards, but golden-image VMs run CLOUD_INIT_FAST, which executes zero apt -- and that is
# the normal path in all 8 regions. So anything added to the bootstrap after the capture is
# DEAD ON ARRIVAL, silently. tests/test_ci_image_contract.py fails when this file and the
# bootstrap disagree, which is the gate that was missing.
#
# HOW TO ADD A TOOL
#   1. add it to [tier0] below with the reason it is fleet-wide
#   2. add the apt package to bootstrap_packages so a full CLOUD_INIT boot installs it
#   3. recapture the image (see rebuild_required) and bump image_contract
# Steps 1-2 alone leave the tool missing on every golden-image VM. The test enforces 1<->2;
# only a human can do 3, which is why rebuild_required exists.

[image]
# Bumped whenever the tool set changes. The bootstrap stamps this into /etc/ci-image.json so a
# job can assert what it is running on instead of discovering a gap 50s into a test.
contract = "1.2.0"
gallery_version = "1.0.0"          # the CAPTURED image; lags contract until a recapture
rebuild_required = true            # contract != gallery_version -> per-boot repair is active

# Tier-0 binaries the CAPTURED image genuinely already ships, so they need no per-boot repair.
# Everything in [tier0] that is NOT listed here MUST have a `command -v <tool>` guard in
# CLOUD_INIT_FAST while rebuild_required is true -- tests/test_ci_image_contract.py derives that
# requirement from this list rather than from a hardcoded tuple.
#
# That derivation exists because the hardcoded version missed a real one. `gh` was declared tier0
# and apt-installed in CLOUD_INIT, but CLOUD_INIT never runs on a golden-image VM, and the test
# only knew to check `unzip` and `python`. codna's first real release after the fleet went
# org-wide then failed with `gh: command not found`, exit 127 -- the precise event the tier0 note
# on `gh` had predicted.
baked_in = [
  "bash", "git", "curl", "jq", "tar", "gzip", "make",
  "docker", "node", "npm", "clang", "lld", "python3",
]

[tier0]
# Guaranteed on every runner, language-agnostic. A repo may assume these without declaring them.
# Each entry: the binary a workflow invokes, and why it is fleet-wide rather than repo-declared.
bash = "POSIX shell; every run: block"
git = "checkout, diff-based test selection"
curl = "token fetch in the bootstrap itself"
jq = "JSON in shell steps across every repo"
tar = "artifact pack/unpack"
gzip = "artifact pack/unpack"
unzip = "actions/setup-bun shells out to it -- absence reads as 'Unable to locate executable file: unzip', naming nothing"
make = "Makefile targets are the common entry point"
docker = "service containers + image builds"
node = "pnpm/corepack; without a system npm pnpm's installer falls through to the runner's npm stub"
npm = "same"
gh = "RELEASE and SYNC paths: algenta release-sdks.yml, codna auto-release-cli.yml"
rsync = "SDK/vendor sync steps"
clang = "Mojo shard builds link with clang"
lld = "same"
python3 = "engine tooling; NOTE tier0 guarantees an interpreter, NOT a writable site-packages"

[notes]
# Documented because a name on PATH is not the same as a usable interpreter, and this exact
# gap cost a night: `python` was symlinked to the system python3.14, whose site-packages is
# root-owned, so `pip install` still failed with
#   [Errno 13] Permission denied: /usr/local/lib/python3.14/dist-packages/...
# The contract is therefore: an interpreter is guaranteed, a WRITABLE one is not. Jobs create
# a venv. algenta already does this everywhere; codna adopted it in thyn-ai/codna#489.
python_writability = "jobs MUST create a venv; the system interpreter is not pip-writable"

# The per-boot repair BLOCKS runner registration. It was briefly backgrounded to protect boot
# latency (queue p50 14s, p90 120s, max 264s -- 27% of all CI wall clock is waiting), and the race
# that accepted fired on its first real test, not as a rare tail: ci-warm-1787804191 booted
# 04:16:31Z carrying the repair, its job started 04:17:25Z, and codna's release died on
# `gh: command not found` 54 seconds into a VM that HAD the fix. Adding an apt repo and installing
# gh does not finish in 54s.
#
# Registering a runner while its guaranteed tier0 tools are still installing advertises a
# guarantee the machine cannot keep. A runner that is not ready must not claim to be ready --
# that is the whole point of calling these tier0. The ~20-40s is paid before a VM joins the pool,
# so it costs cold provisions and warm-pool refill, never a warm hit. Recapturing the image
# deletes the block and the cost together.
repair_blocks_registration = "blocking by design; a runner must not advertise tier0 it does not yet have"

# tier0 guarantees `python3`. It does NOT guarantee python >= 3.11: jammy's python3 is 3.10, whose
# stdlib has no tomllib. codna's auto-release-cli died on exactly that. Jobs needing a newer stdlib
# must PROBE for the capability rather than pin a version -- a pinned "python3.14" breaks the moment
# the image ships 3.15.
python_version_floor = "python3 may be 3.10; probe for the capability you need, never pin a version"

[bootstrap_packages]
# apt package -> the tier0 binaries it provides. The test asserts every tier0 binary is
# reachable from some package here AND that CLOUD_INIT actually installs each package.
"ca-certificates" = []
"curl" = ["curl"]
"git" = ["git"]
"jq" = ["jq"]
"unzip" = ["unzip"]
"rsync" = ["rsync"]
"gh" = ["gh"]
"build-essential" = ["make"]
"clang" = ["clang"]
"lld" = ["lld"]
"docker-ce" = ["docker"]
"docker-ce-cli" = []
"containerd.io" = []
"docker-buildx-plugin" = []
"docker-compose-plugin" = []
"nodejs" = ["node", "npm"]
"python3.14" = ["python3"]
"python3.14-venv" = []
"libpython3.14" = []
"libicu70" = []
"libssl3" = []
"software-properties-common" = []

[tier1]
# NOT guaranteed. A repo needing these declares them in its own workflow; the fleet never
# learns the repo exists. Listed so a missing one produces a known answer rather than a hunt.
rustfmt = "codna Rust benchmark contracts -- the reporter that PROVES an injected parse error is real"
cargo = "same"
gofmt = "the structurally identical Go path; not yet exercised, will behave exactly like rustfmt"
go = "same"
bun = "installed by oven-sh/setup-bun at job time (which is why unzip is tier0)"
