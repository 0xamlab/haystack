{{- if and .Values.api.enabled .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name | default (printf "%s-api" (include "algenta.fullname" .)) }}
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "api") | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if and .Values.engine.enabled .Values.engine.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.engine.serviceAccount.name | default (printf "%s-engine" (include "algenta.fullname" .)) }}
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "engine") | nindent 4 }}
  {{- with .Values.engine.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
