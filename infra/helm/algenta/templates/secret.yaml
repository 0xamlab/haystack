{{- include "algenta.validateValues" . -}}
{{- if not .Values.secrets.existingSecret }}
# Rendered only when secrets.existingSecret is empty. Keys here are the LITERAL env var
# names the app expects (apps/api_server/config.py, case-insensitive pydantic-settings) so
# that both api-deployment.yaml and engine-deployment.yaml can consume this whole Secret via
# a single `envFrom: - secretRef` — no per-key remapping needed except
# ALGENTA_AGENT_CORE_TOKEN, which intentionally reuses the AGENT_CORE_AUTH_TOKEN value under
# a different var name (see the two Deployment templates).
#
# Every value below is optional at the Kubernetes level (an empty string is a valid,
# common self-host default — e.g. no Stripe billing configured) but you almost certainly
# want at least jwtSecret and algentaConfigEncryptionKey set for anything beyond a
# throwaway trial. Prefer secrets.existingSecret (populated by your own secret-management
# tooling) over relying on this template for anything but a quick trial — the values that
# create this Secret still live in your values file / release history either way.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "algenta.fullname" . }}-app-secrets
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  WEBHOOK_SIGNING_SECRET: {{ .Values.secrets.webhookSigningSecret | quote }}
  ALGENTA_CONFIG_ENCRYPTION_KEY: {{ .Values.secrets.algentaConfigEncryptionKey | quote }}
  ALGENTA_ENGINE_API_KEY: {{ .Values.secrets.algentaEngineApiKey | quote }}
  ALGENTA_API_KEY: {{ .Values.secrets.algentaApiKey | quote }}
  AGENT_CORE_AUTH_TOKEN: {{ .Values.secrets.agentCoreAuthToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
{{- end }}
