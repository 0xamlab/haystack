{{- if and .Values.engine.enabled .Values.engine.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "algenta.fullname" . }}-engine
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "engine") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "algenta.selectorLabels" (dict "root" $ "component" "engine") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the api Deployment in this release may reach the engine's agent-core port —
    # the engine is never a public entry point (see engine-service.yaml).
    {{- if .Values.api.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "algenta.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
      ports:
        - port: agent-core
          protocol: TCP
    {{- end }}
  egress:
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.api.enabled }}
    # The agent runtime calls back into /v1 via ALGENTA_ENGINE_URL.
    - to:
        - podSelector:
            matchLabels:
              {{- include "algenta.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    # Postgres / Redis / S3-compatible object store — see the identical note in
    # api-networkpolicy.yaml.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
{{- end }}
