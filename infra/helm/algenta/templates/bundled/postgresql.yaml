{{- /*
Minimal, single-replica, trial-grade Postgres — NOT a substitute for a managed database in
production. See README.md "Why minimal in-chart templates instead of Bitnami subcharts" for
why this chart ships its own tiny template instead of depending on an upstream subchart.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $fullname := include "algenta.fullname" . -}}
{{- $secretName := printf "%s-postgresql" $fullname -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgresql.password -}}
{{- if not $password -}}
  {{- if $existing -}}
    {{- $password = index $existing.data "postgres-password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "postgresql") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
  selector:
    {{- include "algenta.selectorLabels" (dict "root" $ "component" "postgresql") | nindent 4 }}
---
{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "postgresql") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
  {{- if .Values.postgresql.persistence.storageClassName }}
  storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "postgresql") | nindent 4 }}
spec:
  # Single replica by construction: this is a trial convenience, not a clustered database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "algenta.selectorLabels" (dict "root" $ "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algenta.labels" (dict "root" $ "component" "postgresql") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-postgresql
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
