{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "algenta.fullname" . }}-api
  labels:
    {{- include "algenta.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "algenta.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
{{- end }}
