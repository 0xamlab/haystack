name: decision-engine

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: decision-engine-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decision_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decision_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: decision-engine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── MinIO (S3-compatible object store) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: decision-engine-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── MinIO bucket initialization ────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: decision-engine-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/decision-engine-results &&
        echo 'MinIO bucket initialized'
      "
    restart: "no"

  # ─── API Server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: decision-engine-api
    environment:
      API_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/decision_engine
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/decision_engine
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET_NAME: decision-engine-results
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      MOJO_BINARY_PATH: /app/mojo_build/simulate
      JWT_SECRET: local-dev-jwt-secret-change-in-production
      WEBHOOK_SIGNING_SECRET: local-dev-webhook-secret
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
      ALGENTA_RUNTIME_DIR: /home/app/.algenta/runtime
      ALGENTA_AGENT_CORE_URL: http://sidecar:8787
      ALGENTA_AGENT_CORE_TOKEN: ${AGENT_CORE_AUTH_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload in development — mount source code
      - ../../apps:/app/apps:ro
      - ../../mojo_build:/app/mojo_build:ro
      - runtime_data:/home/app/.algenta
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    command: >
      uvicorn apps.api_server.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/apps

  # ─── Background Worker ───────────────────────────────────────────────────────
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: decision-engine-worker
    environment:
      API_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/decision_engine
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/decision_engine
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET_NAME: decision-engine-results
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      MOJO_BINARY_PATH: /app/mojo_build/simulate
      ALGENTA_RUNTIME_DIR: /home/app/.algenta/runtime
      ALGENTA_AGENT_CORE_URL: http://sidecar:8787
      ALGENTA_AGENT_CORE_TOKEN: ${AGENT_CORE_AUTH_TOKEN:-}
    volumes:
      - ../../apps:/app/apps:ro
      - ../../mojo_build:/app/mojo_build:ro
      - runtime_data:/home/app/.algenta
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    restart: unless-stopped

  # ─── Agent-core sidecar (forked-Cline execution head) ────────────────────────
  sidecar:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.sidecar
    container_name: decision-engine-sidecar
    environment:
      AGENT_CORE_HOST: 0.0.0.0
      AGENT_CORE_PORT: "8787"
      AGENT_CORE_AUTH_TOKEN: ${AGENT_CORE_AUTH_TOKEN:-}
      AGENT_CORE_REQUIRE_AUTH: ${AGENT_CORE_REQUIRE_AUTH:-0}
      ALGENTA_DEPLOYMENT_MODE: ${ALGENTA_DEPLOYMENT_MODE:-self_hosted}
      ALGENTA_RUNTIME_DIR: /home/app/.algenta/runtime
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - runtime_data:/home/app/.algenta
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  runtime_data:
