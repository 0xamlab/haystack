# Wave-C C4 chaos harness LB — round-robins across the api replicas so two concurrent decision-plan
# requests land on DIFFERENT replicas (exercising the cross-node dedup lock). Docker's embedded DNS
# (127.0.0.11) returns all replica IPs; re-resolving per request via a variable proxy_pass (rather
# than a plain `proxy_pass http://api:8000`, which caches a single IP at startup) gives real fan-out.
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;   # long enough for a verified_agentic planner run
        proxy_connect_timeout 10s;
    }
}
