# Algenta Decision Engine — Self-Hosted Service Stack
# One-line install: curl -fsSL https://algenta.ai/install.sh | bash
#
# Services:
#   api       — FastAPI backend (port 8000)
#   worker    — Async job worker
#   postgres  — PostgreSQL 16
#   redis     — Redis 7
#   minio     — S3-compatible object storage

name: algenta

services:
  # ── API Server ────────────────────────────────────────────────────────────
  api:
    image: ${ALGENTA_IMAGE_REGISTRY:-ghcr.io/algenta/decision-engine}/api:${ALGENTA_IMAGE_TAG:?set ALGENTA_IMAGE_TAG to a pinned image tag or digest - install.sh resolves it; never ship a floating tag}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_ENV: ${API_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_PREFIX: ${API_KEY_PREFIX:-de_live_}
      API_KEY_TEST_PREFIX: ${API_KEY_TEST_PREFIX:-de_test_}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      MOJO_BINARY_PATH: /app/mojo_build/simulate
      MOJO_TIMEOUT_SECONDS: ${MOJO_TIMEOUT_SECONDS:-30}
      MOJO_MAX_CONCURRENT: ${MOJO_MAX_CONCURRENT:-4}
      RUNTIME_FALLBACK_MODE: ${RUNTIME_FALLBACK_MODE:-deny}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-algenta-results}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-algenta_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-algenta_minio_secret}
      RESULT_STORAGE_ENABLED: ${RESULT_STORAGE_ENABLED:-true}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@algenta.local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALGENTA_SOURCES_DIR: ${ALGENTA_SOURCES_DIR:-/home/app/.algenta/sources}
      ALGENTA_RUNTIME_DIR: ${ALGENTA_RUNTIME_DIR:-/home/app/.algenta/runtime}
      ALGENTA_AGENT_CORE_URL: ${ALGENTA_AGENT_CORE_URL:-http://sidecar:8787}
      ALGENTA_AGENT_CORE_TOKEN: ${AGENT_CORE_AUTH_TOKEN:-}
      # Loopback URL + key the agent head uses to call back into /v1, and the KEK that encrypts
      # per-tenant provider keys at rest. The engine block is only attached to the agent task spec
      # when ALGENTA_ENGINE_URL is set. Sourced from .env so they survive restarts.
      ALGENTA_ENGINE_URL: ${ALGENTA_ENGINE_URL:-http://api:8000}
      ALGENTA_ENGINE_API_KEY: ${ALGENTA_ENGINE_API_KEY:-}
      ALGENTA_API_KEY: ${ALGENTA_API_KEY:-}
      ALGENTA_CONFIG_ENCRYPTION_KEY: ${ALGENTA_CONFIG_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./data/logs:/app/logs
      - sources_data:/home/app/.algenta

  # ── Async Worker ──────────────────────────────────────────────────────────
  worker:
    image: ${ALGENTA_IMAGE_REGISTRY:-ghcr.io/algenta/decision-engine}/worker:${ALGENTA_IMAGE_TAG:?set ALGENTA_IMAGE_TAG to a pinned image tag or digest - install.sh resolves it; never ship a floating tag}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      MOJO_BINARY_PATH: /app/mojo_build/simulate
      RUNTIME_FALLBACK_MODE: ${RUNTIME_FALLBACK_MODE:-deny}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-algenta-results}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-algenta_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-algenta_minio_secret}
      RESULT_STORAGE_ENABLED: ${RESULT_STORAGE_ENABLED:-true}
      ALGENTA_RUNTIME_DIR: ${ALGENTA_RUNTIME_DIR:-/home/app/.algenta/runtime}
      ALGENTA_SOURCES_DIR: ${ALGENTA_SOURCES_DIR:-/home/app/.algenta/sources}
      ALGENTA_AGENT_CORE_URL: ${ALGENTA_AGENT_CORE_URL:-http://sidecar:8787}
      ALGENTA_AGENT_CORE_TOKEN: ${AGENT_CORE_AUTH_TOKEN:-}
      # The worker re-resolves per-tenant keys from the DB (needs the KEK) and builds the same agent
      # task_spec (needs ALGENTA_ENGINE_URL + the engine-callback key). Sourced from .env (durable).
      ALGENTA_ENGINE_URL: ${ALGENTA_ENGINE_URL:-http://api:8000}
      ALGENTA_ENGINE_API_KEY: ${ALGENTA_ENGINE_API_KEY:-}
      ALGENTA_API_KEY: ${ALGENTA_API_KEY:-}
      ALGENTA_CONFIG_ENCRYPTION_KEY: ${ALGENTA_CONFIG_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    volumes:
      # Shared with the sidecar: the worker materializes the snapshot working_dir, the
      # sidecar mutates files in it (until artifacts move to the object store, Wave B8).
      - sources_data:/home/app/.algenta

  # ── Agent-core sidecar (forked-Cline execution head) ──────────────────────
  # Built + published by escrypto-labs/codna (the agent head's home), consumed over the unchanged
  # HTTP seam. NOTE: this is a private GHCR image — the deploy host needs read:packages access to
  # ghcr.io/escrypto-labs/codna. Override the image via ALGENTA_SIDECAR_IMAGE.
  sidecar:
    image: ${ALGENTA_SIDECAR_IMAGE:-ghcr.io/escrypto-labs/codna/sidecar:latest}
    restart: unless-stopped
    # Scale horizontally with `docker compose up --scale sidecar=N`; api/worker reach it
    # via the round-robin `sidecar` service DNS, and /ready sheds load from busy replicas.
    environment:
      AGENT_CORE_HOST: 0.0.0.0
      AGENT_CORE_PORT: "8787"
      AGENT_CORE_MAX_CONCURRENCY: ${AGENT_CORE_MAX_CONCURRENCY:-8}
      AGENT_CORE_AUTH_TOKEN: ${AGENT_CORE_AUTH_TOKEN:-}
      AGENT_CORE_REQUIRE_AUTH: ${AGENT_CORE_REQUIRE_AUTH:-0}
      ALGENTA_DEPLOYMENT_MODE: ${ALGENTA_DEPLOYMENT_MODE:-self_hosted}
      ALGENTA_RUNTIME_DIR: ${ALGENTA_RUNTIME_DIR:-/home/app/.algenta/runtime}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALGENTA_AGENT_PROVIDER: ${ALGENTA_AGENT_PROVIDER:-}
      ALGENTA_AGENT_MODEL: ${ALGENTA_AGENT_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - sources_data:/home/app/.algenta

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algenta}
      POSTGRES_USER: ${POSTGRES_USER:-algenta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algenta_secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algenta} -d ${POSTGRES_DB:-algenta}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"  # Localhost only — do not expose publicly

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"  # Localhost only

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-algenta_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-algenta_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"   # S3 API (localhost only)
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # MinIO Console (localhost only)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO setup (create bucket on first run) ──────────────────────────────
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-algenta_minio} ${S3_SECRET_ACCESS_KEY:-algenta_minio_secret} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-algenta-results} &&
      mc anonymous set download local/${S3_BUCKET_NAME:-algenta-results} &&
      echo 'MinIO bucket ready'
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  sources_data:
    driver: local
