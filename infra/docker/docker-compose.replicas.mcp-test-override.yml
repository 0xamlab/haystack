# Test-only overlay for tests/test_mcp_multi_replica_lb.py, layered ON TOP of the real
# docker-compose.yml + docker-compose.replicas.yml (both unmodified) via:
#
#   docker compose -f docker-compose.yml -f docker-compose.replicas.yml \
#     -f docker-compose.replicas.mcp-test-override.yml up postgres redis minio minio-init api lb
#
# What this changes, and why, so it stays honest about what's real vs. adjusted for this sandbox:
#
#  1. `api.depends_on` drops the `sidecar` (agent-core) dependency. The MCP JSON-RPC tool calls
#     this test drives (list/log/execute decisions, create/approve agent runs) never invoke agent
#     execution, so the sidecar is orthogonal to what's under test here (replica fan-out + LB
#     correctness for MCP). The real sidecar image is a private ghcr.io/thyn-ai/codna package;
#     an environment without registry credentials for it (this sandbox, verified: `docker pull`
#     of the pinned digest returns "unauthorized") could otherwise never bring the real compose
#     stack up at all. `worker` is simply omitted from the `up` service list below (nothing
#     depends on it for this scenario, so compose never starts it or its own sidecar dependency).
#     The 3 api replicas, coordination, DB, and LB are otherwise exactly the real deployment shape.
#
#  2. `postgres` / `redis` / `minio` host port bindings are remapped (15432/16379/19000-19001)
#     purely so this test's own compose project doesn't collide with services already bound to
#     5432/6379/9000-9001 on the host machine running the suite. Every service still talks to
#     every other service over the compose-internal network at their normal ports (postgres:5432,
#     redis:6379, minio:9000) -- only the HOST-side mapping (used solely by the test process to
#     seed a real org/API key straight into this stack's real Postgres) moves.
#
#  3. `lb.volumes` swaps in nginx-replicas-lb.mcp-test.conf -- byte-identical routing to the real
#     nginx-replicas-lb.conf, plus one `add_header X-Upstream $upstream_addr` so the test can
#     observe which replica served each request without instrumenting Algenta's own code.
services:
  api:
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    ports: !override
      - "15432:5432"

  redis:
    ports: !override
      - "16379:6379"

  minio:
    ports: !override
      - "19000:9000"
      - "19001:9001"

  lb:
    volumes: !override
      - ./nginx-replicas-lb.mcp-test.conf:/etc/nginx/conf.d/default.conf:ro
