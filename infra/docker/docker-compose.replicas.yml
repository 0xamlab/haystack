# Wave-C C4 — multi-replica chaos harness (MANUAL / operator-facing).
#
# Overlay on docker-compose.yml that runs the API across 3 replicas + 2 workers behind a
# round-robin LB, with cross-node coordination ACTIVE (Redis lock + the shared object-store lookup
# via MinIO) — the real deployment shape the #94/#95 dedup must hold under. The AUTOMATED
# verification of the dedup is tests/test_multi_replica_chaos.py (CI-gated, real Redis); this harness
# is for manual end-to-end / true-multi-container chaos testing.
#
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.replicas.yml up --build
#
# Then drive the chaos (the LB is on http://localhost:8080):
#   1. DEDUP (#94): fire two identical decision-plan requests concurrently (they land on different
#      api replicas via the LB) -> assert ONE planner run + ONE decision_plan_id (check the api
#      logs for a single "verified_agentic" generation, and that both responses carry the same id).
#   2. CROSS-REPLICA READ: a snapshot/plan created on one replica is GET-able from another (the
#      shared MinIO object store + the shared lookup).
#   3. KILL A REPLICA mid-run: `docker kill <one api/worker replica>` -> a retry completes on a
#      healthy replica; exactly one UsageRecord per logical run.
#   4. REDIS FLAP: `docker pause redis` briefly -> coordinated generations FAIL CLOSED (retryable),
#      never diverge; `docker unpause redis` -> recovery.
#
# Notes: `!reset` clears the base single-replica host-port/container-name so the replicas don't
# collide (compose v2.20+). If your compose is older, comment out the base `api.ports` +
# `api.container_name` instead.

services:
  api:
    container_name: !reset null
    ports: !reset []
    environment:
      ALGENTA_COORDINATION: redis           # cross-node generation lock active
      ALGENTA_RI_OBJECT_STORE: s3           # shared (MinIO) lookup + manifests across replicas
    deploy:
      replicas: 3

  worker:
    container_name: !reset null
    environment:
      ALGENTA_COORDINATION: redis
      ALGENTA_RI_OBJECT_STORE: s3
    deploy:
      replicas: 2

  # Round-robin LB in front of the 3 api replicas. Uses Docker's embedded DNS (127.0.0.11) re-
  # resolved per request so requests fan out across replicas (a plain proxy_pass caches one IP).
  lb:
    image: nginx:1.27-alpine
    container_name: decision-engine-lb
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-replicas-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
