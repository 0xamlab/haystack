# Test-only variant of nginx-replicas-lb.conf for tests/test_mcp_multi_replica_lb.py.
#
# Identical round-robin behavior to the real nginx-replicas-lb.conf (Docker's embedded DNS
# re-resolved per request, so requests fan out across the live api replicas) with ONE addition:
# an X-Upstream response header carrying nginx's own $upstream_addr, so the automated test can
# observe which replica actually served each request without adding any instrumentation to
# Algenta's own application code. This file is never used by any real deployment -- only by this
# one pytest's docker compose invocation (see docker-compose.replicas.mcp-test-override.yml).
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 10s;
        add_header X-Upstream $upstream_addr always;
    }
}
