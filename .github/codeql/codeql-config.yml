name: "Algenta CodeQL config"

# Scan only the shipped product surface. The repo's ~3,360 .py files include large
# trees that are NOT the attack surface — tests (829), generated benchmark math
# libraries (benchmarks/python_libs, ~468), integration examples (~569), build
# artifacts, and SDK dist. Letting GitHub default setup analyze all of them with the
# security-extended suite made "Analyze (python)" take >90 min. Excluding them focuses
# CodeQL on apps/ (engine/API/runtime/MCP/gateway/cli) + packages/ SDK source + scripts.
paths-ignore:
  - tests
  - benchmarks
  - examples
  - build
  - apps/docs
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.min.js"
