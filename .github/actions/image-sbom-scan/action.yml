name: Image SBOM + vulnerability scan
description: >-
  Generate SPDX + CycloneDX SBOMs and a Grype vulnerability report for one already-pushed image,
  referenced by digest, and upload all three as workflow artifacts.

# WHY DIGEST, NOT A TAG. `latest` can move between this job pushing an image and this step
# scanning it (a concurrent run on the same branch, however unlikely) -- a report for "whatever
# `latest` resolves to right now" is not a report for the specific image this job just built. A
# digest is the one reference that cannot silently point somewhere else mid-job.
#
# WHY THIS IS ADVISORY, NOT A GATE. Every image already has known CVEs in its base OS packages the
# day it's built -- that is normal, not a build defect, and turning it into a hard failure on day
# one would either block every release or get disabled at the first false-positive-shaped
# annoyance. This uploads the evidence so it is visible and diffable release-over-release. Making
# specific severities blocking is a follow-up, done deliberately once there is a triaged baseline
# to ratchet against -- the same pattern this repo already uses for its own reliability guards
# (`scripts/reliability_guards`, `baselined=True`): visibility first, blocking once there is
# something real to ratchet.
#
# WHY NOT COSIGN SIGNING HERE TOO. A cosign signing key is a permanent trust anchor once any
# customer starts verifying against its public half -- rotating it later is disruptive, unlike
# adding a new SBOM format or scanner. That is an owner decision (which key custody model, whether
# keyless is acceptable for air-gapped customers who cannot reach Rekor/Fulcio), not something to
# fold into a scan-and-report step. Tracked separately.

inputs:
  image-ref:
    description: Fully-qualified, digest-pinned image reference (registry/name@sha256:...).
    required: true
  artifact-prefix:
    description: Prefix for the uploaded artifact names (e.g. "api", "worker", "engine").
    required: true
  registry:
    description: Registry host the image was pushed to (for the login syft/grype need to pull it).
    required: true
  registry-username:
    description: Registry username.
    required: true
  registry-password:
    description: Registry password/token.
    required: true

runs:
  using: composite
  steps:
    - name: Log in so syft/grype can pull the image by digest
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    # ── Reclaim the runner's disk before scanning, and record how much there was ──────────
    # MEASURED, not speculative. On main at be51fd2ba all three Build & Push Docker jobs died
    # inside this composite with:
    #
    #   WARN Failed to activate downloaded database from /home/runner/.cache/grype/db/grype-db-download...
    #   WARN error updating db error=unable to activate new vulnerability database: failed to
    #        hydrate database: failed to open db: unable to migrate: database or disk is full (13)
    #   ERROR 2 errors occurred:
    #     * failed to load vulnerability db: database does not exist
    #     * failed to catalog: ... podman: podman not available: no host address
    #
    # ubuntu-latest gives a job ~14 GB, and by the time this runs the runner is still holding the
    # buildkit state from the build that just pushed. Grype downloads its vulnerability DB to a
    # temp dir and then MIGRATES it into place, which needs roughly twice the DB size transiently
    # -- so DB hydration is what tips the disk over, not the scan.
    #
    # That contradicts ci.yml's build-jobs comment ("No `docker builder/image prune` step appears
    # anywhere below, and none should ever need to again"), which reasoned that one job per image
    # on a fresh runner leaves nothing to accumulate. True ACROSS jobs, false WITHIN one: a single
    # build+push+scan is enough to exceed 14 GB. ci.yml's own rule -- "escalate a job to `thyn-8c`
    # only on a measured ENOSPC" -- is now satisfied, but escalation is the expensive lever and the
    # cheap one has not been tried. Pruning is safe here specifically because the scan no longer
    # reads anything off this disk: it pulls by digest from the registry (see `registry:` below).
    #
    # `df` is printed whether or not the prune helps, so the next ENOSPC arrives with a measurement
    # attached instead of a guess.
    - name: Reclaim build disk before scanning (measured ENOSPC on ubuntu-latest)
      shell: bash
      run: |
        set -uo pipefail
        echo "=== disk before reclaim"
        df -h / /home/runner 2>/dev/null | sed 's/^/  /'
        docker builder prune --all --force >/dev/null 2>&1 || true
        docker image prune --all --force >/dev/null 2>&1 || true
        docker system prune --all --force --volumes >/dev/null 2>&1 || true
        echo "=== disk after reclaim"
        df -h / /home/runner 2>/dev/null | sed 's/^/  /'

    # WHY `registry:` AND NOT A BARE REF. syft and grype resolve an unprefixed image reference by
    # trying, in order, the Docker daemon, then Podman, then containerd, and only then the
    # registry. ubuntu-latest has no podman socket, so that probe fails with "podman: podman not
    # available: no host address" -- the second error above -- and the docker-daemon path first
    # PULLS the image and `docker save`s it to a tarball on the same 14 GB disk, which is the
    # first. The `registry:` scheme skips every container runtime and streams the compressed layers
    # straight from GHCR: no daemon copy, no podman probe, and a digest-pinned ref (see the header
    # for why this action always receives one) is exactly what a registry pull wants. Safe here and
    # only here -- the image is already pushed, so there is no local-only image that a
    # registry-only source would fail to find.
    - name: Generate SPDX SBOM
      uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
      with:
        image: registry:${{ inputs.image-ref }}
        format: spdx-json
        output-file: ${{ inputs.artifact-prefix }}-sbom.spdx.json
        upload-artifact: false

    - name: Generate CycloneDX SBOM
      uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
      with:
        image: registry:${{ inputs.image-ref }}
        format: cyclonedx-json
        output-file: ${{ inputs.artifact-prefix }}-sbom.cyclonedx.json
        upload-artifact: false

    - name: Scan for known vulnerabilities (advisory — see header)
      # Never fails the job on a FINDING: `fail-build: false`. This step's purpose is the artifact
      # it produces, not a pass/fail gate — see the composite action's own header comment for why.
      #
      # `fail-build: false` is NOT immunity from failure, which is what let this break main: it
      # suppresses failing on discovered CVE severities, not on grype being unable to run at all. A
      # DB that cannot hydrate exits non-zero and fails the step -- and so the job -- with no
      # vulnerability finding involved. That is why the disk is reclaimed above instead of the
      # failure being waved through here.
      uses: anchore/scan-action@8576240a41341d866dbd7ebc72cd9fc0ef023f54 # v7.4.2
      id: grype
      with:
        image: registry:${{ inputs.image-ref }}
        fail-build: false
        output-format: json
        add-cpes-if-none: true

    - name: Rename the vulnerability report for a clear artifact name
      shell: bash
      run: cp "${{ steps.grype.outputs.json }}" "${{ inputs.artifact-prefix }}-vulnerabilities.json"

    - name: Upload SBOM + vulnerability report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-prefix }}-supply-chain-${{ github.run_id }}
        path: |
          ${{ inputs.artifact-prefix }}-sbom.spdx.json
          ${{ inputs.artifact-prefix }}-sbom.cyclonedx.json
          ${{ inputs.artifact-prefix }}-vulnerabilities.json
        retention-days: 90
