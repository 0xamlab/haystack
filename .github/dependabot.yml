version: 2
updates:
  # GitHub Actions: weekly, grouped into a single PR -- the same action is pinned by SHA at
  # many call sites across these workflows, and a one-PR bump is reviewable where a dozen
  # single-action PRs would not be. thyn-ai/security-toolchain is excluded: its own
  # propagate.yml is the one bumper for that pin (it carries required caller `permissions:`
  # forward when a release adds one; a routine Dependabot digest bump would not).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "thyn-ai/security-toolchain*"
    commit-message:
      prefix: "chore(ci)"

  # App dependencies: security-only. open-pull-requests-limit: 0 disables routine version-bump
  # PRs (dependency bumps here are reviewed and made deliberately); Dependabot security
  # updates are a separate mechanism keyed off GitHub Security Advisories and still open
  # regardless of this limit.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # TypeScript SDK: packages/ts-sdk keeps its own npm lockfile (the root is a pnpm project with
  # no `workspaces` field, so the "/" npm entry above never sees this manifest) and is what
  # .github/workflows/sync-public-sdk.yml mirrors to the public thyn-ai/algenta-sdk repo.
  # Security-only, same as the other app entries.
  - package-ecosystem: "npm"
    directory: "/packages/ts-sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ts-sdk)"

  - package-ecosystem: "pip"
    directory: "/apps/api-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(api-server)"

  # MCP server image (packages/mcp/Dockerfile -- mirrored to the public SDK repo and built by
  # e.g. the Docker MCP Toolkit): its base image is pinned by digest, and this entry is what moves
  # that digest when python:3.12-slim-bookworm is rebuilt. Moving to a new Python line is a
  # deliberate change (the same stance as the app entries above), so tag bumps are ignored.
  - package-ecosystem: "docker"
    directory: "/packages/mcp"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(mcp)"

  # MCP server pip locks (packages/mcp/requirements.txt + requirements-build.txt, hash-pinned
  # for the Dockerfile's --require-hashes installs): weekly and grouped so the pinned versions
  # and their hashes keep moving in one reviewable PR. A bump that pyproject.toml pins exactly
  # is a deliberate change and gets reviewed like any other dependency bump here.
  - package-ecosystem: "pip"
    directory: "/packages/mcp"
    schedule:
      interval: "weekly"
    groups:
      mcp-pip-locks:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(mcp)"
