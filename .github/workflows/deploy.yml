name: Deploy to Fly

# Manual deploy of the prebuilt GHCR images to the Fly apps (codna-api / codna-engine).
# Run AFTER `make bootstrap` (apps + secrets must already exist). Local Docker isn't required:
# this mirrors each private image through Fly's own registry (registry.fly.io) so the Machines
# can pull it. Requires repo secret FLY_API_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. git-abc1234). Default: latest"
        required: false
        default: "latest"
      target:
        description: "Which app(s) to deploy"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - engine
          - api
          - control-plane
          - all

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Fly
    # Compute: algenta Azure CI plane -- one ephemeral self-hosted VM per job (provisioned by infra/ci); was ubuntu-latest.
    runs-on: [self-hosted, az-ephemeral]
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SRC: ghcr.io/${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install flyctl
        # $HOME/.fly is one path shared by every self-hosted runner process on this user
        # account -- concurrent deploys racing the installer is the same shared-path race the
        # fleet convention isolates elsewhere (ci.yml's pnpm dest, flyctl FLYCTL_INSTALL).
        run: |
          export FLYCTL_INSTALL="$RUNNER_TEMP/fly"
          curl -fsSL https://fly.io/install.sh | sh
          echo "$FLYCTL_INSTALL/bin" >> "$GITHUB_PATH"

      # The engine image is pushed by CI under the codna PAT (it pulls the private codna sidecar
      # base), so it is NOT readable by GITHUB_TOKEN. CODNA_GHCR_READ_TOKEN (broad read:packages)
      # reads all three images (api/worker/engine), so use it for the deploy-time pull.
      - name: Log in to GHCR (pull the private prebuilt images)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CODNA_GHCR_READ_TOKEN }}

      - name: Authenticate Docker to the Fly registry
        run: flyctl auth docker

      - name: Deploy engine (worker + sidecar)
        if: ${{ inputs.target == 'both' || inputs.target == 'engine' || inputs.target == 'all' }}
        run: |
          set -euo pipefail
          # Architecture-agnostic deploy: images are built linux/amd64 (the Fly target) --
          # pin the pull to the image platform, never inherit the runner's arch.
          docker pull --platform linux/amd64  "$SRC/engine:$TAG"
          docker tag   "$SRC/engine:$TAG" "registry.fly.io/codna-engine:$TAG"
          docker push  "registry.fly.io/codna-engine:$TAG"
          flyctl deploy -c fly.engine.toml -a codna-engine -i "registry.fly.io/codna-engine:$TAG"
          flyctl scale count 1 -a codna-engine --yes

      - name: Deploy api
        if: ${{ inputs.target == 'both' || inputs.target == 'api' || inputs.target == 'all' }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64  "$SRC/api:$TAG"
          bash scripts/verify_api_image_mojo_server_mode.sh "$SRC/api:$TAG"
          docker tag   "$SRC/api:$TAG" "registry.fly.io/codna-api:$TAG"
          docker push  "registry.fly.io/codna-api:$TAG"
          flyctl deploy -c fly.api.toml -a codna-api -i "registry.fly.io/codna-api:$TAG"

      # The control plane reuses the SAME api image (role flag) but owns its OWN Postgres, so its
      # release_command runs `alembic upgrade head` against algenta-control-plane-pg — this is what
      # applies 0042 to the DB that backs api.algenta.ai billing/devices/license.
      - name: Deploy control-plane
        if: ${{ inputs.target == 'control-plane' || inputs.target == 'all' }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64  "$SRC/api:$TAG"
          docker tag   "$SRC/api:$TAG" "registry.fly.io/algenta-control-plane:$TAG"
          docker push  "registry.fly.io/algenta-control-plane:$TAG"
          flyctl deploy -c fly.control-plane.toml -a algenta-control-plane -i "registry.fly.io/algenta-control-plane:$TAG"
