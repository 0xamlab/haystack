# Releases two different things, on two different mechanisms:
#   - algenta-mcp (PyPI only): published directly from here, by token, same as always.
#   - algenta-sdk (PyPI + npm, the extracted public SDK): this repo no longer publishes it at
#     all. This job signs a release authorization (version + exact thyn-ai/algenta-sdk commit +
#     contract-file digest + Ed25519 signature) and hands it to that repo via a reviewable PR;
#     a human then tags the authorized commit `sdk-vX.Y.Z` in thyn-ai/algenta-sdk, which triggers
#     that repo's own release.yml to actually build and `npm publish`/`twine upload`. This split
#     exists because PyPI/npm Trusted Publishing only issues genuine source-to-package provenance
#     for a workflow that runs from a PUBLIC repository — this repo is private, algenta-sdk isn't.
#     See the approved SDK-repo extraction plan's Step 4 amendment for the full rationale.
#
# Flow: guard (license/version drift) -> build + dry-run checks (always) -> publish-pypi (mcp) +
# sign-release-authorization (algenta-sdk), in parallel. Only a tag push (sdk-v*) triggers a real
# release; workflow_dispatch remains available for dry-run/testpypi rehearsals
# (`gh workflow run release-sdks.yml -f target=dry-run`) and for a manual `pypi` run if a tag push
# isn't the trigger source for some reason.
#
# SECURITY NOTE (post SDK-repo-goes-public hardening): this workflow used to also trigger on every
# push to `main`, auto-publishing on merge. That's removed — the source for these SDKs is now also
# mirrored into the public, forkable thyn-ai/algenta-sdk repo (source-only, no publish credentials
# there), so a release here must only ever happen from a deliberate, signed `sdk-v*` tag, never
# implicitly from an ordinary merge. See the approved SDK-repo plan for the full rationale.
#
# PREREQUISITES:
#   - Repo secret `PYPI_TOKEN` = a PyPI API token with upload rights for algenta-mcp (the `algenta`
#     + native pair is published only by build-runtime.yml). The real-publish job reads this via
#     `secrets.PYPI_TOKEN`. For the optional TestPyPI rehearsal, add a separate `TEST_PYPI_TOKEN`.
#   - The GitHub `release` environment must have required-reviewers protection configured (repo
#     Settings -> Environments -> release). This was removed 2026-08-05; re-enabling it is a repo
#     settings change, not something this YAML file can declare on its own — track as a follow-up.
#   - Repo secret `SDK_RELEASE_SIGNING_PRIVATE_KEY` = the PEM-encoded Ed25519 private key whose
#     public half is embedded in thyn-ai/algenta-sdk's release.yml
#     (scripts/verify_release_authorization.py's TRUSTED_PUBLIC_KEYS["sdk-release-2026-08"]).
#     TODO(owner): this secret is not yet set — sign-release-authorization cannot succeed until it
#     is. Never let this key touch algenta-sdk; only its public half does.
#   - Same GitHub App as sync-public-sdk.yml (ALGENTA_SDK_SYNC_APP_ID /
#     ALGENTA_SDK_SYNC_APP_PRIVATE_KEY) is reused here to open the authorization PR — no new App
#     needed, its existing `contents` + `pull_requests` scope on thyn-ai/algenta-sdk is sufficient.

name: release-sdks

on:
  push:
    # Tag-only: a deliberate `sdk-v*` tag is the only thing that triggers a real publish. Versions
    # already on the indexes are skipped, so a re-tagged/re-run publish is a harmless no-op.
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - dry-run # guard + build/pack checks only — no upload
          - testpypi # rehearse: publish algenta-mcp to test.pypi.org
          - pypi # real release: publish algenta-mcp + sign the algenta-sdk release authorization
        default: dry-run

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

# All jobs run on the self-hosted macOS fleet: GitHub-hosted runners are billing-blocked for
# this org, and the pypa publish action is a Docker container action that GitHub executes only
# on Linux hosts -- so Python publishing goes through native twine (same as build-runtime.yml).

jobs:
  guard:
    name: license + version guard (D2)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # Fails if any public SDK is not Apache-2.0, versions diverge, or a LICENSE is missing.
      # The test is pure-stdlib (tomllib + json), so pytest is the only dependency to install.
      # -c /dev/null ignores the app's pytest config (asyncio plugin etc.) and --noconftest skips
      # tests/conftest.py (which imports httpx + the app stack) so the guard needs no app deps.
      # (setup-python's macOS pkg installer needs passwordless sudo the fleet doesn't have --
      # venv the runner's Homebrew python3.14 instead.)
      - run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install --quiet --disable-pip-version-check --upgrade pytest
          "$RUNNER_TEMP/guard-venv/bin/python" -m pytest -q -c /dev/null -p no:cacheprovider --noconftest tests/test_sdk_package_metadata.py
      - name: Tag-vs-package version agreement (only when triggered by a tag)
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('packages/python-sdk/pyproject.toml','rb'))['project']['version'])")"
          TS_VERSION="$(node -p "require('./packages/ts-sdk/package.json').version" 2>/dev/null || python3 -c "import json; print(json.load(open('packages/ts-sdk/package.json'))['version'])")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$TS_VERSION" ]; then
            echo "::error::Tag sdk-v$TAG_VERSION does not match package versions (python-sdk=$PKG_VERSION, ts-sdk=$TS_VERSION)" >&2
            exit 1
          fi

  build:
    name: build + dry-run checks (no publish)
    needs: guard
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build + check the Python SDKs (wheel + sdist + metadata)
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/build-venv"
          . "$RUNNER_TEMP/build-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build twine
          # `algenta` owns the `algenta` import/command; `mcp` builds `algenta-mcp`. The proprietary
          # runtime dependency and `algenta` are released together by build-runtime.yml.
          for pkg in python-sdk algenta mcp; do
            python -P -m build "packages/$pkg"
            twine check "packages/$pkg"/dist/*
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Fleet convention (ci.yml): package-manager caches stay off on self-hosted runners --
          # their bookkeeping assumes GitHub-hosted cache paths. A cold `npm ci` against the
          # lockfile costs seconds here; not worth a cache-portability risk.
          package-manager-cache: false
      - name: Build + pack the TS SDK (dry-run)
        working-directory: packages/ts-sdk
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --dry-run

  publish-testpypi:
    name: rehearse publish to TestPyPI (token)
    needs: build
    if: ${{ inputs.target == 'testpypi' }}
    environment: release # TODO(owner): re-enable required-reviewers protection on this environment
    permissions:
      contents: read # token auth via TEST_PYPI_TOKEN — no id-token / Trusted Publishing
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Publish algenta-mcp to TestPyPI
        # Native twine: the pypa action is a Linux-only container action (see file header).
        # twine >= 7 accepts core packaging metadata 2.5 (hatchling >= 1.32 emits it).
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/publish-venv"
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build "twine>=7"
          python -P -m build packages/mcp
          twine upload --non-interactive --skip-existing \
            --repository-url https://test.pypi.org/legacy/ \
            packages/mcp/dist/*

  publish-pypi:
    name: publish algenta-mcp to PyPI (token)
    needs: build
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
    environment: release # TODO(owner): re-enable required-reviewers protection on this environment
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build the publishable Python package
        # Native toolchain: the pypa action is a Linux-only container action (see file header).
        # twine >= 7 accepts core packaging metadata 2.5 (hatchling >= 1.32 emits it).
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/publish-venv"
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build "twine>=7"
          python -P -m build packages/mcp
      - name: Publish algenta-mcp
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          twine upload --non-interactive --skip-existing packages/mcp/dist/*

  sign-release-authorization:
    name: sign algenta-sdk release authorization (no publish happens here)
    needs: [guard, build]
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
    environment: release # TODO(owner): re-enable required-reviewers protection on this environment
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Regenerate contract snapshots (must match what's about to be verified)
        run: python3 scripts/generate_platform_contract_artifacts.py

      - name: Resolve the version being released
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('packages/python-sdk/pyproject.toml','rb'))['project']['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Mint a short-lived installation token for the sync App
        id: app-token
        # Same fleet-proxy fix as sync-public-sdk.yml's identical step.
        env:
          NODE_USE_ENV_PROXY: "1"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALGENTA_SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.ALGENTA_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: thyn-ai
          repositories: algenta-sdk

      - name: Check out the public SDK repo alongside this one
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: thyn-ai/algenta-sdk
          path: algenta-sdk-checkout
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Refuse to sign unless algenta-sdk's source actually matches this tested tree
        # sync-public-sdk.yml is what's supposed to keep these in sync via a human-reviewed PR.
        # This is the safety net: never sign an authorization for public source this test run
        # didn't actually validate, e.g. because a sync PR is still open/unmerged.
        run: |
          set -euo pipefail
          EXCLUDES=(--exclude=build --exclude='*.egg-info' --exclude=node_modules --exclude=dist \
            --exclude=.git --exclude=tests --exclude=__pycache__ --exclude='*.pyc' \
            --exclude=_build_info.py --exclude=_build_info.ts)
          for pkg in python-sdk ts-sdk; do
            if ! diff -rq "${EXCLUDES[@]}" "packages/$pkg" "algenta-sdk-checkout/packages/$pkg"; then
              echo "::error::thyn-ai/algenta-sdk's packages/$pkg doesn't match this repo's tree -- refusing to sign. Run sync-public-sdk.yml and merge its PR first." >&2
              exit 1
            fi
          done

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - run: python -m pip install --quiet --disable-pip-version-check cryptography

      - name: Sign the release authorization
        env:
          SDK_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.SDK_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/sdk_release_signing_private.pem"
          printf '%s' "$SDK_RELEASE_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          python scripts/sign_sdk_release_authorization.py \
            --version "${{ steps.version.outputs.version }}" \
            --sdk-checkout algenta-sdk-checkout \
            --private-key-file "$KEY_FILE" \
            --out "$RUNNER_TEMP/release-authorization.json"
          rm -f "$KEY_FILE"

      - name: Open a PR delivering the authorization into algenta-sdk
        working-directory: algenta-sdk-checkout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The commit this authorization covers is main's CURRENT tip -- i.e. whatever
          # sync-public-sdk.yml's last merged PR left behind, matched against this tested tree
          # two steps ago. It is NOT the commit this step is about to create (that one only adds
          # the authorization file itself, and may not even survive as-is through a squash-merge).
          # The human must tag THIS sha, read back out of the signed file itself so there is only
          # one source of truth for it, not re-derived here and risk drifting from what was signed.
          AUTHORIZED_COMMIT="$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/release-authorization.json'))['sdk_commit'])")"
          git config user.name "algenta-sdk-sync[bot]"
          git config user.email "algenta-sdk-sync[bot]@users.noreply.github.com"
          BRANCH="authorize/sdk-v${VERSION}"
          git checkout -b "$BRANCH"
          mkdir -p releases/authorization
          cp "$RUNNER_TEMP/release-authorization.json" "releases/authorization/sdk-v${VERSION}.json"
          git add "releases/authorization/sdk-v${VERSION}.json"
          if git diff --cached --quiet; then
            echo "Authorization for sdk-v${VERSION} already delivered — clean no-op."
            exit 0
          fi
          git commit -m "release: authorize sdk-v${VERSION} @ ${AUTHORIZED_COMMIT}"
          git push origin "$BRANCH"
          gh pr create \
            --repo thyn-ai/algenta-sdk \
            --base main \
            --head "$BRANCH" \
            --title "release: authorize sdk-v${VERSION}" \
            --body "Signed by thyn-ai/algenta's private test suite (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          After merging this PR, tag commit \`${AUTHORIZED_COMMIT}\` (main's tip **before** this PR — not this PR's own commit, and not necessarily main's tip after merging) as \`sdk-v${VERSION}\` to trigger release.yml:

              git tag sdk-v${VERSION} ${AUTHORIZED_COMMIT}
              git push origin sdk-v${VERSION}"
