# Publish the public client SDKs (Apache-2.0, per D2): algenta-sdk (PyPI + npm) and algenta-mcp (PyPI).
#
# Flow: guard (license/version drift) -> build + dry-run checks (always) -> publish. A tag push
# (sdk-v*) publishes to the REAL indexes; workflow_dispatch picks `target`: dry-run (checks only),
# testpypi (rehearse the Python publish against test.pypi.org), or pypi (real publish, same as a tag).
# PyPI publishing uses a token for the existing projects; npm uses provenance.
#
# PREREQUISITES:
#   - Repo secret `PYPI_TOKEN` = a PyPI API token with upload rights for algenta-sdk and
#     algenta-mcp. The `algenta` + native pair is published only by build-runtime.yml. The
#     real-publish job reads this token via `secrets.PYPI_TOKEN`. For the optional TestPyPI
#     rehearsal, add a separate `TEST_PYPI_TOKEN` (a test.pypi.org token).
#   - The GitHub `release` environment (the manual-approval gate) must exist with REQUIRED REVIEWERS —
#     publish jobs (including the TestPyPI rehearsal) block until a reviewer approves.
#   - For npm: either configure npm OIDC trusted publishing, or set the `NPM_TOKEN` secret (an
#     automation token with publish rights on `algenta-sdk`). npm has no test registry — its rehearsal
#     is the build job's `npm pack --dry-run` plus the ts-sdk-artifact-install CI gate.

name: release-sdks

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - dry-run # guard + build/pack checks only — no upload
          - testpypi # rehearse: publish the Python SDKs to test.pypi.org
          - pypi # real publish to PyPI + npm (same as a tag push)
        default: dry-run

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

jobs:
  guard:
    name: license + version guard (D2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Fails if any public SDK is not Apache-2.0, versions diverge, or a LICENSE is missing.
      # The test is pure-stdlib (tomllib + json), so pytest is the only dependency to install.
      # -c /dev/null ignores the app's pytest config (asyncio plugin etc.) and --noconftest skips
      # tests/conftest.py (which imports httpx + the app stack) so the guard needs no app deps.
      - run: |
          python -m pip install --upgrade pytest
          python -m pytest -q -c /dev/null -p no:cacheprovider --noconftest tests/test_sdk_package_metadata.py

  build:
    name: build + dry-run checks (no publish)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build + check the Python SDKs (wheel + sdist + metadata)
        run: |
          python -m pip install --upgrade build twine
          # `algenta` owns the `algenta` import/command; `mcp` builds `algenta-mcp`. The proprietary
          # runtime dependency and `algenta` are released together by build-runtime.yml.
          for pkg in python-sdk algenta mcp; do
            python -P -m build "packages/$pkg"
            twine check "packages/$pkg"/dist/*
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/ts-sdk/package-lock.json
      - name: Build + pack the TS SDK (dry-run)
        working-directory: packages/ts-sdk
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --dry-run

  publish-testpypi:
    name: rehearse publish to TestPyPI (token, manual approval)
    needs: build
    if: ${{ inputs.target == 'testpypi' }}
    environment: release # same manual-approval gate as the real publish — a faithful rehearsal
    permissions:
      contents: read # token auth via TEST_PYPI_TOKEN — no id-token / Trusted Publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade build
          for pkg in python-sdk algenta mcp; do python -P -m build "packages/$pkg"; done
      - name: Publish algenta-sdk to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: packages/python-sdk/dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          skip-existing: true # re-runs of the same version no-op instead of erroring
      - name: Publish algenta-mcp to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: packages/mcp/dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          skip-existing: true

  publish-pypi:
    name: publish to PyPI (token, manual approval)
    needs: build
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
    environment: release # required reviewers on this env = the manual-approval gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade build
          for pkg in python-sdk algenta mcp; do python -P -m build "packages/$pkg"; done
      - name: Publish algenta-sdk
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: packages/python-sdk/dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
      - name: Publish algenta-mcp
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: packages/mcp/dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  publish-npm:
    name: publish to npm (provenance, manual approval)
    needs: build
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
    environment: release
    permissions:
      id-token: write # npm provenance
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/ts-sdk/package-lock.json
      - name: Build + publish
        working-directory: packages/ts-sdk
        run: |
          # --ignore-scripts: don't run third-party dependency install scripts (e.g. protobufjs
          # postinstall) in the job that holds the npm publish token. prepack=tsc (first-party)
          # still runs on publish and builds dist/.
          npm ci --ignore-scripts
          npm run build
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "algenta-sdk@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "algenta-sdk@$VERSION is already published; skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
