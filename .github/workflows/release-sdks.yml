# Releases two different things, on two different mechanisms:
#   - algenta-mcp (PyPI only): published directly from here, by token, same as always.
#   - algenta-sdk (PyPI + npm, the extracted public SDK): this repo never publishes it. Instead
#     the sdk-release job below drives the WHOLE chain automatically, in order:
#       1. mirror packages/python-sdk + packages/ts-sdk (and examples/) from the tested tree
#          DIRECTLY onto thyn-ai/algenta-sdk's main,
#       2. re-run the diff guard as the verification backstop,
#       3. sign the release authorization (version + exact algenta-sdk commit + contract-file
#          digest + Ed25519 signature),
#       4. commit the authorization DIRECTLY onto algenta-sdk's main,
#       5. tag the authorized commit sdk-vX.Y.Z on algenta-sdk, which triggers that repo's own
#          release.yml (D0 gate: authorization fetched from its main + signature/commit/contract
#          verification) to build and `npm publish`/`twine upload`.
#     WHY direct pushes instead of the old reviewable PRs + human tagging: the mirrored content
#     is algenta's own PR-gated main-branch source -- it already passed algenta's full CI before
#     it could ever be tagged here, so a separate human review of the mirror/authorization PRs
#     was redundant ceremony (and a failure mode: an unmerged PR stranded the release). The
#     authorization is machine-signed; the Ed25519 signing key remains the trust anchor, and
#     algenta-sdk's release.yml still refuses to publish anything D0 cannot verify. The sync App
#     token used for these pushes never exists outside this run and holds no publish credentials.
#     This split exists because PyPI/npm Trusted Publishing only issues genuine
#     source-to-package provenance for a workflow that runs from a PUBLIC repository -- this repo
#     is private, algenta-sdk isn't. See the approved SDK-repo extraction plan's Step 4 amendment.
#
# Flow: guard (license/version drift) -> build + dry-run checks (always) -> publish-pypi (mcp) +
# sdk-release (algenta-sdk chain), in parallel. Only a tag push (sdk-v*) triggers a real
# release; workflow_dispatch remains available for dry-run/testpypi rehearsals
# (`gh workflow run release-sdks.yml -f target=dry-run`), an end-to-end SDK-chain rehearsal that
# touches neither repo's remote state nor any registry (`-f target=sdk-rehearse`), and a manual
# `pypi` run if a tag push isn't the trigger source for some reason.
#
# IDEMPOTENCY: rerunning the same tag is safe and GREEN. Each step first checks its target
# state -- mirror already in sync -> skip push; authorization for this version already on main
# AND its authorized tree still identical to the tested tree -> REUSE it verbatim (no re-sign,
# no push -- re-signing against main's moved tip would manufacture a conflicting authorization);
# tag already exists at the authorized commit -> skip. A tag that exists at a DIFFERENT commit,
# or an authorization whose tree no longer matches the tested source (new source under an
# already-authorized version), fails loud and is never overwritten.
#
# SECURITY NOTE (post SDK-repo-goes-public hardening): this workflow used to also trigger on every
# push to `main`, auto-publishing on merge. That's removed — the source for these SDKs is now also
# mirrored into the public, forkable thyn-ai/algenta-sdk repo (source-only, no publish credentials
# there), so a release here must only ever happen from a deliberate, signed `sdk-v*` tag, never
# implicitly from an ordinary merge. See the approved SDK-repo plan for the full rationale.
#
# PREREQUISITES:
#   - Repo secret `PYPI_TOKEN` = a PyPI API token with upload rights for algenta-mcp (the `algenta`
#     + native pair is published only by build-runtime.yml). The real-publish job reads this via
#     `secrets.PYPI_TOKEN`. For the optional TestPyPI rehearsal, add a separate `TEST_PYPI_TOKEN`.
#   - The GitHub `release` environment must have required-reviewers protection configured (repo
#     Settings -> Environments -> release). This was removed 2026-08-05; re-enabling it is a repo
#     settings change, not something this YAML file can declare on its own — track as a follow-up.
#   - Repo secret `SDK_RELEASE_SIGNING_PRIVATE_KEY` = the PEM-encoded Ed25519 private key whose
#     public half is embedded in thyn-ai/algenta-sdk's release.yml
#     (scripts/verify_release_authorization.py's TRUSTED_PUBLIC_KEYS["sdk-release-2026-08"]).
#     Set and proven in production (it signed the sdk-v1.0.8 authorization). Never let this key
#     touch algenta-sdk; only its public half does.
#   - Same GitHub App as sync-public-sdk.yml (ALGENTA_SDK_SYNC_APP_ID /
#     ALGENTA_SDK_SYNC_APP_PRIVATE_KEY) is reused here — no new App needed. Its `contents` scope
#     on thyn-ai/algenta-sdk covers the direct main/tag pushes this chain makes. NOTE: those
#     pushes require the App to be a bypass actor on algenta-sdk's default-branch ruleset (the
#     ruleset's pull_request rule otherwise rejects direct pushes) — configured in repo settings,
#     not declarable here. `pull_requests` scope is retained for sync-public-sdk.yml only.

name: release-sdks

on:
  push:
    # Tag-only: a deliberate `sdk-v*` tag is the only thing that triggers a real publish. Versions
    # already on the indexes are skipped, so a re-tagged/re-run publish is a harmless no-op.
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - dry-run # guard + build/pack checks only — no upload, no algenta-sdk side effects
          - testpypi # rehearse: publish algenta-mcp to test.pypi.org
          - sdk-rehearse # full algenta-sdk chain EXCEPT all pushes: mirror diffed+logged not pushed, authorization signed+verified not delivered, tag resolved not pushed
          - pypi # real release: publish algenta-mcp + run the full algenta-sdk chain
        default: dry-run

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

# All jobs run on the self-hosted macOS fleet: GitHub-hosted runners are billing-blocked for
# this org, and the pypa publish action is a Docker container action that GitHub executes only
# on Linux hosts -- so Python publishing goes through native twine (same as build-runtime.yml).

jobs:
  guard:
    name: license + version guard (D2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Fails if any public SDK is not Apache-2.0, versions diverge, or a LICENSE is missing.
      # The test is pure-stdlib (tomllib + json), so pytest is the only dependency to install.
      # -c /dev/null ignores the app's pytest config (asyncio plugin etc.) and --noconftest skips
      # tests/conftest.py (which imports httpx + the app stack) so the guard needs no app deps.
      # (setup-python's macOS pkg installer needs passwordless sudo the fleet doesn't have --
      # venv the runner's Homebrew python3.14 instead.)
      - run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install --quiet --disable-pip-version-check --upgrade pytest
          "$RUNNER_TEMP/guard-venv/bin/python" -m pytest -q -c /dev/null -p no:cacheprovider --noconftest tests/test_sdk_package_metadata.py
      - name: Tag-vs-package version agreement (only when triggered by a tag)
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('packages/python-sdk/pyproject.toml','rb'))['project']['version'])")"
          TS_VERSION="$(node -p "require('./packages/ts-sdk/package.json').version" 2>/dev/null || python3 -c "import json; print(json.load(open('packages/ts-sdk/package.json'))['version'])")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$TS_VERSION" ]; then
            echo "::error::Tag sdk-v$TAG_VERSION does not match package versions (python-sdk=$PKG_VERSION, ts-sdk=$TS_VERSION)" >&2
            exit 1
          fi

  build:
    name: build + dry-run checks (no publish)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build + check the Python SDKs (wheel + sdist + metadata)
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/build-venv"
          . "$RUNNER_TEMP/build-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build twine
          # `algenta` owns the `algenta` import/command; `mcp` builds `algenta-mcp`. The proprietary
          # runtime dependency and `algenta` are released together by build-runtime.yml.
          for pkg in python-sdk algenta mcp; do
            python -P -m build "packages/$pkg"
            twine check "packages/$pkg"/dist/*
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Fleet convention (ci.yml): package-manager caches stay off on self-hosted runners --
          # their bookkeeping assumes GitHub-hosted cache paths. A cold `npm ci` against the
          # lockfile costs seconds here; not worth a cache-portability risk.
          package-manager-cache: false
      - name: Build + pack the TS SDK (dry-run)
        working-directory: packages/ts-sdk
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --dry-run

  publish-testpypi:
    name: rehearse publish to TestPyPI (token)
    needs: build
    if: ${{ inputs.target == 'testpypi' }}
    environment: release # TODO(owner): re-enable required-reviewers protection on this environment
    permissions:
      contents: read # token auth via TEST_PYPI_TOKEN — no id-token / Trusted Publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Publish algenta-mcp to TestPyPI
        # Native twine: the pypa action is a Linux-only container action (see file header).
        # twine >= 7 accepts core packaging metadata 2.5 (hatchling >= 1.32 emits it).
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/publish-venv"
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build "twine>=7"
          python -P -m build packages/mcp
          twine upload --non-interactive --skip-existing \
            --repository-url https://test.pypi.org/legacy/ \
            packages/mcp/dist/*

  publish-pypi:
    name: publish algenta-mcp to PyPI (token)
    needs: build
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
    environment: release # TODO(owner): re-enable required-reviewers protection on this environment
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build the publishable Python package
        # Native toolchain: the pypa action is a Linux-only container action (see file header).
        # twine >= 7 accepts core packaging metadata 2.5 (hatchling >= 1.32 emits it).
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/publish-venv"
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build "twine>=7"
          python -P -m build packages/mcp
      - name: Publish algenta-mcp
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          twine upload --non-interactive --skip-existing packages/mcp/dist/*

  sdk-release:
    name: sync + sign + deliver + tag algenta-sdk (fully automated; no publish here)
    needs: [guard, build]
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' || inputs.target == 'sdk-rehearse' }}
    environment: release # TODO(owner): re-enable required-reviewers protection on this environment
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # REHEARSE runs every step of the chain EXCEPT the pushes (mirror, authorization, tag):
      # the diff is computed and logged, the authorization is signed and verified against
      # algenta-sdk's own verifier, but nothing reaches algenta-sdk's remotes or any registry.
      REHEARSE: ${{ inputs.target == 'sdk-rehearse' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Regenerate contract snapshots (must match what's about to be verified)
        run: python3 scripts/generate_platform_contract_artifacts.py

      - name: Resolve the version being released
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('packages/python-sdk/pyproject.toml','rb'))['project']['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Mint a short-lived installation token for the sync App
        id: app-token
        # Same fleet-proxy fix as sync-public-sdk.yml's identical step.
        env:
          NODE_USE_ENV_PROXY: "1"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALGENTA_SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.ALGENTA_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: thyn-ai
          repositories: algenta-sdk

      - name: Check out the public SDK repo alongside this one
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: thyn-ai/algenta-sdk
          path: algenta-sdk-checkout
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      # --- Inline mirror sync (replaces the old sync-public-sdk PR + human merge) -------------
      # WHY a direct push: the mirrored content is this repo's own PR-gated main-branch source --
      # it already passed algenta's full CI to get here, so a separate human review of the mirror
      # was redundant ceremony (and a failure mode: an unmerged sync PR stranded sdk-v1.0.9's
      # signing). The Ed25519 signature produced below remains the trust anchor for what the
      # public repo is allowed to publish. sync-public-sdk.yml stays available as a manual
      # repair/review path via its workflow_dispatch trigger.
      - name: Mirror the two SDK packages into the algenta-sdk checkout
        working-directory: algenta-sdk-checkout
        run: |
          set -euo pipefail
          # Mirror logic is byte-for-byte the one from sync-public-sdk.yml -- keep them in lockstep.
          for pkg in python-sdk ts-sdk; do
            mkdir -p "packages/$pkg"
            # Explicit allowlist copy, not a blind rsync of the whole tree -- anything not
            # matched here simply doesn't cross the boundary. --delete propagates real deletions
            # from this repo, but packages/python-sdk/tests/ is excluded: it's a smoke-test suite
            # that only exists in the public repo (this repo's python-sdk test coverage lives
            # elsewhere, see the guard job above) -- a blind mirror would silently delete it.
            rsync -a --delete --exclude 'build/' --exclude '*.egg-info' --exclude 'node_modules/' \
              --exclude 'dist/' --exclude '.git' --exclude 'tests/' \
              "../packages/$pkg/" "packages/$pkg/"
            # Reject symlinks in what actually got copied (see sync-public-sdk.yml for why the
            # OUTPUT is checked, not the source tree).
            find "packages/$pkg" -type l -print -quit | grep -q . && {
              echo "::error::Refusing to sync -- symlink found in the mirrored output for $pkg" >&2
              exit 1
            }
          done
          # examples/ is also part of the public surface (linked from both package READMEs).
          rm -rf examples
          mkdir -p examples
          rsync -a --exclude '__pycache__' --exclude '*.pyc' ../examples/ examples/

      - name: Install gitleaks
        # Runner-agnostic install under RUNNER_TEMP -- no sudo (same as sync-public-sdk.yml).
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported arch $ARCH"; exit 1 ;;
          esac
          BIN_DIR="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${OS}_${ARCH}.tar.gz" \
            | tar -xz -C "$BIN_DIR" gitleaks
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/gitleaks" version

      - name: Outbound secret + forbidden-path scan (blocks the push, not just warns)
        run: |
          set -euo pipefail
          # --no-git: scans the working tree as plain files, including the just-mirrored changes.
          # Zero unresolved findings required -- a real false positive needs an explicit
          # .gitleaksignore entry, never a silently-loosened scan step.
          gitleaks detect --source algenta-sdk-checkout --no-git --no-banner -v
          # Reject submodules regardless of what the scanner finds.
          find algenta-sdk-checkout/packages -name ".gitmodules" -print -quit | grep -q . && {
            echo "::error::Refusing to sync -- a submodule was found in the export" >&2
            exit 1
          }
          true

      - name: Push the mirror directly to algenta-sdk main (check-if-synced guard)
        working-directory: algenta-sdk-checkout
        run: |
          set -euo pipefail
          git config user.name "algenta-sdk-sync[bot]"
          git config user.email "algenta-sdk-sync[bot]@users.noreply.github.com"
          git add -A packages examples
          if git diff --cached --quiet; then
            echo "Mirror already in sync with this tested tree -- nothing to push (check-if-synced guard)."
            exit 0
          fi
          echo "=== Mirrored changes about to be pushed DIRECTLY to thyn-ai/algenta-sdk main ==="
          git status --porcelain
          git diff --cached --stat
          if [ "$REHEARSE" = "true" ]; then
            echo "REHEARSE mode: mirror diff computed and logged above; NOT committing or pushing."
            exit 0
          fi
          git commit -m "sync: mirror packages/python-sdk + packages/ts-sdk from thyn-ai/algenta@${{ github.sha }}"
          git push origin HEAD:main
          echo "Mirror pushed to thyn-ai/algenta-sdk main."

      - name: Refuse to continue unless algenta-sdk's source actually matches this tested tree
        # Verification backstop for the inline mirror above: with the mirror just pushed (or just
        # verified in sync) this must always pass -- if it ever fails, the mirror step has a bug
        # and nothing below may run.
        run: |
          set -euo pipefail
          EXCLUDES=(--exclude=build --exclude='*.egg-info' --exclude=node_modules --exclude=dist \
            --exclude=.git --exclude=tests --exclude=__pycache__ --exclude='*.pyc' \
            --exclude=_build_info.py --exclude=_build_info.ts)
          for pkg in python-sdk ts-sdk; do
            if ! diff -rq "${EXCLUDES[@]}" "packages/$pkg" "algenta-sdk-checkout/packages/$pkg"; then
              echo "::error::thyn-ai/algenta-sdk's packages/$pkg doesn't match this repo's tree after the inline mirror -- refusing to sign. This indicates a bug in the mirror step above." >&2
              exit 1
            fi
          done

      - name: Check whether this version is already authorized on algenta-sdk main
        # Rerun idempotency for the authorization itself. If main already carries an
        # authorization for this version AND the tree it authorized is still identical to the
        # tested tree (for everything mirrored), the existing authorization is reused verbatim:
        # re-signing against main's NEW tip would manufacture a conflicting authorization for
        # the same version (main has moved past the authorized commit -- e.g. via this chain's
        # own delivery commit or later unrelated merges -- without any source change), which is
        # exactly the state every rerun lands in. Reusing keeps one authorization per version
        # and makes reruns green no-ops. If the authorized tree DIFFERS from the tested tree,
        # new source is trying to publish under an already-authorized version -- never allowed
        # silently: fail loud.
        id: authcheck
        working-directory: algenta-sdk-checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          AUTH_PATH="releases/authorization/sdk-v${VERSION}.json"
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          [ -f "$AUTH_PATH" ] || exit 0
          EXISTING_VERSION="$(python3 -c "import json; print(json.load(open('$AUTH_PATH'))['version'])")"
          EXISTING_COMMIT="$(python3 -c "import json; print(json.load(open('$AUTH_PATH'))['sdk_commit'])")"
          if [ "$EXISTING_VERSION" != "$VERSION" ]; then
            echo "::error::The authorization file at $AUTH_PATH says version '$EXISTING_VERSION', not '$VERSION' -- refusing to continue. Investigate manually." >&2
            exit 1
          fi
          if ! git cat-file -e "${EXISTING_COMMIT}^{commit}" 2>/dev/null; then
            echo "::error::The authorization at $AUTH_PATH references sdk_commit $EXISTING_COMMIT, which is not in algenta-sdk's history -- refusing to continue. Investigate manually." >&2
            exit 1
          fi
          if git diff --quiet "$EXISTING_COMMIT" HEAD -- packages examples; then
            echo "A valid authorization for sdk-v${VERSION} is already on main and its authorized tree is still identical to this tested tree (for everything mirrored) -- REUSING it; not re-signing, not pushing (check-if-authorized guard)."
            cp "$AUTH_PATH" "$RUNNER_TEMP/release-authorization.json"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::An authorization for sdk-v${VERSION} already exists on algenta-sdk main (sdk_commit ${EXISTING_COMMIT}), but its authorized tree DIFFERS from this tested tree in packages/ or examples/ -- refusing to overwrite or reuse it. New source cannot publish under an already-authorized version: bump the version, or investigate manually." >&2
          exit 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - run: python -m pip install --quiet --disable-pip-version-check cryptography

      - name: Sign the release authorization
        if: ${{ steps.authcheck.outputs.reuse != 'true' }}
        env:
          SDK_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.SDK_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/sdk_release_signing_private.pem"
          printf '%s' "$SDK_RELEASE_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          python scripts/sign_sdk_release_authorization.py \
            --version "${{ steps.version.outputs.version }}" \
            --sdk-checkout algenta-sdk-checkout \
            --private-key-file "$KEY_FILE" \
            --out "$RUNNER_TEMP/release-authorization.json"
          rm -f "$KEY_FILE"

      - name: Deliver the authorization directly to algenta-sdk main
        # Runs only when authcheck found no reusable authorization for this version. WHY a
        # direct push: this file is machine-generated and machine-signed -- there is nothing
        # for a human to review (the signature IS the review). Committing it straight to main
        # removes the "authorization PR left unmerged" failure mode that stranded sdk-v1.0.8.
        if: ${{ steps.authcheck.outputs.reuse != 'true' }}
        working-directory: algenta-sdk-checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          AUTH_PATH="releases/authorization/sdk-v${VERSION}.json"
          mkdir -p releases/authorization
          if [ -f "$AUTH_PATH" ]; then
            # authcheck already decided this case: an existing file whose tree no longer
            # matches means a version collision -- it exits 1 there, so this is unreachable
            # except as defense-in-depth.
            echo "::error::Unexpected: $AUTH_PATH appeared after authcheck -- refusing to overwrite." >&2
            exit 1
          fi
          if [ "$REHEARSE" = "true" ]; then
            echo "REHEARSE mode: signed authorization below; NOT delivering it to algenta-sdk."
            cat "$RUNNER_TEMP/release-authorization.json"
            exit 0
          fi
          AUTHORIZED_COMMIT="$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/release-authorization.json'))['sdk_commit'])")"
          cp "$RUNNER_TEMP/release-authorization.json" "$AUTH_PATH"
          git add "$AUTH_PATH"
          git commit -m "release: authorize sdk-v${VERSION} @ ${AUTHORIZED_COMMIT}"
          git push origin HEAD:main
          echo "Authorization for sdk-v${VERSION} pushed to thyn-ai/algenta-sdk main."

      - name: Verify the signed authorization against algenta-sdk's own gate (rehearse only)
        if: ${{ inputs.target == 'sdk-rehearse' }}
        working-directory: algenta-sdk-checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Closes the rehearsal loop: the artifact this job WOULD deliver (or reuse) must pass
          # the exact gate (version/commit/contract/signature) release.yml's D0 runs for real.
          # The verifier checks HEAD of --repo-root against sdk_commit, so run it in a worktree
          # OF the authorized commit (which on the reuse path is behind main's tip).
          AUTH_COMMIT="$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/release-authorization.json'))['sdk_commit'])")"
          VERIFY_ROOT="$RUNNER_TEMP/verify-at-sdk-commit"
          git worktree add "$VERIFY_ROOT" "$AUTH_COMMIT"
          python scripts/verify_release_authorization.py \
            --authorization-file "$RUNNER_TEMP/release-authorization.json" \
            --expected-version "$VERSION" \
            --repo-root "$VERIFY_ROOT"
          git worktree remove --force "$VERIFY_ROOT"
          echo "Rehearsal verification passed: D0 would accept this authorization."

      - name: Tag the authorized commit on algenta-sdk (check-if-tagged guard)
        working-directory: algenta-sdk-checkout
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Read back out of the signed file itself so there is only one source of truth for
          # the authorized commit, never re-derived here.
          AUTHORIZED_COMMIT="$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/release-authorization.json'))['sdk_commit'])")"
          TAG="sdk-v${VERSION}"
          # Does the tag already exist, and if so, does it point at the authorized commit?
          # NB: `|| EXISTING_OBJ=""` -- on a 404 gh can leave error-body text on stdout, which
          # must never be mistaken for a resolved ref (tested).
          EXISTING_OBJ="$(gh api "repos/thyn-ai/algenta-sdk/git/refs/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null)" || EXISTING_OBJ=""
          case "$EXISTING_OBJ" in
            ""|"tag "*|"commit "*) ;;
            *) echo "::error::Unexpected response resolving tag $TAG on thyn-ai/algenta-sdk: '$EXISTING_OBJ' -- refusing to continue." >&2; exit 1 ;;
          esac
          if [ -n "$EXISTING_OBJ" ]; then
            OBJ_TYPE="${EXISTING_OBJ%% *}"
            OBJ_SHA="${EXISTING_OBJ##* }"
            if [ "$OBJ_TYPE" = "tag" ]; then
              OBJ_SHA="$(gh api "repos/thyn-ai/algenta-sdk/git/tags/$OBJ_SHA" --jq '.object.sha')"
            fi
            if [ "$OBJ_SHA" = "$AUTHORIZED_COMMIT" ]; then
              echo "Tag $TAG already exists at the authorized commit $AUTHORIZED_COMMIT -- nothing to do (check-if-tagged guard)."
              exit 0
            fi
            echo "::error::Tag $TAG already exists but points at $OBJ_SHA, not the authorized commit $AUTHORIZED_COMMIT -- refusing to move it. Investigate manually." >&2
            exit 1
          fi
          if [ "$REHEARSE" = "true" ]; then
            echo "REHEARSE mode: would tag $AUTHORIZED_COMMIT as $TAG on thyn-ai/algenta-sdk; NOT pushing."
            exit 0
          fi
          # Annotated tag, matching how sdk-v1.0.8 was cut: carries the authorization provenance.
          git tag -a "$TAG" "$AUTHORIZED_COMMIT" -m \
            "release: algenta-sdk ${VERSION}, authorized by thyn-ai/algenta run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "refs/tags/$TAG"
          echo "Pushed $TAG -> $AUTHORIZED_COMMIT; thyn-ai/algenta-sdk's release.yml (D0 gate) now drives the publish."
