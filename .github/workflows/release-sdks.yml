# Publish the public client SDKs (Apache-2.0, per D2): algenta-sdk (PyPI + npm) and algenta-mcp (PyPI).
#
# Flow: guard (license/version drift) -> build + dry-run checks (always) -> publish. A tag push
# (sdk-v*) publishes to the REAL indexes; workflow_dispatch picks `target`: dry-run (checks only),
# testpypi (rehearse the Python publish against test.pypi.org), or pypi (real publish, same as a tag).
# PyPI publishing uses a token for the existing projects; npm uses provenance.
#
# PREREQUISITES:
#   - Repo secret `PYPI_TOKEN` = a PyPI API token with upload rights for algenta-sdk and
#     algenta-mcp. The `algenta` + native pair is published only by build-runtime.yml. The
#     real-publish job reads this token via `secrets.PYPI_TOKEN`. For the optional TestPyPI
#     rehearsal, add a separate `TEST_PYPI_TOKEN` (a test.pypi.org token).
#   - The GitHub `release` environment exists but carries NO protection rules since
#     2026-08-05 (the required-reviewers gate was removed): publishes proceed
#     automatically — no human approval, per the fully-automated release policy.
#   - For npm: either configure npm OIDC trusted publishing, or set the `NPM_TOKEN` secret (an
#     automation token with publish rights on `algenta-sdk`). npm has no test registry — its rehearsal
#     is the build job's `npm pack --dry-run` plus the ts-sdk-artifact-install CI gate.

name: release-sdks

on:
  push:
    # Fully automated: SDK changes landing on main publish on their own (same policy as
    # build-runtime.yml — no manual triggers, no approval gates). Versions already on the
    # indexes are skipped, so an unbumped merge is a harmless no-op publish.
    branches: [main]
    tags: ["sdk-v*"]
    paths:
      - "packages/python-sdk/**"
      - "packages/ts-sdk/**"
      - "packages/mcp/**"
      - "tests/test_sdk_package_metadata.py"
      - ".github/workflows/release-sdks.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - dry-run # guard + build/pack checks only — no upload
          - testpypi # rehearse: publish the Python SDKs to test.pypi.org
          - pypi # real publish to PyPI + npm (same as a tag push)
        default: dry-run

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

# All jobs run on the self-hosted macOS fleet: GitHub-hosted runners are billing-blocked for
# this org, and the pypa publish action is a Docker container action that GitHub executes only
# on Linux hosts -- so Python publishing goes through native twine (same as build-runtime.yml).

jobs:
  guard:
    name: license + version guard (D2)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # Fails if any public SDK is not Apache-2.0, versions diverge, or a LICENSE is missing.
      # The test is pure-stdlib (tomllib + json), so pytest is the only dependency to install.
      # -c /dev/null ignores the app's pytest config (asyncio plugin etc.) and --noconftest skips
      # tests/conftest.py (which imports httpx + the app stack) so the guard needs no app deps.
      # (setup-python's macOS pkg installer needs passwordless sudo the fleet doesn't have --
      # venv the runner's Homebrew python3.14 instead.)
      - run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/pip" install --quiet --disable-pip-version-check --upgrade pytest
          "$RUNNER_TEMP/guard-venv/bin/python" -m pytest -q -c /dev/null -p no:cacheprovider --noconftest tests/test_sdk_package_metadata.py

  build:
    name: build + dry-run checks (no publish)
    needs: guard
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build + check the Python SDKs (wheel + sdist + metadata)
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/build-venv"
          . "$RUNNER_TEMP/build-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build twine
          # `algenta` owns the `algenta` import/command; `mcp` builds `algenta-mcp`. The proprietary
          # runtime dependency and `algenta` are released together by build-runtime.yml.
          for pkg in python-sdk algenta mcp; do
            python -P -m build "packages/$pkg"
            twine check "packages/$pkg"/dist/*
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Fleet convention (ci.yml): package-manager caches stay off on self-hosted runners --
          # their bookkeeping assumes GitHub-hosted cache paths. A cold `npm ci` against the
          # lockfile costs seconds here; not worth a cache-portability risk.
          package-manager-cache: false
      - name: Build + pack the TS SDK (dry-run)
        working-directory: packages/ts-sdk
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --dry-run

  publish-testpypi:
    name: rehearse publish to TestPyPI (token)
    needs: build
    if: ${{ inputs.target == 'testpypi' }}
    environment: release # no protection rules since 2026-08-05 — proceeds without approval
    permissions:
      contents: read # token auth via TEST_PYPI_TOKEN — no id-token / Trusted Publishing
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Publish algenta-sdk + algenta-mcp to TestPyPI
        # Native twine: the pypa action is a Linux-only container action (see file header).
        # twine >= 7 accepts core packaging metadata 2.5 (hatchling >= 1.32 emits it).
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/publish-venv"
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build "twine>=7"
          for pkg in python-sdk mcp; do
            python -P -m build "packages/$pkg"
          done
          twine upload --non-interactive --skip-existing \
            --repository-url https://test.pypi.org/legacy/ \
            packages/python-sdk/dist/* packages/mcp/dist/*

  publish-pypi:
    name: publish to PyPI (token)
    needs: build
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
    environment: release # no protection rules since 2026-08-05 — proceeds without approval
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build the publishable Python SDKs
        # Native toolchain: the pypa action is a Linux-only container action (see file header).
        # twine >= 7 accepts core packaging metadata 2.5 (hatchling >= 1.32 emits it).
        run: |
          set -euo pipefail
          PY="python${PYTHON_VERSION}"
          "$PY" -m venv "$RUNNER_TEMP/publish-venv"
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          python -m pip install --quiet --disable-pip-version-check --upgrade build "twine>=7"
          for pkg in python-sdk mcp; do
            python -P -m build "packages/$pkg"
          done
      - name: Publish algenta-sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          twine upload --non-interactive --skip-existing packages/python-sdk/dist/*
      - name: Publish algenta-mcp
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/publish-venv/bin/activate"
          twine upload --non-interactive --skip-existing packages/mcp/dist/*

  publish-npm:
    name: publish to npm (provenance)
    needs: build
    if: ${{ github.event_name == 'push' || inputs.target == 'pypi' }}
    environment: release
    permissions:
      id-token: write # npm provenance
      contents: read
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          # Fleet convention (ci.yml): no package-manager caches on self-hosted runners.
          package-manager-cache: false
      - name: Build + publish
        working-directory: packages/ts-sdk
        run: |
          # --ignore-scripts: don't run third-party dependency install scripts (e.g. protobufjs
          # postinstall) in the job that holds the npm publish token. prepack=tsc (first-party)
          # still runs on publish and builds dist/.
          npm ci --ignore-scripts
          npm run build
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "algenta-sdk@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "algenta-sdk@$VERSION is already published; skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
