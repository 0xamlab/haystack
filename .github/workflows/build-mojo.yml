name: build-mojo

# Manual: build + push the linux/amd64 Mojo engine image (mojo_build/simulate + runtime libs).
# The Dockerfile's RUN compiles Mojo inside BuildKit on the runner's own daemon (the filtered
# build, MOJO_RUNTIME_MODULE_FILTER=ab_testing -- see infra/docker/Dockerfile.mojo), so it is
# not on every push — run it when the Mojo source (mojo/**) or toolchain (mojo_env/pixi.lock)
# changes. The api/worker/engine images COPY the binary from ghcr.io/<repo>/mojo:<tag>.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push Mojo image
    # `thyn-8c` (org larger runner, 8 cores / 32 GB / 300 GB, billed): the Mojo compile runs on
    # the runner's RAM, and the image is only sized "<16 GB" (Dockerfile.mojo). Manual-only, so
    # roughly one billed run per toolchain/source bump. 300 GB of disk means no reclaim step.
    runs-on: thyn-8c
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner is native linux/amd64, the same platform the image targets, so buildx builds
      # it natively -- no qemu/binfmt registration.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mojo
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      - name: Build and push Mojo image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.mojo
          platforms: linux/amd64
          target: export
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
