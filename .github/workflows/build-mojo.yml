name: build-mojo

# Manual: build + push the linux/amd64 Mojo engine image (mojo_build/simulate + runtime libs).
# Heavy + RAM-intensive (compiles ~961 .mojo files), so it's not on every push — run it when the
# Mojo source (mojo/**) or toolchain (mojo_env/pixi.lock) changes. The api/worker/engine images
# COPY the binary from ghcr.io/<repo>/mojo:<tag>.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push Mojo image
    runs-on: ubuntu-latest
    steps:
      # Hosted-VM disk-reclaim hack removed: the self-hosted fleet's VM disk is dedicated.

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The fleet is arm64; the engine image targets Fly's linux/amd64 -- register qemu binfmt
      # so buildx can cross-build (Rosetta serves RUNNING containers, buildx RUN steps need binfmt).
      - name: Register qemu binfmt for linux/amd64
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mojo
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      - name: Build and push Mojo image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.mojo
          platforms: linux/amd64
          target: export
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
