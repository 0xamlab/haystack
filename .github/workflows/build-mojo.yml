name: build-mojo

# Manual: build + push the linux/amd64 Mojo engine image (mojo_build/simulate + runtime libs).
# Heavy + RAM-intensive (compiles ~961 .mojo files), so it's not on every push — run it when the
# Mojo source (mojo/**) or toolchain (mojo_env/pixi.lock) changes. The api/worker/engine images
# COPY the binary from ghcr.io/<repo>/mojo:<tag>.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push Mojo image
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      # Hosted-VM disk-reclaim hack removed: the self-hosted fleet's VM disk is dedicated.

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The fleet is arm64; the engine image targets Fly's linux/amd64 -- register qemu binfmt
      # so buildx can cross-build (Rosetta serves RUNNING containers, buildx RUN steps need binfmt).
      - name: Register qemu binfmt for linux/amd64
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mojo
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      - name: Build and push Mojo image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: infra/docker/Dockerfile.mojo
          platforms: linux/amd64
          target: export
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
