# Build, sign, package, and optionally publish the bundled Algenta runtime.
#
# Public contract: users install `algenta`; the matching per-platform runtime
# artifacts are installed automatically as `algenta-runtime-native`. Users do not
# install a language toolchain, compile binaries, run Docker, or manage a sidecar.
name: build-runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish algenta and algenta-runtime-native wheels to PyPI after build"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    # Fully automated releases: any update to main that touches the runtime surface
    # rebuilds and publishes on its own — no manual triggers and no approval gates (the
    # `release` environment's required-reviewers rule was removed 2026-08-05 after a run
    # sat "waiting" for a human for days). Versions already on PyPI are skipped
    # (skip-existing), so an unbumped merge is a harmless no-op publish; bump
    # packages/*/pyproject.toml to ship a new release.
    branches: [main]
    tags: ["runtime-v*", "runtime-bundle-v*"]
    paths:
      - "mojo/engine/**"
      - "apps/runtime/**"
      - "packages/algenta/**"
      - "packages/algenta-runtime-native/**"
      - "scripts/build_runtime_shards.py"
      - "scripts/generate_runtime_library_dispatch.py"
      - "scripts/stage_runtime_worker_package.py"
      - "mojo_env/pixi.toml"
      - ".github/workflows/build-runtime.yml"
      # The linux leg + clean-machine contract run from these container scripts -- a change
      # to them IS a change to the runtime pipeline.
      - ".github/scripts/_linux_container_bootstrap.sh"
      - ".github/scripts/build_runtime_linux_amd64.sh"
      - ".github/scripts/clean_machine_contract_linux_amd64.sh"

permissions:
  contents: read

concurrency:
  # Per-ref group: a superseded release cut is covered by its successor. This workflow has no
  # pull_request trigger, so nothing is ever cancelled mid-flight.
  group: runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: build bundled runtime wheel (linux-x86_64)
    # `thyn-8c` (org larger runner, 8 cores / 32 GB / 300 GB, BILLED): this job compiles the
    # full 27-shard Mojo runtime (measured 31 min on 8 vCPU). The build runs inside an explicit
    # ubuntu:22.04 container (`docker run`, not job-level `container:`): the scripts hardcode
    # root + the /work mount, and the container's toolchain is the glibc-2.35 link host the
    # manylinux_2_35_x86_64 wheel contract is audited against -- it is load-bearing, not a
    # runner workaround. See .github/scripts/build_runtime_linux_amd64.sh.
    runs-on: thyn-8c
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build linux runtime in an amd64 container
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          docker pull --platform linux/amd64 ubuntu:22.04
          # Direct `docker run` so per-shard progress streams live into the log (a capturing
          # wrapper hid the whole build until exit). SHARD_TIMEOUT keeps headroom over the
          # 900 s hosted-era default; the RSS ceiling is generous next to the measured
          # 1.2-1.8 GiB per-shard peaks on Mojo 1.0.0.
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_SIGNING_KEY -e RUNTIME_RELEASE_PUBLISH \
            -e SHARD_TIMEOUT=2700 -e SHARD_MAX_RSS_MB=32768 \
            ubuntu:22.04 bash .github/scripts/build_runtime_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime/*.whl

  build-linux-cuda:
    name: build bundled runtime wheel (linux-x86_64, CUDA compile gate)
    # COMPILE-GATED lane — compile-verified, launch-UNVERIFIED without NVIDIA hardware.
    # Cross-compiling the portable GPU kernels for NVIDIA targets
    # (`-D ALGENTA_GPU -D ALGENTA_CUDA --target-accelerator sm_90`) needs NO CUDA toolkit and NO
    # GPU: the NVPTX backend ships inside the pinned mojo toolchain and the MAX CUDA runtime
    # (libMGPRT) ships inside linux-64 max-core, both already in the lock. This job proves on
    # every run that the CUDA lane still compiles and links. Launching the result needs an
    # NVIDIA driver >= 580 plus real hardware, which GitHub-hosted runners do not have — so this
    # job is deliberately NOT in clean-machine-contract's or publish-pypi's `needs`, and its
    # wheel is a compile-gate artifact, not a shippable one (publish-pypi downloads release
    # artifacts by explicit name below, so this wheel can never reach PyPI by accident).
    # Serialized AFTER build-linux: `thyn-8c` allows at most 2 concurrent jobs org-wide, and
    # the gate is not on the publish critical path, so it must not hold a second billed slot
    # while the shippable wheel is still building.
    needs: [build-linux]
    runs-on: thyn-8c
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build linux CUDA runtime in an amd64 container
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          docker pull --platform linux/amd64 ubuntu:22.04
          # Same budget as build-linux: the CUDA variant compiles the SAME shard set, with PTX
          # codegen added for the gated kernels (measured 30 min on 8 vCPU).
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_SIGNING_KEY -e RUNTIME_RELEASE_PUBLISH \
            -e BUILD_VARIANT=cuda \
            -e SHARD_TIMEOUT=2700 -e SHARD_MAX_RSS_MB=32768 \
            ubuntu:22.04 bash .github/scripts/build_runtime_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-runtime-native-linux-x86_64-cuda
          path: dist-runtime/*.whl

  clean-machine-contract:
    name: clean-machine contract (no external toolchain)
    needs: [build-linux]
    # No compile here (1 min measured), so plain ubuntu-latest. The contract must execute the
    # LINUX wheel's binaries on the glibc floor the wheel is tagged for, so it runs inside the
    # same ubuntu:22.04 container; the workspace (with the downloaded runtime wheel) is mounted,
    # and the algenta wheel the job builds inside the container stays in the workspace for the
    # artifact upload.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime
      - name: Clean-machine install + runtime doctor (amd64 container)
        env:
          # The contract script's default is 15 ms (native linux x86_64). The budget stays at
          # the explicit 60 ms carried over from the emulated era for the first hosted runs;
          # tighten it back toward 15 once a few native runs have recorded their latencies.
          ALGENTA_CLEAN_MACHINE_WARM_MS_BUDGET: "60"
        run: |
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_CLEAN_MACHINE_WARM_MS_BUDGET \
            ubuntu:22.04 bash .github/scripts/clean_machine_contract_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-package
          path: dist-algenta/*.whl

  publish-pypi:
    name: publish Algenta Python packages to PyPI
    needs: clean-machine-contract
    if: github.event_name == 'push' || inputs.publish == 'true'
    # Publishing is platform-independent: two artifact downloads + one twine upload.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # EXPLICIT artifact names, not the historical `algenta-runtime-native-*` glob: the CUDA
      # compile-gate job above uploads algenta-runtime-native-linux-x86_64-cuda, whose wheel
      # carries the SAME filename as the shipped linux wheel (same package, same platform tag —
      # only the compiled shards inside differ). A glob download merged with `merge-multiple`
      # would non-deterministically overwrite one with the other inside dist-pypi, and the CUDA
      # wheel is launch-unverified: it must never reach PyPI. Compile-gate artifacts stay out of
      # the publish set by construction.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-pypi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-package
          path: dist-pypi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Publish Python packages
        # Native twine rather than the pypa publish action: Twine 7 accepts core packaging
        # metadata 2.5, which hatchling >=1.32 emits for algenta-runtime-native; older Twine
        # rejected it ("Invalid distribution metadata: '2.5' is not a valid metadata version"),
        # failing every release since 2026-08-12. tests/test_sdk_package_metadata.py counts the
        # twine skip-existing idempotence flag below, so do not swap the action back in silently.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check "twine>=7"
          twine upload --non-interactive --skip-existing dist-pypi/*
