# Build, sign, package, and optionally publish the bundled Algenta runtime.
#
# Public contract: users install `algenta`; the matching per-platform runtime
# artifacts are installed automatically as `algenta-runtime-native`. Users do not
# install a language toolchain, compile binaries, run Docker, or manage a sidecar.
name: build-runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish algenta and algenta-runtime-native wheels to PyPI after build"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    # Fully automated releases: any update to main that touches the runtime surface
    # rebuilds and publishes on its own — no manual triggers and no approval gates (the
    # `release` environment's required-reviewers rule was removed 2026-08-05 after a run
    # sat "waiting" for a human for days). Versions already on PyPI are skipped
    # (skip-existing), so an unbumped merge is a harmless no-op publish; bump
    # packages/*/pyproject.toml to ship a new release.
    branches: [main]
    tags: ["runtime-v*", "runtime-bundle-v*"]
    paths:
      - "mojo/engine/**"
      - "apps/runtime/**"
      - "packages/algenta/**"
      - "packages/algenta-runtime-native/**"
      - "scripts/build_runtime_shards.py"
      - "scripts/generate_runtime_library_dispatch.py"
      - "scripts/stage_runtime_worker_package.py"
      - "mojo_env/pixi.toml"
      - ".github/workflows/build-runtime.yml"
      # The linux leg + clean-machine contract run from these container scripts on the
      # self-hosted fleet -- a change to them IS a change to the runtime pipeline.
      - ".github/scripts/_linux_container_bootstrap.sh"
      - ".github/scripts/build_runtime_linux_amd64.sh"
      - ".github/scripts/clean_machine_contract_linux_amd64.sh"

permissions:
  contents: read

concurrency:
  # PRs share ONE fleet-wide group: the amd64 emulation builds queue FIFO and each
  # PR's wheel FINISHES instead of every open PR's container build interleaving on
  # the single Colima VM and wedging it. Non-PR events (main tags/releases) keep a
  # per-ref group; a superseded release cut is covered by its successor.
  # Shared serial slot (see ci.yml): whole fleet finishes one PR run at a time.
  group: runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: build bundled runtime wheel (linux-x86_64)
    # The linux leg runs on the self-hosted macOS fleet inside an amd64 ubuntu:22.04 container:
    # GitHub-hosted runners are billing-blocked for this org, and job-level `container:` requires
    # a Linux runner, so the container is driven explicitly (the same pattern ci.yml already uses
    # for its service containers). Everything inside the container mirrors the hosted pipeline
    # 1:1 -- see .github/scripts/build_runtime_linux_amd64.sh.
    # Compute: algenta Azure CI plane -- one ephemeral self-hosted VM per job (provisioned by infra/ci); was ubuntu-latest.
    runs-on: [self-hosted, az-ephemeral]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build linux runtime in an amd64 container
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          # docker_retry: transient Colima/dockerd flakes (exit 125 / unexpected EOF) wait
          # for the fleet watchdog + guest systemd to heal the daemon, then retry; real
          # build errors still fail immediately.
          bash .github/scripts/docker_retry.sh \
            docker pull --platform linux/amd64 ubuntu:22.04
          # Emulation is slower than the hosted native x86_64 runner, so the per-shard timeout
          # is enlarged (hosted: 900s). The RSS ceiling is generous: fleet machines carry far more
          # RAM than the hosted VM's 7.8 GiB, so no swap-provisioning step is needed.
          bash .github/scripts/docker_retry.sh \
            docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_SIGNING_KEY -e RUNTIME_RELEASE_PUBLISH \
            -e SHARD_TIMEOUT=2700 -e SHARD_MAX_RSS_MB=32768 \
            ubuntu:22.04 bash .github/scripts/build_runtime_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime/*.whl

  build-linux-cuda:
    name: build bundled runtime wheel (linux-x86_64, CUDA compile gate)
    # COMPILE-GATED lane — compile-verified, launch-UNVERIFIED without NVIDIA hardware.
    # Cross-compiling the portable GPU kernels for NVIDIA targets
    # (`-D ALGENTA_GPU -D ALGENTA_CUDA --target-accelerator sm_90`) needs NO CUDA toolkit and NO
    # GPU: the NVPTX backend ships inside the pinned mojo toolchain and the MAX CUDA runtime
    # (libMGPRT) ships inside linux-64 max-core, both already in the lock. This job proves on
    # every run that the CUDA lane still compiles and links. Launching the result needs an
    # NVIDIA driver >= 580 plus real hardware, which the fleet does not have — so this job is
    # deliberately NOT in clean-machine-contract's or publish-pypi's `needs`, and its wheel is a
    # compile-gate artifact, not a shippable one (publish-pypi downloads release artifacts by
    # explicit name below, so this wheel can never reach PyPI by accident).
    # Serialized AFTER build-linux (2026-08-21): all five runners share ONE Colima VM, and two
    # concurrent amd64 emulation builds doubled the peak load until the VM wedged (docker socket
    # AND sshd silent -> watchdog VM restart -> every in-flight container job died with
    # unexpected EOF / exit 125). The gate is not on the publish critical path; stability wins.
    needs: [build-linux]
    runs-on: [self-hosted, az-ephemeral]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build linux CUDA runtime in an amd64 container
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          bash .github/scripts/docker_retry.sh \
            docker pull --platform linux/amd64 ubuntu:22.04
          # Same emulation budget as build-linux: the CUDA variant compiles the SAME shard set,
          # with PTX codegen added for the gated kernels (measured shard-time growth during the
          # spike stays inside this timeout).
          bash .github/scripts/docker_retry.sh \
            docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_SIGNING_KEY -e RUNTIME_RELEASE_PUBLISH \
            -e BUILD_VARIANT=cuda \
            -e SHARD_TIMEOUT=2700 -e SHARD_MAX_RSS_MB=32768 \
            ubuntu:22.04 bash .github/scripts/build_runtime_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-runtime-native-linux-x86_64-cuda
          path: dist-runtime/*.whl

  clean-machine-contract:
    name: clean-machine contract (no external toolchain)
    needs: [build-linux]
    # Was `ubuntu-latest` (GitHub-hosted, billing-blocked). The contract must execute the LINUX
    # wheel's binaries, so it runs inside the same amd64 container on the self-hosted fleet; the
    # workspace (with the downloaded runtime wheel) is mounted, and the algenta wheel the job
    # builds inside the container stays in the workspace for the artifact upload.
    runs-on: [self-hosted, az-ephemeral]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime
      - name: Clean-machine install + runtime doctor (amd64 container)
        env:
          # Native-linux budget is 15 ms; this job now executes under amd64 emulation on the
          # self-hosted macOS fleet, so the tripwire gets an explicit enlarged budget rather
          # than silently weakening the contract script's default.
          ALGENTA_CLEAN_MACHINE_WARM_MS_BUDGET: "60"
        run: |
          bash .github/scripts/docker_retry.sh \
            docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_CLEAN_MACHINE_WARM_MS_BUDGET \
            ubuntu:22.04 bash .github/scripts/clean_machine_contract_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-package
          path: dist-algenta/*.whl

  publish-pypi:
    name: publish Algenta Python packages to PyPI
    needs: clean-machine-contract
    if: github.event_name == 'push' || inputs.publish == 'true'
    # Was `ubuntu-latest` (GitHub-hosted, billing-blocked); publishing is platform-independent.
    runs-on: [self-hosted, az-ephemeral]
    environment: release
    permissions:
      contents: read
    steps:
      # EXPLICIT artifact names, not the historical `algenta-runtime-native-*` glob: the CUDA
      # compile-gate job above uploads algenta-runtime-native-linux-x86_64-cuda, whose wheel
      # carries the SAME filename as the shipped linux wheel (same package, same platform tag —
      # only the compiled shards inside differ). A glob download merged with `merge-multiple`
      # would non-deterministically overwrite one with the other inside dist-pypi, and the CUDA
      # wheel is launch-unverified: it must never reach PyPI. Compile-gate artifacts stay out of
      # the publish set by construction.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-pypi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-package
          path: dist-pypi
      - name: Publish Python packages
        # The pypa action is a Docker container action -- GitHub runs container actions only on
        # Linux hosts, and this fleet is macOS-only ("This action is only able to run under
        # GNU/Linux environments"). A twine upload is plain HTTPS and platform-independent, so
        # call twine directly. Twine 7 (what the old action's v1.14.2 bundled) accepts core
        # packaging metadata 2.5, which hatchling >=1.32 emits for algenta-runtime-native; older
        # Twine rejected it ("Invalid distribution metadata: '2.5' is not a valid metadata
        # version"), failing every release since 2026-08-12.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          python3.14 -m venv "$RUNNER_TEMP/publish-venv"
          "$RUNNER_TEMP/publish-venv/bin/pip" install --quiet --disable-pip-version-check "twine>=7"
          "$RUNNER_TEMP/publish-venv/bin/twine" upload --non-interactive --skip-existing dist-pypi/*
