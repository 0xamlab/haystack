# Build, sign, package, and optionally publish the bundled Algenta runtime.
#
# Public contract: users install `algenta`; the matching per-platform runtime
# artifacts are installed automatically as `algenta-runtime-native`. Users do not
# install a language toolchain, compile binaries, run Docker, or manage a sidecar.
name: build-runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish algenta and algenta-runtime-native wheels to PyPI after build"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    tags: ["runtime-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build bundled runtime wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-14
            platform: darwin
            mcpu: ""
          - target: linux-x86_64
            runs-on: ubuntu-latest
            platform: linux
            mcpu: "x86-64-v3"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | env PIXI_HOME="$GITHUB_WORKSPACE/.pixi" PIXI_BIN_DIR="$GITHUB_WORKSPACE/.pixi/bin" PIXI_NO_PATH_UPDATE=1 bash
          echo "$GITHUB_WORKSPACE/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Mojo/Pixi environment
        run: PIXI_HOME="$GITHUB_WORKSPACE/.pixi" RATTLER_CACHE_DIR="$GITHUB_WORKSPACE/.cache/rattler/cache" pixi install --manifest-path mojo_env/pixi.toml

      - name: Install Linux relink tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Compile runtime worker
        env:
          BINARY_PATH: ${{ github.workspace }}/mojo_build/algenta-runtime-worker
          MOJO_BUILD_MCPU: ${{ matrix.mcpu }}
          PIXI_HOME: ${{ github.workspace }}/.pixi
          RATTLER_CACHE_DIR: ${{ github.workspace }}/.cache/rattler/cache
        run: |
          set -euo pipefail
          bash scripts/build_mojo_binary.sh

      - name: Stage self-contained runtime package
        run: |
          set -euo pipefail
          python3 scripts/stage_runtime_worker_package.py \
            --worker "${GITHUB_WORKSPACE}/mojo_build/algenta-runtime-worker" \
            --lib-root "${GITHUB_WORKSPACE}/mojo_env/.pixi/envs/default/lib" \
            --out "${GITHUB_WORKSPACE}/mojo_build/runtime-wheel" \
            --platform "${{ matrix.platform }}"

      - name: Strip staged runtime artifacts
        run: |
          set -euo pipefail
          cd mojo_build/runtime-wheel
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            for artifact in *; do
              [ -f "$artifact" ] || continue
              strip -x "$artifact" 2>/dev/null || true
            done
          else
            for artifact in *; do
              [ -f "$artifact" ] || continue
              strip --strip-unneeded "$artifact" 2>/dev/null || true
            done
          fi

      - name: Build + sign runtime manifest
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cd mojo_build/runtime-wheel
          python3 - "${{ matrix.target }}" > manifest.json <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          platform = sys.argv[1]
          artifacts = []
          for path in sorted(Path('.').iterdir(), key=lambda p: p.name):
              if not path.is_file() or path.name in {'manifest.json', 'manifest.sig', 'algenta_release_pub.pem'}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({'name': path.name, 'sha256': digest, 'size_bytes': path.stat().st_size})
          if not any(item['name'] == 'algenta-runtime-worker' for item in artifacts):
              raise SystemExit('algenta-runtime-worker missing from staged artifacts')
          payload = {'format_version': 1, 'platform': platform, 'artifacts': artifacts}
          sys.stdout.write(json.dumps(payload, sort_keys=True, separators=(',', ':')))
          PY
          if [ -z "${ALGENTA_SIGNING_KEY:-}" ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              echo "::error::ALGENTA_SIGNING_KEY is unset on a release tag; refusing to emit an unsigned runtime."
              exit 1
            fi
            echo "::warning::ALGENTA_SIGNING_KEY unset on a non-tag build; generating an ephemeral CI-only signing key."
            KEYFILE="$(mktemp)"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$KEYFILE"
          else
            umask 077
            KEYFILE="$(mktemp)"
            printf '%s' "$ALGENTA_SIGNING_KEY" > "$KEYFILE"
          fi
          trap 'rm -f "$KEYFILE"' EXIT
          openssl pkey -in "$KEYFILE" -pubout -out algenta_release_pub.pem
          openssl dgst -sha256 -sign "$KEYFILE" -out manifest.sig manifest.json

      - name: Build + sign Secure Enclave helper (macOS)
        if: runner.os == 'macOS'
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          ALGENTA_SE_CODESIGN_IDENTITY: ${{ secrets.ALGENTA_SE_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${ALGENTA_SIGNING_KEY:-}" ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              echo "::error::ALGENTA_SIGNING_KEY unset on a release tag; refusing to emit an unsigned SE helper."
              exit 1
            fi
            echo "::warning::ALGENTA_SIGNING_KEY unset on a non-tag build; skipping the SE helper."
            exit 0
          fi
          python3 scripts/build_se_helper.py --out mojo_build/runtime-wheel/se --platform "${{ matrix.target }}"

      - name: Build platform runtime wheel
        env:
          ALGENTA_BUNDLE_RUNTIME: "1"
          ALGENTA_RUNTIME_SRC: ${{ github.workspace }}/mojo_build/runtime-wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel packages/algenta-runtime-native --outdir dist-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: algenta-runtime-native-${{ matrix.target }}
          path: dist-runtime/*.whl

  clean-machine-contract:
    name: clean-machine contract (no external toolchain)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime
      - name: Clean-machine install + runtime doctor
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel packages/algenta --outdir dist-algenta
          python -m venv /tmp/clean && . /tmp/clean/bin/activate
          pip install --quiet dist-runtime/*.whl dist-algenta/*.whl
          ! command -v mojo && ! command -v modular || (echo "toolchain unexpectedly present" && exit 1)
          out=$(algenta runtime doctor || true)
          echo "$out"
          echo "$out" | grep -q "runtime source:  bundled runtime"
          echo "$out" | grep -q "mode:            bundled worker"
          echo "$out" | grep -q "fallback:        denied"
          echo "$out" | grep -q "tcp listeners:   none"
          echo "$out" | grep -q "status:          READY"
          forbidden=("mojo command not found" "install Mo""jo" "install Mod""ular" "start daemon" "docker run")
          for bad in "${forbidden[@]}"; do
            if echo "$out" | grep -qi "$bad"; then echo "::error::doctor leaked forbidden runtime setup text"; exit 1; fi
          done
          python - <<'PY'
          import algenta
          from algenta.native import loader
          result = loader.execute({'engine_type': 'runtime_smoke', 'runs': 1})
          if not isinstance(result, dict):
              raise SystemExit('runtime returned non-object payload')
          print('clean-machine contract OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: algenta-package
          path: dist-algenta/*.whl

  publish-pypi:
    name: publish Algenta Python packages to PyPI
    needs: clean-machine-contract
    if: github.event_name == 'push' || inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: algenta-runtime-native-*
          path: dist-pypi
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: algenta-package
          path: dist-pypi
      - name: Publish Python packages
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist-pypi
          password: ${{ secrets.PYPI_TOKEN }}
