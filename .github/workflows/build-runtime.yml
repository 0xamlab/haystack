# Build, sign, package, and optionally publish the bundled Algenta runtime.
#
# Public contract: users install `algenta`; the matching per-platform runtime
# artifacts are installed automatically as `algenta-runtime-native`. Users do not
# install a language toolchain, compile binaries, run Docker, or manage a sidecar.
name: build-runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish algenta and algenta-runtime-native wheels to PyPI after build"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    tags: ["runtime-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build bundled runtime wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-14
            platform: darwin
            mcpu: ""
          - target: linux-x86_64
            runs-on: ubuntu-22.04
            platform: linux
            mcpu: "x86-64-v3"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Verify generated public runtime contract
        run: python3 scripts/generate_algenta_runtime_contract.py --check

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | env PIXI_HOME="$GITHUB_WORKSPACE/.pixi" PIXI_BIN_DIR="$GITHUB_WORKSPACE/.pixi/bin" PIXI_NO_PATH_UPDATE=1 bash
          echo "$GITHUB_WORKSPACE/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Mojo/Pixi environment
        run: PIXI_HOME="$GITHUB_WORKSPACE/.pixi" RATTLER_CACHE_DIR="$GITHUB_WORKSPACE/.cache/rattler/cache" pixi install --manifest-path mojo_env/pixi.toml

      - name: Install Linux relink tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Compile bounded runtime worker shards
        env:
          MOJO_BUILD_MCPU: ${{ matrix.mcpu }}
          PIXI_HOME: ${{ github.workspace }}/.pixi
          RATTLER_CACHE_DIR: ${{ github.workspace }}/.cache/rattler/cache
        run: |
          set -euo pipefail
          python3 scripts/build_runtime_shards.py \
            --out "${GITHUB_WORKSPACE}/mojo_build/runtime-shards" \
            --shard-size 24 \
            --timeout-seconds 300

      - name: Stage self-contained runtime package
        run: |
          set -euo pipefail
          python3 scripts/stage_runtime_worker_package.py \
            --worker-dir "${GITHUB_WORKSPACE}/mojo_build/runtime-shards" \
            --shard-map "${GITHUB_WORKSPACE}/mojo_build/runtime-shards/runtime-shards.json" \
            --lib-root "${GITHUB_WORKSPACE}/mojo_env/.pixi/envs/default/lib" \
            --out "${GITHUB_WORKSPACE}/mojo_build/runtime-wheel" \
            --platform "${{ matrix.platform }}"

      - name: Strip staged runtime artifacts
        run: |
          set -euo pipefail
          cd mojo_build/runtime-wheel
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            for artifact in *; do
              [ -f "$artifact" ] || continue
              strip -x "$artifact" 2>/dev/null || true
            done
            for artifact in *; do
              [ -f "$artifact" ] || continue
              if file -b "$artifact" | grep -q 'Mach-O'; then
                codesign --force --sign - "$artifact"
                codesign --verify --strict "$artifact"
              fi
            done
          else
            for artifact in *; do
              [ -f "$artifact" ] || continue
              strip --strip-unneeded "$artifact" 2>/dev/null || true
            done
          fi

      - name: Build + sign runtime manifest
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          set -euo pipefail
          cd mojo_build/runtime-wheel
          python3 - "${{ matrix.target }}" > manifest.json <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          platform = sys.argv[1]
          artifacts = []
          for path in sorted(Path('.').iterdir(), key=lambda p: p.name):
              if not path.is_file() or path.name in {'manifest.json', 'manifest.sig', 'algenta_release_pub.pem'}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({'name': path.name, 'sha256': digest, 'size_bytes': path.stat().st_size})
          names = {item['name'] for item in artifacts}
          workers = {name for name in names if name == 'algenta-runtime-worker' or name.startswith('algenta-runtime-worker-')}
          if 'algenta-runtime-worker' not in workers or len(workers) < 2:
              raise SystemExit('bounded runtime worker shards missing from staged artifacts')
          if 'runtime-shards.json' not in names:
              raise SystemExit('runtime-shards.json missing from staged artifacts')
          payload = {'format_version': 1, 'platform': platform, 'artifacts': artifacts}
          sys.stdout.write(json.dumps(payload, sort_keys=True, separators=(',', ':')))
          PY
          if [ -z "${ALGENTA_SIGNING_KEY:-}" ]; then
            if [[ "${RUNTIME_RELEASE_PUBLISH:-false}" == "true" ]]; then
              echo "::error::ALGENTA_SIGNING_KEY is unset for a release publish; refusing to emit a runtime signed by an ephemeral key."
              exit 1
            fi
            echo "::warning::ALGENTA_SIGNING_KEY unset on a non-publishing build; generating an ephemeral CI-only signing key."
            KEYFILE="$(mktemp)"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$KEYFILE"
          else
            umask 077
            KEYFILE="$(mktemp)"
            printf '%s' "$ALGENTA_SIGNING_KEY" > "$KEYFILE"
          fi
          trap 'rm -f "$KEYFILE"' EXIT
          openssl pkey -in "$KEYFILE" -pubout -out algenta_release_pub.pem
          TRUSTED_PUB="$GITHUB_WORKSPACE/packages/algenta/algenta/_keys/algenta_release_pub.pem"
          if [ -n "${ALGENTA_SIGNING_KEY:-}" ] && ! cmp -s algenta_release_pub.pem "$TRUSTED_PUB"; then
            echo "::error::ALGENTA_SIGNING_KEY does not match the embedded runtime release trust anchor."
            exit 1
          fi
          openssl dgst -sha256 -sign "$KEYFILE" -out manifest.sig manifest.json

      - name: Build + sign Secure Enclave helper (macOS)
        if: runner.os == 'macOS'
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          ALGENTA_SE_CODESIGN_IDENTITY: ${{ secrets.ALGENTA_SE_CODESIGN_IDENTITY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${ALGENTA_SIGNING_KEY:-}" ]; then
            if [[ "${RUNTIME_RELEASE_PUBLISH:-false}" == "true" ]]; then
              echo "::error::ALGENTA_SIGNING_KEY unset for a release publish; refusing to omit the SE helper."
              exit 1
            fi
            echo "::warning::ALGENTA_SIGNING_KEY unset on a non-publishing build; skipping the SE helper."
            exit 0
          fi
          python3 scripts/build_se_helper.py --out mojo_build/runtime-wheel/se --platform "${{ matrix.target }}"

      - name: Build platform runtime wheel
        env:
          ALGENTA_BUNDLE_RUNTIME: "1"
          ALGENTA_RUNTIME_SRC: ${{ github.workspace }}/mojo_build/runtime-wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel packages/algenta-runtime-native --outdir dist-runtime

      - name: Verify PyPI-compatible Linux wheel tag
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel
          auditwheel show dist-runtime/*.whl | grep -q 'manylinux_2_35_x86_64'

      - name: Validate macOS wheel execution
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist-runtime").glob("*.whl"))
          with ZipFile(wheel) as archive:
              public_key = archive.read("algenta_runtime_native/algenta_release_pub.pem")
          Path("packages/algenta/algenta/_keys/algenta_release_pub.pem").write_bytes(public_key)
          PY
          python -m build --wheel packages/algenta --outdir dist-algenta
          python -m venv /tmp/algenta-macos-wheel
          . /tmp/algenta-macos-wheel/bin/activate
          pip install --quiet dist-runtime/*.whl dist-algenta/*.whl
          algenta runtime doctor | grep -q "status:          READY"
          algenta runtime execute vector_kernels.dot dot64_f32 \
            --args-json '{"a":[1,2,6],"b":[3,2,1]}' > /tmp/algenta-macos-execute.json
          python -c 'import json; p=json.load(open("/tmp/algenta-macos-execute.json")); assert p["success"] and p["engine_used"] == "mojo" and p["result"] == 13.0'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: algenta-runtime-native-${{ matrix.target }}
          path: dist-runtime/*.whl

  clean-machine-contract:
    name: clean-machine contract (no external toolchain)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime
      - name: Pair runtime and Algenta trust anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist-runtime").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one Linux runtime wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              public_key = archive.read(
                  "algenta_runtime_native/algenta_release_pub.pem"
              )
          if not public_key.startswith(b"-----BEGIN PUBLIC KEY-----"):
              raise SystemExit("runtime wheel contains an invalid release public key")
          Path(
              "packages/algenta/algenta/_keys/algenta_release_pub.pem"
          ).write_bytes(public_key)
          PY
      - name: Clean-machine install + runtime doctor
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel packages/algenta --outdir dist-algenta
          python -m venv /tmp/clean && . /tmp/clean/bin/activate
          pip install --quiet dist-runtime/*.whl dist-algenta/*.whl
          ! command -v mojo && ! command -v modular || (echo "toolchain unexpectedly present" && exit 1)
          out=$(algenta runtime doctor || true)
          echo "$out"
          echo "$out" | grep -q "runtime source:  bundled runtime"
          echo "$out" | grep -q "mode:            bundled worker"
          echo "$out" | grep -q "fallback:        denied"
          echo "$out" | grep -q "tcp listeners:   none"
          echo "$out" | grep -q "status:          READY"
          forbidden=("mojo command not found" "install Mo""jo" "install Mod""ular" "start daemon" "docker run")
          for bad in "${forbidden[@]}"; do
            if echo "$out" | grep -qi "$bad"; then echo "::error::doctor leaked forbidden runtime setup text"; exit 1; fi
          done
          python - <<'PY'
          import time

          import algenta
          from algenta.native import loader

          result = loader.execute({'engine_type': 'runtime_smoke', 'runs': 1})
          if not isinstance(result, dict):
              raise SystemExit('runtime returned non-object payload')

          runtime = algenta.MojoRuntime(mode='local')
          health = runtime.health()
          if health.get('status') != 'ok' or health.get('tcp_listeners') != []:
              raise SystemExit(f'encapsulated runtime health failed: {health}')
          modules = runtime.list_modules()
          if len(modules) != 472:
              raise SystemExit(f'expected 472 runtime modules, received {len(modules)}')
          if sum(len(item['functions']) for item in modules) != 4757:
              raise SystemExit('runtime function count does not match the public contract')

          from algenta.native import worker
          from algenta.runtime_library_contract import runtime_modules

          shard_routes = {}
          for module_name in worker.runtime_module_filter() or ():
              resolution = worker.require_worker(
                  module_name=module_name, require_verified=True
              )
              shard_routes.setdefault(resolution.path.name, module_name)
          if len(shard_routes) < 2:
              raise SystemExit(f'expected multiple internal runtime workers: {shard_routes}')
          for worker_name, module_name in sorted(shard_routes.items()):
              resolution = worker.require_worker(
                  module_name=module_name, require_verified=True
              )
              response = worker._session_for(resolution).execute({'type': 'ping'}, 15.0)
              if response != {'status': 'ok'}:
                  raise SystemExit(f'runtime worker {worker_name} failed ping: {response}')

          def representative_value(type_name):
              scalars = {
                  'Bool': True,
                  'String': 'alpha',
                  'Int': 5,
                  'UInt8': 3,
                  'UInt16': 3,
                  'UInt32': 3,
                  'UInt64': 3,
                  'Float32': 5.0,
                  'Float64': 5.0,
                  'None': None,
              }
              if type_name in scalars:
                  return scalars[type_name]
              if type_name.startswith('List[') and type_name.endswith(']'):
                  inner = type_name[5:-1]
                  return [representative_value(inner)] * 3
              raise ValueError(type_name)

          executed_workers = set()
          for module_spec in runtime_modules():
              resolution = worker.require_worker(
                  module_name=module_spec.import_path, require_verified=True
              )
              if resolution.path.name in executed_workers:
                  continue
              for function_spec in module_spec.functions:
                  try:
                      args = [
                          representative_value(param.typ)
                          for param in function_spec.params
                      ]
                  except ValueError:
                      continue
                  try:
                      result = runtime.execute(
                          module_spec.import_path, function_spec.name, args
                      )
                  except Exception:
                      continue
                  if result.get('success') and result.get('engine_used') == 'mojo':
                      executed_workers.add(resolution.path.name)
                      break
          if executed_workers != set(shard_routes):
              missing = sorted(set(shard_routes) - executed_workers)
              raise SystemExit(f'workers without real function execution: {missing}')

          request = {
              'a': [1.0, 2.0, 6.0],
              'b': [3.0, 2.0, 1.0],
          }
          latencies = []
          for index in range(11):
              started = time.perf_counter()
              execution = runtime.execute('vector_kernels.dot', 'dot64_f32', request)
              elapsed_ms = (time.perf_counter() - started) * 1000
              if not execution.get('success') or execution.get('result') != 13.0:
                  raise SystemExit(f'library execution failed: {execution}')
              if index:
                  latencies.append(elapsed_ms)
          if max(latencies) > 15.0:
              raise SystemExit(f'warm runtime exceeded 15 ms: {latencies}')
          print('clean-machine contract OK')
          PY
          algenta runtime execute vector_kernels.dot dot64_f32 \
            --args-json '{"a":[1,2,6],"b":[3,2,1]}' > /tmp/algenta-runtime-execute.json
          python -c 'import json; p=json.load(open("/tmp/algenta-runtime-execute.json")); assert p["success"] and p["engine_used"] == "mojo" and p["result"] == 13.0'
          algenta simulate > /tmp/algenta-simulate.txt
          grep -q "Engine:             bundled native runtime" /tmp/algenta-simulate.txt
          grep -q "Python fallback:    disabled" /tmp/algenta-simulate.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: algenta-package
          path: dist-algenta/*.whl

  publish-pypi:
    name: publish Algenta Python packages to PyPI
    needs: clean-machine-contract
    if: github.event_name == 'push' || inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: algenta-runtime-native-*
          path: dist-pypi
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: algenta-package
          path: dist-pypi
      - name: Publish Python packages
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist-pypi
          password: ${{ secrets.PYPI_TOKEN }}
