# Build, sign, package, and optionally publish the bundled Algenta runtime.
#
# Public contract: users install `algenta`; the matching per-platform runtime
# artifacts are installed automatically as `algenta-runtime-native`. Users do not
# install a language toolchain, compile binaries, run Docker, or manage a sidecar.
name: build-runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish algenta and algenta-runtime-native wheels to PyPI after build"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      verdict_tag:
        # The CUDA RELEASE-VERIFY leg (see publish-pypi below). A run-verified CUDA wheel joins the
        # publish set only when a GitHub Release carries `cuda-release-verdict.json` naming that
        # exact wheel's sha256; this input says which release to read it from, so an operator can
        # re-dispatch a publish against a verdict without waiting on a version bump. Empty (the
        # default) derives the tag from the version actually being published -- `runtime-v<version>`,
        # the same convention this workflow's tag trigger uses. It cannot weaken the gate: wherever
        # the verdict comes from, it still has to name the sha256 of the wheel THIS run built.
        description: "Release tag holding cuda-release-verdict.json (default: runtime-v<version>)"
        required: false
        default: ""
        type: string
  push:
    # Fully automated releases: any update to main that touches the runtime surface
    # rebuilds and publishes on its own — no manual triggers and no approval gates (the
    # `release` environment's required-reviewers rule was removed 2026-08-05 after a run
    # sat "waiting" for a human for days). Versions already on PyPI are skipped
    # (skip-existing), so an unbumped merge is a harmless no-op publish; bump
    # packages/*/pyproject.toml to ship a new release.
    branches: [main]
    tags: ["runtime-v*", "runtime-bundle-v*"]
    paths:
      - "mojo/engine/**"
      - "apps/runtime/**"
      - "packages/algenta/**"
      - "packages/algenta-runtime-native/**"
      - "scripts/build_runtime_shards.py"
      - "scripts/generate_runtime_library_dispatch.py"
      - "scripts/stage_runtime_worker_package.py"
      - "mojo_env/pixi.toml"
      - ".github/workflows/build-runtime.yml"
      # The linux leg + clean-machine contract run from these container scripts -- a change
      # to them IS a change to the runtime pipeline.
      - ".github/scripts/_linux_container_bootstrap.sh"
      - ".github/scripts/build_runtime_linux_amd64.sh"
      - ".github/scripts/build_cuda_engine_linux_amd64.sh"
      - ".github/scripts/clean_machine_contract_linux_amd64.sh"
      # The signed manifest's generator: it defines the build_variant / engine schema the serve
      # resolver reads, so a change to it is a change to the runtime pipeline.
      - "scripts/generate_runtime_bundle_manifest.py"

permissions:
  contents: read

concurrency:
  # Per-ref group: a superseded release cut is covered by its successor. This workflow has no
  # pull_request trigger, so nothing is ever cancelled mid-flight.
  group: runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: build bundled runtime wheel (linux-x86_64)
    # `thyn-8c` (org larger runner, 8 cores / 32 GB / 300 GB, BILLED): this job compiles the
    # full 27-shard Mojo runtime (measured 31 min on 8 vCPU). The build runs inside an explicit
    # ubuntu:22.04 container (`docker run`, not job-level `container:`): the scripts hardcode
    # root + the /work mount, and the container's toolchain is the glibc-2.35 link host the
    # manylinux_2_35_x86_64 wheel contract is audited against -- it is load-bearing, not a
    # runner workaround. See .github/scripts/build_runtime_linux_amd64.sh.
    runs-on: thyn-8c
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build linux runtime in an amd64 container
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          docker pull --platform linux/amd64 ubuntu:22.04
          # Direct `docker run` so per-shard progress streams live into the log (a capturing
          # wrapper hid the whole build until exit). SHARD_TIMEOUT keeps headroom over the
          # 900 s hosted-era default; the RSS ceiling is generous next to the measured
          # 1.2-1.8 GiB per-shard peaks on Mojo 1.0.0.
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_SIGNING_KEY -e RUNTIME_RELEASE_PUBLISH \
            -e SHARD_TIMEOUT=2700 -e SHARD_MAX_RSS_MB=32768 \
            ubuntu:22.04 bash .github/scripts/build_runtime_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime/*.whl

  build-linux-cuda:
    name: build bundled runtime wheel (linux-x86_64, CUDA compile gate)
    # COMPILE-GATED lane — compile-verified, launch-UNVERIFIED without NVIDIA hardware.
    # Cross-compiling the portable GPU kernels for NVIDIA targets
    # (`-D ALGENTA_GPU -D ALGENTA_CUDA --target-accelerator sm_90`) needs NO CUDA toolkit and NO
    # GPU: the NVPTX backend ships inside the pinned mojo toolchain and the MAX CUDA runtime
    # (libMGPRT) ships inside linux-64 max-core, both already in the lock. This job proves on
    # every run that the CUDA lane still compiles and links. Launching the result needs an
    # NVIDIA driver >= 580 plus real hardware, which GitHub-hosted runners do not have — so this
    # job stays the no-GPU CI FLOOR and its wheel is not shippable on the strength of a compile:
    # it reaches PyPI only through the release-verify gate in publish-pypi below, on a verdict
    # produced on real hardware. It is deliberately NOT in clean-machine-contract's `needs` (the
    # contract verifies the SHIPPED CPU-variant wheel, and must not start depending on the CUDA
    # lane), and it IS in publish-pypi's `needs` for ORDERING ONLY — that job tolerates this one
    # failing or being skipped, so a CUDA compile break delays a release by nothing and blocks it
    # never. The ordering is not optional: publish-pypi downloads this job's artifact by name, and
    # without it in `needs` the publish would routinely run ~30 min before the artifact exists,
    # making "verdict matches the wheel" undecidable and the include arm dead code.
    # Serialized AFTER build-linux: `thyn-8c` allows at most 2 concurrent jobs org-wide, and
    # the gate is not on the publish critical path, so it must not hold a second billed slot
    # while the shippable wheel is still building.
    needs: [build-linux]
    runs-on: thyn-8c
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ── THE CUDA ENGINE COMPILE GATE ────────────────────────────────────────────────────────
      # WHY THIS STEP EXISTS. The wheel this job builds ships only the 643 public JSON-callable
      # `modules` shards. Every racing kernel is a private leading-underscore symbol (the #854
      # directive), and `discover_runtime_library_modules(executable_only=True)` drops all 20
      # kernel-bearing residentk modules because a module with no public executable function has
      # nothing to dispatch. Measured, not inferred: the 42 MB cuda wheel from run 35476584628
      # contains exactly ONE device kernel and ZERO of the 142 declared CUDA race kernels — no
      # `_pf_*`, no `_g3_*`, no `_tc_*`, no `.nv_fatbin`/`__nv_relfatbin` section in any of its 35
      # ELFs. So publishing that wheel gives a user NONE of the certified kernels, and re-pinning a
      # shard hash cannot fix it: it would certify a runtime that provably contains none of them.
      #
      # The fix is to ship the kernels inside a LINKED EXECUTABLE instead of inside a module: this
      # step compiles `benchmarks/llm_smoke/nvidia_race/tc_shim.cu` for sm_90a with a CPU-only nvcc
      # (a cross-compiler needs no device) and builds
      # `benchmarks/llm_smoke/conform_generate_cuda.mojo` — the fact-driven generate path on
      # residentk.session_cuda, and the binary class `algenta serve --backend cuda` already resolves
      # (#1112) — at the round-19 CERTIFIED default configuration (BASE + R5 + R6 comptime defines,
      # GEGLU_V2 default-ON since #1072 so no opt-out is passed, LTALGO default-OFF so no opt-in is
      # passed and the shim stays the stock flavour). The next step bundles that binary into the
      # wheel's signed artifact directory, where the serve resolver already looks for it, so an
      # operator needs NO --engine-binary flag and a user needs no Mojo toolchain.
      #
      # WHAT IT PROVES AND WHAT IT DOES NOT. This is a COMPILE AND LINK gate on a GPU-less runner:
      # it proves the certified configuration still builds, that the shim's tc_shim_* entry points
      # are really in the object, and that the result is a loadable ELF (a GPU-less usage-path smoke
      # that exits 2). It does NOT prove the engine generates a single correct token — that is the
      # October battery's job (scripts/release/verify_cuda_release.sh), which is why this lane stays
      # out of clean-machine-contract's `needs` and the cuda wheel still reaches PyPI only through
      # the release-verify gate below.
      #
      # COST: a minimal CUDA toolkit install (cuda-nvcc + cuda-cudart-dev + libcublas-dev, not the
      # ~2 GB cuda-toolkit meta-package), one nvcc compile of a 5,045-line translation unit, and one
      # Mojo build. Expected +8 to +15 min on a job that measured 30 min. It runs in its own
      # container because it needs an apt toolchain the runtime build does not; /work is mounted for
      # both, so the pixi environment the first run installs is a fast no-op for the second.
      - name: Compile the CUDA engine bundle (CPU-only nvcc, no GPU)
        run: |
          docker pull --platform linux/amd64 ubuntu:22.04
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ubuntu:22.04 bash .github/scripts/build_cuda_engine_linux_amd64.sh
      - name: Build linux CUDA runtime in an amd64 container
        env:
          ALGENTA_SIGNING_KEY: ${{ secrets.ALGENTA_SIGNING_KEY }}
          RUNTIME_RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
        run: |
          docker pull --platform linux/amd64 ubuntu:22.04
          # Same budget as build-linux: the CUDA variant compiles the SAME shard set, with PTX
          # codegen added for the gated kernels (measured 30 min on 8 vCPU).
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_SIGNING_KEY -e RUNTIME_RELEASE_PUBLISH \
            -e BUILD_VARIANT=cuda \
            -e SHARD_TIMEOUT=2700 -e SHARD_MAX_RSS_MB=32768 \
            ubuntu:22.04 bash .github/scripts/build_runtime_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-runtime-native-linux-x86_64-cuda
          path: dist-runtime/*.whl

  clean-machine-contract:
    name: clean-machine contract (no external toolchain)
    needs: [build-linux]
    # No compile here (1 min measured), so plain ubuntu-latest. The contract must execute the
    # LINUX wheel's binaries on the glibc floor the wheel is tagged for, so it runs inside the
    # same ubuntu:22.04 container; the workspace (with the downloaded runtime wheel) is mounted,
    # and the algenta wheel the job builds inside the container stays in the workspace for the
    # artifact upload.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-runtime
      - name: Clean-machine install + runtime doctor (amd64 container)
        env:
          # The contract script's default is 15 ms (native linux x86_64). The budget stays at
          # the explicit 60 ms carried over from the emulated era for the first hosted runs;
          # tighten it back toward 15 once a few native runs have recorded their latencies.
          ALGENTA_CLEAN_MACHINE_WARM_MS_BUDGET: "60"
        run: |
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_CLEAN_MACHINE_WARM_MS_BUDGET \
            ubuntu:22.04 bash .github/scripts/clean_machine_contract_linux_amd64.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-package
          path: dist-algenta/*.whl

  publish-pypi:
    name: publish Algenta Python packages to PyPI
    # `build-linux-cuda` is here for ORDERING ONLY, and the `if:` below is what keeps it from
    # becoming a blocker: this job runs when the clean-machine contract succeeded, whatever the
    # CUDA compile gate did. See that job's comment for why the ordering is required at all.
    needs: [clean-machine-contract, build-linux-cuda]
    if: >-
      (github.event_name == 'push' || inputs.publish == 'true') && !cancelled() &&
      needs.clean-machine-contract.result == 'success'
    # Publishing is platform-independent: artifact downloads + one twine upload.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # ── THE CHECKOUT IS NOT OPTIONAL ─────────────────────────────────────────────────────────
      # The release-verify gate below runs `python3 scripts/release/cuda_publish_gate.py` from the
      # job's working directory. Until this step existed the job downloaded artifacts and ran twine
      # but NEVER checked the repository out, so on a real run the gate died with
      #   python3: can't open file '/home/runner/work/algenta/algenta/scripts/release/cuda_publish_gate.py':
      #   [Errno 2] No such file or directory
      #   ##[error]Process completed with exit code 2.
      # -- and because that step has no continue-on-error (deliberately: a non-zero from the gate
      # means the publish set is indeterminate, which IS worth stopping for), the whole job failed.
      # That halted every release train on main that reached this job, whatever the CUDA lane did:
      # run 35634239235 proves it, with build-linux-cuda GREEN and publish-pypi still red on the
      # same missing file, and run 35650281651 shows the same failure stacked on top of the CUDA
      # link break. Both artifacts-download steps write into subdirectories of the workspace, so
      # this must run FIRST; a later checkout would be a no-op on an already-populated tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # EXPLICIT artifact names, not the historical `algenta-runtime-native-*` glob: the CUDA
      # compile-gate job above uploads algenta-runtime-native-linux-x86_64-cuda, whose wheel
      # carries the SAME filename as the shipped linux wheel (same package, same platform tag —
      # only the compiled shards inside differ). A glob download merged with `merge-multiple`
      # would non-deterministically overwrite one with the other inside dist-pypi. So the CUDA
      # wheel lands in its OWN directory and only the release-verify gate below may promote it
      # into dist-pypi — by construction, an unverified CUDA wheel can never reach PyPI.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-runtime-native-linux-x86_64
          path: dist-pypi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: algenta-package
          path: dist-pypi
      # The CUDA candidate, in a directory of its own. Both knobs are fail-open ON PURPOSE: this
      # artifact is optional, so a run where the compile gate failed, was skipped, or simply has
      # not uploaded yet must still publish the shipped wheels. `continue-on-error` covers the
      # artifact-not-found case, which `if-no-files-found` alone does not.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: algenta-runtime-native-linux-x86_64-cuda
          path: dist-pypi-cuda
          if-no-files-found: ignore
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # ── THE CUDA RELEASE-VERIFY GATE ──────────────────────────────────────────────────────
      # WHY IT EXISTS. The public contract advertises 199 engine kernels, 142 of them CUDA
      # (packages/algenta/algenta/runtime_library_contract.json, rendered to
      # gitbook/engine/kernel-inventory.md), but until this gate existed no user could run a single
      # one of them: the run-verified serve path is Metal, CI has no GPU anywhere, and this job
      # downloaded release artifacts by explicit name, which structurally excluded the CUDA wheel.
      # The advertised surface and the shippable surface had drifted apart. This step closes the
      # gap WITHOUT putting a GPU in CI: the CUDA wheel joins the publish set only when a
      # `cuda-release-verdict.json` attached to the release carries a `wheel_sha256` equal to the
      # sha256 of the wheel THIS run built, and that verdict is produced on real hardware by
      # scripts/release/verify_cuda_release.sh — the campaign's standing oracle gates (16/16 and
      # 64/64 greedy against the cache-free fp32 oracle, 2/2 bit-identical determinism repeats, the
      # rag4096 EOS-stop corroborated by the reference), at clocks pinned 1410 MHz with offpin=0 on
      # every cell, plus the conformance CLI battery for the cuda backend.
      #
      # WHAT IT DOES NOT CLAIM. A verdict certifies that THIS wheel's binaries launched on ONE
      # H200 box, passed those oracle gates under the recorded clocks, and answered the
      # conformance table for the cuda backend. It is NOT a benchmark win, NOT a multi-hardware or
      # multi-driver certification, and NOT a claim about hosts without an NVIDIA driver (the CUDA
      # wheel bundles libMGPRT.so, whose DT_NEEDED closure is fully bundled — libcuda.so.1 and
      # libnvidia-ml.so.1 are dlopen'd, not linked — so it loads GPU-less, but a GPU-less *decode*
      # is expected to refuse, and only the battery's own gpuless_load cell would prove how).
      # Absent or mismatched verdict => the release publishes exactly what it publishes today,
      # with a notice. This step can decline; it cannot fail a release.
      - name: CUDA release-verify gate (does the run-verified wheel join this publish?)
        id: cuda-gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT_TAG_INPUT: ${{ inputs.verdict_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist-pypi-cuda verdict
          # The tag to read the verdict from: the explicit dispatch input, else `runtime-v<version>`
          # for the version ACTUALLY IN THE PUBLISH SET — read from the wheel filename rather than
          # from pyproject.toml, because the filename is what is about to be uploaded.
          VERSION=""
          for w in dist-pypi/algenta_runtime_native-*.whl; do
            [ -e "$w" ] || continue
            base=${w##*/}
            VERSION=${base#algenta_runtime_native-}
            VERSION=${VERSION%%-*}
            break
          done
          TAG="${VERDICT_TAG_INPUT:-runtime-v${VERSION}}"
          echo "runtime-native version='${VERSION:-<none>}' verdict release tag='${TAG}'"
          VERDICT=""
          if [ -n "$VERSION" ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
               --pattern cuda-release-verdict.json --dir verdict --clobber; then
            [ -f verdict/cuda-release-verdict.json ] && VERDICT=verdict/cuda-release-verdict.json
          else
            echo "no cuda-release-verdict.json downloadable from release '$TAG'"
          fi
          GATE_ARGS=(--cuda-dir dist-pypi-cuda --publish-dir dist-pypi
                     --same-name-collision replace
                     --json cuda-publish-gate-decision.json)
          [ -n "$VERDICT" ] && GATE_ARGS+=(--verdict "$VERDICT")
          # Exits 0 on every exclude AND on include; only a publish set left indeterminate exits
          # non-zero, which is the one thing worth stopping a release for.
          python3 scripts/release/cuda_publish_gate.py "${GATE_ARGS[@]}"
      - name: Publish Python packages
        # Native twine rather than the pypa publish action: Twine 7 accepts core packaging
        # metadata 2.5, which hatchling >=1.32 emits for algenta-runtime-native; older Twine
        # rejected it ("Invalid distribution metadata: '2.5' is not a valid metadata version"),
        # failing every release since 2026-08-12. tests/test_sdk_package_metadata.py counts the
        # twine skip-existing idempotence flag below, so do not swap the action back in silently.
        # dist-pypi/* stays a top-level glob: the gate moves a displaced wheel OUTSIDE this
        # directory (to dist-pypi-displaced/) rather than into a subdirectory of it, so the upload
        # can never be handed a directory or two files with one filename.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check "twine>=7"
          twine upload --non-interactive --skip-existing dist-pypi/*
