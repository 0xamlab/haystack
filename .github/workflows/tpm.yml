# Validate the TPM 2.0 device-key backend (apps/runtime/hardware_key_store.TpmKeyStore) against a real

# A superseded run on the same ref is moot; cancelling it saves hosted-runner minutes.
concurrency:
  group: tpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# TPM 2.0 software stack (swtpm + libtss2 + tpm2-pytss) — the same ESAPI code a discrete/firmware TPM runs.
# This is the authoritative validation of the TPM path (a discrete TPM chip is unavailable on GitHub runners
# and on the macOS dev box, where libtss2 doesn't exist). swtpm proves the code is CORRECT; the anti-clone
# SECURITY property (non-exportable key) only holds on real hardware — validate that separately once on a
# self-hosted TPM/fTPM runner.
name: tpm-device-key

on:
  push:
    # branches filter, not just paths: without it a push to ANY feature branch ran this on top of
    # the branch's own pull_request run -- a duplicate run, i.e. double spend. Measured over 20
    # runs in 2026-08: 10 were push events on non-main branches. PRs still get full validation
    # via the pull_request trigger below; main keeps its post-merge run.
    branches: [main]
    paths:
      - 'apps/runtime/hardware_key_store.py'
      - 'apps/runtime/device_keypair.py'
      - 'tests/test_tpm_key_store.py'
      - '.github/workflows/tpm.yml'
      - '.github/scripts/tpm_roundtrip_linux_amd64.sh'
  pull_request:
    paths:
      - 'apps/runtime/hardware_key_store.py'
      - 'apps/runtime/device_keypair.py'
      - 'tests/test_tpm_key_store.py'
      - '.github/workflows/tpm.yml'
      - '.github/scripts/tpm_roundtrip_linux_amd64.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tpm-roundtrip:
    name: TpmKeyStore round-trip on swtpm (P-256 / ECDSA-SHA256)
    # The whole validation runs in an ubuntu:22.04 container: the script installs the TPM
    # software stack (swtpm + libtss2 + tpm2-pytss) as root with apt and never touches the
    # runner itself. Same container pattern as build-runtime.yml's clean-machine contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: TPM round-trip in an amd64 container (swtpm + libtss2 + tpm2-pytss)
        run: |
          docker run --rm --platform linux/amd64 --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ubuntu:22.04 bash .github/scripts/tpm_roundtrip_linux_amd64.sh
