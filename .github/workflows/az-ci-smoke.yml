# Azure CI plane health probe — runs ON the orchestrator VM itself (label
# az-orch), NOT on an ephemeral worker. Dispatch it after (re)deploying
# ci-orch (infra/ci/deploy_orchestrator.sh) to prove the plane is live:
# runner online, docker + az CLI + python3.14 present, repo checkout works.
name: az-ci-smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: orchestrator plane smoke
    runs-on: [self-hosted, az-orch]
    timeout-minutes: 10
    steps:
      - name: Plane facts
        run: |
          set -euo pipefail
          echo "hostname: $(hostname)"
          uname -a
          echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'unavailable')"
          echo "az: $(az version --query '"azure-cli"' --output tsv 2>/dev/null || echo 'unavailable')"
          python3.14 --version 2>/dev/null || python3 --version

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Orchestrator source present
        run: test -f infra/ci/az_orchestrator.py && echo "infra/ci/az_orchestrator.py present"
