name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Dragonfly — a Redis-wire-compatible backend (the operator's choice). The coordination +
      # idempotency locks use only EVAL (compare-and-delete/expire) + SET NX EX + GET + DEL, all
      # supported by Dragonfly, so REDIS_URL points here unchanged. No health-cmd (the image has no
      # redis-cli); the "Wait for integration services" step polls it with a Redis PING.
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
        ports:
          - 6379:6379
        options: >-
          --ulimit memlock=-1

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      # Live connectivity integration tests assume a developer-local postgres
      # (user: angel, db: decision_engine) and other real services that don't
      # exist in CI. Honored by package.json's test:formal-runtime-foundation.
      DE_SKIP_GO_LIVE_VERIFY: "1"
      # Integration scripts that need a compiled Mojo binary (mojo_build/simulate)
      # or developer-local DBs. Each script checks its env var at the top and
      # exits 0 if set, keeping package.json's check graph unchanged.
      ALGENTA_SKIP_CSV_PIPELINE: "1"
      ALGENTA_SKIP_RUNTIME_LIBRARIES_HTTP: "1"
      ALGENTA_SKIP_MOJO_RUNTIME: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip` — dependencies come from Pixi (cached separately),
          # so there's no pip cache dir to save and the post-job cache step
          # would error otherwise.

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10.15.0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | env PIXI_HOME="$GITHUB_WORKSPACE/.pixi" PIXI_BIN_DIR="$GITHUB_WORKSPACE/.pixi/bin" PIXI_NO_PATH_UPDATE=1 bash
          echo "$GITHUB_WORKSPACE/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Mojo/Pixi environment
        run: PIXI_HOME="$GITHUB_WORKSPACE/.pixi" RATTLER_CACHE_DIR="$GITHUB_WORKSPACE/.cache/rattler/cache" pixi install --manifest-path mojo_env/pixi.toml

      - name: Install JavaScript workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting (Ruff)
        run: ./scripts/run_repo_python.sh -m ruff check apps/ --ignore E501 || true

      - name: Verify GitBook v1 docs pack
        run: make docs-gitbook-verify

      - name: Verify generated docs references are current (no drift)
        run: make docs-check

      # Start MinIO (object store) and wait for it + Dragonfly so the s3 / coordination integration
      # runs against ready backends. MinIO needs the `server /data` arg, which GitHub service
      # containers can't pass, so it's launched here via docker run.
      - name: Start MinIO + wait for integration services
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          ./scripts/run_repo_python.sh scripts/ci_wait_for_services.py

      - name: Run repo check graph
        run: pnpm check
        env:
          PYTEST_TIMEOUT: 30

      # Exercise the REAL S3Backend (boto3 → MinIO) + coordination against real Dragonfly. Every
      # object-store unit test mocks the backend with LocalFsBackend, so this is the only check that
      # the real boto3/endpoint/egress/bucket-create path actually works. ALGENTA_RI_OBJECT_STORE=s3
      # selects the S3Backend; S3_ENDPOINT_URL points it at the local MinIO. The storage client is an
      # explicitly-configured endpoint, so allowlisting the loopback host yields the
      # `destination_allowlisted` egress decision (NOT `outbound_network_enabled`) — that is the one
      # path the SSRF private-destination guard skips, so the loopback MinIO is permitted without
      # arming the guard. Do NOT instead set ALGENTA_ALLOW_OUTBOUND_NETWORK: that arms the SSRF guard.
      - name: Repository object-store + coordination s3 integration
        env:
          ALGENTA_RI_OBJECT_STORE: s3
          ALGENTA_COORDINATION: redis
          S3_ENDPOINT_URL: http://localhost:9000
          ALGENTA_EGRESS_ALLOWLIST: localhost,127.0.0.1
          PYTEST_TIMEOUT: 60
        run: ./scripts/run_repo_python.sh -m pytest -q tests/test_object_store_minio_smoke.py tests/test_multi_replica_chaos.py

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        if: always()
        with:
          fail_ci_if_error: false

  # ── SDK artifact install ──────────────────────────────────────────────────
  # Proves the public Python SDKs install + import from the BUILT wheel in a fresh venv (not just
  # from source) — the "a user can actually `pip install` it" gate. Lean: no DB/Redis/pixi needed.
  sdk-artifact-install:
    name: SDK artifact install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build + fresh-venv install + import smoke
        run: |
          python -m pip install --upgrade build
          python scripts/verify_sdk_artifact_install.py

  # Proves the public TypeScript SDK installs + imports from the PACKED npm tarball (the artifact
  # `npm publish` uploads) in a fresh project — CJS require + ESM named import + @grpc/proto load +
  # a strict TS type-check + metadata. The Node LTS matrix catches version-specific ESM/CJS-interop
  # differences. Lean: npm-only, no DB/Redis/pixi.
  ts-sdk-artifact-install:
    name: TS SDK artifact install (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # setup-node@v5's "Environment details" step runs `pnpm -v`; without pnpm on PATH it errors
      # ("Unable to locate executable file: pnpm") and fails the step. Install pnpm first, as the
      # Test job does. (This — not the Node version — is why this job was red.)
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10.15.0
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # setup-node@v5 defaults package-manager-cache:true, which auto-detects the repo's pnpm
          # (packageManager field / lockfile) and hard-fails here with "Unable to locate executable
          # file: pnpm" — this job installs its own fresh npm project and needs no pnpm cache.
          package-manager-cache: false
      - name: Pack + fresh-project install + CJS/ESM/gRPC/strict-types smoke
        run: node scripts/verify_ts_sdk_artifact_install.mjs

  # ── Build Docker image ────────────────────────────────────────────────────
  build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    # `secrets` cannot be used in `if:` conditionals, but `env` (which may read secrets) can.
    # Map the codna pull token here so the engine-image steps can gate on env.CODNA_TOKEN.
    env:
      CODNA_TOKEN: ${{ secrets.CODNA_GHCR_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          driver: docker-container

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: infra/docker/Dockerfile.api.prod
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker image
        id: meta-worker
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      - name: Build and push Worker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: infra/docker/Dockerfile.worker.prod
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The combined worker+sidecar image for the co-located Fly `codna-engine` app. Its Dockerfile
      # FROMs the codna-published sidecar (ghcr.io/thyn-ai/codna/sidecar@sha256:…). That base is
      # a PRIVATE cross-repo package, so pulling it needs read:packages on thyn-ai/codna — the
      # default GITHUB_TOKEN here does NOT have it. Provide a CODNA_GHCR_READ_TOKEN secret (a PAT with
      # read:packages) OR make the codna sidecar package public (owner item D1). These steps are
      # skipped when CODNA_TOKEN is empty so the api/worker build still succeeds.
      - name: Log in to GHCR for the codna sidecar base image
        if: ${{ env.CODNA_TOKEN != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.CODNA_TOKEN }}

      - name: Extract metadata for Engine image
        id: meta-engine
        if: ${{ env.CODNA_TOKEN != '' }}
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/engine
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      - name: Build and push Engine image (worker + agent-core sidecar)
        if: ${{ env.CODNA_TOKEN != '' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: infra/docker/Dockerfile.engine.prod
          push: true
          tags: ${{ steps.meta-engine.outputs.tags }}
          labels: ${{ steps.meta-engine.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Fly (AUTOMATIC on merge to main) ────────────────────────────
  # Self-contained (not a reusable-workflow call): mirror the freshly-built `latest` API image into
  # the Fly registry and `flyctl deploy` codna-api, whose release_command applies alembic migrations.
  # Runs only after the image is pushed (needs: build) and only on a push to main — never on PRs.
  # Manual, wider-scope deploys (engine/control-plane, specific tags) still go through deploy.yml.
  deploy:
    name: Deploy to Fly (codna-api)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SRC: ghcr.io/${{ github.repository }}
      TAG: latest
    steps:
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR (pull the prebuilt api image)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CODNA_GHCR_READ_TOKEN }}

      - name: Authenticate Docker to the Fly registry
        run: flyctl auth docker

      - name: Deploy codna-api
        run: |
          set -euo pipefail
          docker pull "$SRC/api:$TAG"
          docker tag  "$SRC/api:$TAG" "registry.fly.io/codna-api:$TAG"
          docker push "registry.fly.io/codna-api:$TAG"
          flyctl deploy -c fly.api.toml -a codna-api -i "registry.fly.io/codna-api:$TAG"
