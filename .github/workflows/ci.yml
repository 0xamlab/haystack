name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual only, for MEASURING the blast-radius known-red baseline. It sweeps every top-level
  # test file the curated gate never runs (793 of 950 measured 2026-08-26) and is far too slow
  # for a PR. It runs inside the `test` job below rather than in a workflow of its own so the
  # baseline is measured in the SAME environment as the gate that consumes it -- a baseline
  # measured anywhere else records that environment's accidents as permanent tolerances.
  workflow_dispatch:
    inputs:
      measure_baseline:
        description: "Sweep the never-run test files and emit the known-red baseline"
        type: boolean
        default: false

permissions:
  contents: read
  # Blast-radius selection reads GET /pulls/{n}/files for the changed-file list, which needs
  # pull-requests:read. Without it GITHUB_TOKEN gets a bare 403 and selection falls back to the
  # full gate -- observed live on run for PR #913:
  #   ##[warning]blast-radius: PR files API unusable (curl: (22) ... error: 403)
  # This is the LEAST privilege that makes it work: read-only, and only on pull requests. The job
  # never writes to a PR.
  pull-requests: read

# Concurrency design (2026-08 redesign). History: the group used to be WORKFLOW-WIDE
# (`ci-${{ github.workflow }}`, shared across ALL refs, cancel-in-progress: false) to stop two
# runs clobbering the `test` job's then-fixed Docker service containers (postgres-ci /
# dragonfly-ci / minio on fixed ports — one run's `docker rm -f` deleted another run's live
# Postgres mid-test; PR #721 broadened the group to fix that). The cure had its own disease:
# GitHub replaces a group's already-queued run whenever a newer run joins the same group, so
# under merge-rush load the queue never drained — every new arrival EVICTED the waiting run
# (cancelled with zero jobs), both PR runs (#776 was evicted ~5 times in ~3h) and main runs.
#
# The fix removes the shared resource instead of serializing harder: the `test` job now starts
# its service containers with run-unique names and Docker-assigned host ports (see that job),
# so runs for DIFFERENT refs can no longer collide and may run in parallel. The group is
# therefore per-ref:
#   - pull_request: one group per PR, cancel-in-progress TRUE — a new push supersedes that
#     SAME PR's stale run and can never touch any other PR's run or a main run.
#   - push (main/develop): one group per branch, cancel-in-progress FALSE — main runs still
#     serialize so the build → deploy chain stays ordered (the deploy jobs additionally
#     serialize per app). A queued main run replaced by a newer push is safe: main is
#     cumulative, and the newer run's build+deploy publishes and rolls out `latest`, which
#     contains the superseded commit.
# Note: the job-level deploy concurrency groups below stay as they are — they serialize
# migrations per Fly app, and a superseded deploy is likewise covered by the next one.
concurrency:
  # Per-ref groups, no cross-ref serialization: the `test` job uses DYNAMIC service ports
  # (docker -p 0:5432 + port lookup) and run-unique container names, so runs for different
  # refs cannot collide even when they share a Docker daemon -- and on GitHub-hosted runners
  # every job gets its own VM anyway.
  # A workflow_dispatch run gets its OWN group, keyed by run_id. Sharing the per-ref group with
  # main pushes made the baseline measurement impossible to run: GitHub allows only ONE PENDING
  # run per group, so a dispatch that has not started yet is EVICTED by the next push. Measured
  # 2026-08-27 -- run 33036715923 sat pending 19 minutes behind a saturated runner pool and was
  # cancelled the instant a push landed, even though cancel-in-progress is false for pushes.
  # `cancel-in-progress: false` does not protect a run that never got a runner; the pending slot
  # is the scarce resource, not the running one. A dispatch neither evicts nor is evicted now.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Does this push change anything that ends up in an image, the chart, or a deploy? A docs- or
  # benchmark-only commit used to rebuild and push three images, grype-scan each, push the Helm
  # chart and redeploy both Fly apps (observed 2026-09-17: the docs(bench) push 5d6c11db, ~5 min of
  # build+push per image plus two production deploys, for two files under benchmarks/). The three
  # build-* jobs gate on this output; helm-oci-push / deploy / deploy-control-plane depend on those
  # builds and skip with them. Fails OPEN (deploy_needed=true) whenever the diff cannot be listed.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      deploy_needed: ${{ steps.classify.outputs.deploy_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Non-shipping paths. Anything not matching one of these means a build is needed.
          docs_only='^(docs/|gitbook/|benchmarks/|plans/|\.github/CODEOWNERS$|\.github/dependabot\.yml$|LICENSE|CHANGELOG|.*\.md$)'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::changes: no usable before-sha ($BEFORE) -- assuming a build is needed"
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git log -1 --format=%s "$AFTER" | grep -qE '^chore\(release\): SDK '; then
            echo "::notice::changes: automatic SDK version bump (sdk-auto-bump.yml) -- version fields only, nothing ships from the engine images -> skipping image builds, scans, chart push and deploys"
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER") || { echo "::notice::changes: diff failed -- assuming a build is needed"; echo "deploy_needed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -z "$changed" ]; then
            echo "::notice::changes: empty diff -- assuming a build is needed"; echo "deploy_needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          shipping=$(printf '%s\n' "$changed" | grep -Ev "$docs_only" || true)
          total=$(printf '%s\n' "$changed" | grep -c . || true)
          if [ -n "$shipping" ]; then
            echo "::notice::changes: $(printf '%s\n' "$shipping" | grep -c .) of $total changed file(s) can affect images/chart/deploy -> building"
            printf '%s\n' "$shipping" | head -20
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::changes: all $total changed file(s) are docs/benchmarks-only -> skipping image builds, scans, chart push and deploys"
            printf '%s\n' "$changed" | head -20
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
          fi
  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    # CANARY on `ubuntu-latest` (2 vCPU / 8 GB / 14 GB SSD, Ubuntu 24.04). This job compiles
    # Mojo twice in-job (the FILTERED build_mojo_binary.sh run + `make verify-accel-aot`) and
    # runs three service containers; measured 8.8-15.4 min on the previous 8-vCPU runners, so
    # expect 20-45 min here. Observe the first PR + push runs before deciding the fallback:
    #   - if PYTEST_TIMEOUT / wall-clock is the limiter -> `ubuntu-latest-4-cores`;
    #   - only if RAM or disk is the limiter -> `thyn-8c` (billed, 8 cores / 32 GB / 300 GB).
    # The dispatch-only blast-radius baseline sweep (793 sequential pytest starts, see the
    # "Measure blast-radius known-red baseline" step) is the one shape that cannot fit the
    # canary's budget, so a measure_baseline dispatch routes to `thyn-8c` directly.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_baseline && 'thyn-8c' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.14"]

    env:
      # DATABASE_URL / DATABASE_URL_SYNC / REDIS_URL / S3_ENDPOINT_URL are NOT constants here:
      # the service containers below get Docker-assigned host ports (unique per run, so
      # overlapping runs for different refs can never collide on a shared Docker daemon), and
      # the start step exports the port-derived URLs via $GITHUB_ENV once the ports are known.
      # Everything that consumes them runs AFTER that step.
      JWT_SECRET: test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      # Live connectivity integration tests assume a developer-local postgres
      # (user: angel, db: decision_engine) and other real services that don't
      # exist in CI. Honored by package.json's test:formal-runtime-foundation.
      DE_SKIP_GO_LIVE_VERIFY: "1"
      # Integration scripts that need the full compiled Mojo catalog or
      # developer-local DBs. The filtered CI worker has its own native smoke
      # below and is deliberately isolated from the full-catalog test graph.
      ALGENTA_SKIP_CSV_PIPELINE: "1"
      ALGENTA_SKIP_RUNTIME_LIBRARIES_HTTP: "1"
      ALGENTA_SKIP_MOJO_RUNTIME: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only for the service-readiness venv below (asyncpg/redis for ci_wait_for_services.py):
      # every OTHER Python invocation in this job goes through scripts/run_repo_python.sh, i.e.
      # Pixi's own isolated interpreter. The hosted image ships system Python 3.12; 3.14 lives
      # in the tool cache and is only put on PATH by setup-python (a cache hit, seconds).
      - name: Set up Python ${{ env.PYTHON_VERSION }} (service-readiness venv only)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Started by hand rather than via `services:` so the Docker-assigned ports can be read
      # back and exported as URLs through $GITHUB_ENV (services: fixes ports up front). This
      # has to run this early: "Verify filtered compiled Mojo worker" below needs Postgres up,
      # and a manual step only has the ordering GitHub Actions gives it.
      - name: Start Postgres + Dragonfly + MinIO, wait for integration services
        env:
          # Run/attempt/matrix-leg unique: with per-ref concurrency, runs for DIFFERENT refs
          # may overlap, and a re-run keeps the same run_id but bumps the attempt — the suffix
          # must distinguish both.
          CI_SERVICE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
        run: |
          # ── Start THIS run's services: run-unique names + Docker-assigned host ports ──
          # `-p 0:<container-port>` lets the daemon pick a free host port, so overlapping runs
          # can never fight over a fixed port (see git history for the fixed-port era and the
          # collisions it caused).
          pg_name="postgres-ci-${CI_SERVICE_SUFFIX}"
          redis_name="dragonfly-ci-${CI_SERVICE_SUFFIX}"
          minio_name="minio-ci-${CI_SERVICE_SUFFIX}"

          # `docker run` on an uncached image implicitly pulls first, which talks to that
          # image's registry (Docker Hub, docker.dragonflydb.io, ...) before any container
          # exists. A transient failure there (seen live on the previous runner pool as DNS
          # blips: "lookup auth.docker.io ...: server misbehaving", "lookup
          # docker.dragonflydb.io ...: connection refused") is not this image, not this job.
          # A failed `docker run` leaves no container behind, so retrying the exact same
          # command is safe; `docker rm -fv` before each attempt is belt-and-suspenders for a
          # partial start, not load-bearing for the common case. Still fails loudly (this step
          # has no `set +e`, so a real, non-transient failure aborts the job here, with the
          # actual docker error already printed) if the failure isn't transient.
          docker_run_retry() {
            local name="$1"; shift
            local attempt
            for attempt in 1 2 3 4 5; do
              docker run "$@" && return 0
              echo "docker run for $name failed (attempt $attempt/5) -- retrying after cleanup" >&2
              docker rm -fv "$name" >/dev/null 2>&1 || true
              sleep $((attempt * 5))
            done
            echo "docker run for $name failed after 5 attempts" >&2
            return 1
          }

          docker_run_retry "$pg_name" -d --name "$pg_name" -p 0:5432 \
            --label algenta-ci=test-services \
            --label "algenta-ci-created=$(date +%s)" \
            --label "algenta-ci-run=${CI_SERVICE_SUFFIX}" \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=test_db \
            postgres:16-alpine
          docker_run_retry "$redis_name" -d --name "$redis_name" -p 0:6379 --ulimit memlock=-1 \
            --label algenta-ci=test-services \
            --label "algenta-ci-created=$(date +%s)" \
            --label "algenta-ci-run=${CI_SERVICE_SUFFIX}" \
            docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
          # MinIO: the community images at quay.io/minio/minio and docker.io/minio/minio were
          # withdrawn (anonymous pulls answer `unauthorized`, 2026-09-24 — every CI run went red).
          # Chainguard builds MinIO from source for linux/amd64 + arm64 with the same `minio`
          # entrypoint, env vars and /minio/health/ready; referenced by index digest alone (its free
          # tier publishes only `latest`, so the digest is the pin). Runs as uid 65532; /data is 1777.
          docker_run_retry "$minio_name" -d --name "$minio_name" -p 0:9000 \
            --label algenta-ci=test-services \
            --label "algenta-ci-created=$(date +%s)" \
            --label "algenta-ci-run=${CI_SERVICE_SUFFIX}" \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data

          # docker port emits one line per binding (0.0.0.0:NNNN, then [::]:NNNN) — take the
          # port number of the first.
          pg_port=$(docker port "$pg_name" 5432 | head -n1 | awk -F: '{print $NF}')
          redis_port=$(docker port "$redis_name" 6379 | head -n1 | awk -F: '{print $NF}')
          minio_port=$(docker port "$minio_name" 9000 | head -n1 | awk -F: '{print $NF}')
          echo "service containers: ${pg_name}:${pg_port} ${redis_name}:${redis_port} ${minio_name}:${minio_port}"

          # The port-derived URLs used to be constants in the job env; they now follow the
          # assigned ports. Export them for every subsequent step of this job — and into THIS
          # step's own shell too, because ci_wait_for_services.py runs right here below.
          {
            echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:${pg_port}/test_db"
            echo "DATABASE_URL_SYNC=postgresql://postgres:postgres@localhost:${pg_port}/test_db"
            echo "REDIS_URL=redis://localhost:${redis_port}/0"
            echo "S3_ENDPOINT_URL=http://localhost:${minio_port}"
            echo "CI_WAIT_POSTGRES_URL=postgresql://postgres:postgres@localhost:${pg_port}/test_db"
            echo "CI_WAIT_REDIS_URL=redis://localhost:${redis_port}/0"
            echo "CI_WAIT_MINIO_URL=http://localhost:${minio_port}/minio/health/ready"
          } >> "$GITHUB_ENV"
          export CI_WAIT_POSTGRES_URL="postgresql://postgres:postgres@localhost:${pg_port}/test_db"
          export CI_WAIT_REDIS_URL="redis://localhost:${redis_port}/0"
          export CI_WAIT_MINIO_URL="http://localhost:${minio_port}/minio/health/ready"

          # ci_wait_for_services.py's postgres/dragonfly checks need the asyncpg/redis PyPI
          # packages. This step runs BEFORE "Install Pixi" below, so run_repo_python.sh's
          # python3 fallback has neither yet (confirmed live, run 32891162493: "No module
          # named 'asyncpg'"). docker-exec readiness checks aren't a safe substitute:
          # Dragonfly's own image ships no redis-cli (see this script's own module docstring).
          # A throwaway venv on the setup-python 3.14 interpreter: two small, pure-Python
          # packages that install in seconds, far cheaper than pulling in pixi this early.
          python -m venv /tmp/ci-wait-venv
          /tmp/ci-wait-venv/bin/python3 -m pip install --quiet --disable-pip-version-check asyncpg redis
          /tmp/ci-wait-venv/bin/python3 scripts/ci_wait_for_services.py

      # setup-node MUST precede pnpm/action-setup: pnpm's self-installer shells out to `npm`,
      # and setup-node is what guarantees a deterministic Node major with a real npm on PATH
      # regardless of what the runner image ships.
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No pnpm store cache yet: `pnpm install --frozen-lockfile` is seconds next to the
          # Mojo build in this job, and the cache path validation has failed before on
          # runners whose store lived elsewhere. Turn it on deliberately, once the canary's
          # timings are known -- same call ts-sdk-artifact-install makes below.
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          # runner.temp is this job's own scratch dir; keeping the install there (rather than
          # the default ~/setup-pnpm) means nothing outside the job is ever written.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | env PIXI_HOME="$GITHUB_WORKSPACE/.pixi" PIXI_BIN_DIR="$GITHUB_WORKSPACE/.pixi/bin" PIXI_NO_PATH_UPDATE=1 bash
          echo "$GITHUB_WORKSPACE/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Mojo/Pixi environment
        run: |
          PIXI_HOME="$GITHUB_WORKSPACE/.pixi" RATTLER_CACHE_DIR="$GITHUB_WORKSPACE/.cache/rattler/cache" pixi install --manifest-path mojo_env/pixi.toml

      # Telys' memengine powers scripts/test_impact.py's lexical enrichment lane (the same library
      # apps/api_server/services/repository_intelligence_lexical.py uses). Installed from the
      # wheel already COMMITTED at vendor/wheels/ -- offline, credential-free, and reproducible.
      #
      # This replaces a `pip install git+https://...@github.com/thyn-ai/telys.git` that could
      # never have worked, for two independent reasons proven from a live run
      # (runs/32984900321, job 98230098866):
      #   1. It ran BEFORE "Install Pixi", so run_repo_python.sh fell back to /usr/bin/python3 and
      #      died with "No module named pip" -- before any network call. Ordering, not credentials.
      #   2. thyn-ai/telys is PRIVATE and the default GITHUB_TOKEN is scoped to THIS repo, so the
      #      clone would 404 even once ordered correctly.
      # Every run therefore logged "memengine ABSENT - lane unverified". `telys-runtime` is also
      # not installable from PyPI at all (404; the `memengine` package there is an unrelated
      # langchain/torch project), so a committed wheel is the only credential-free source -- the
      # same conclusion tests/test_vendored_telys_runtime_wheel.py already documents and enforces.
      #
      # --no-deps is deliberate: memengine.lexical needs only numpy (present in the Pixi env), and
      # pulling the `telys` contracts package would add a PyPI round-trip this lane does not need.
      # Verified locally on py3.14: imports clean, kernel absent -> pure-Python BM25 (score-exact
      # per memengine/lexical.py), 30 lexical tests pass with ZERO skips.
      - name: Install memengine (Telys on-device lexical index, offline from vendor/wheels)
        run: |
          set -euo pipefail
          # ensurepip: the Pixi env ships without pip.
          ./scripts/run_repo_python.sh -m ensurepip --upgrade >/dev/null 2>&1 || true
          ./scripts/run_repo_python.sh -m pip install --quiet --no-index --no-deps \
            vendor/wheels/telys_runtime-0.1.0a1-py3-none-any.whl

      # No continue-on-error and no soft warning: the install is offline and unconditional, so a
      # failure here is a real regression (deleted/renamed wheel), not an environment accident.
      # "lane never tested" and "lane passed" must never look alike in a green run.
      - name: Verify the memengine lexical lane is live
        run: |
          ./scripts/run_repo_python.sh -c "import memengine.lexical" \
            || { echo "::error::memengine.lexical not importable after the offline install - the lexical enrichment lane would silently degrade to a no-op"; exit 1; }
          echo "::notice::memengine present - lexical enrichment lane WILL be exercised"

      # codna carries the productized impact engine (codna.impact.compute_impact). Without it
      # scripts/test_impact.py falls back to its own import graph, which OVER-selects: measured on
      # this repo, a packages/algenta/algenta/inference.py change selects 44 of 1020 tests on the
      # local graph and 17 of 1025 with codna -- 61% fewer, for the same conservative bias.
      #
      # From PyPI, deliberately. codna publishes there via Trusted Publishing (its own
      # publish-cli.yml), so there is NO cross-repo credential involved -- an earlier plan to mint
      # a read-only App token for thyn-ai/codna, and a later one to relay a wheel through GHCR,
      # were both unnecessary. Building from source does NOT work: codna's setup.py
      # unconditionally bundles a prebuilt Node agent-core and `pip wheel` dies with
      # "agent-core runtime source is missing run-server.mjs".
      #
      # PINNED, not floating. codna.impact directly decides which tests run, so an unattended
      # upgrade would silently change test selection -- exactly the class of invisible change this
      # workflow keeps getting bitten by. Bump deliberately, with the two numbers above re-measured.
      # --only-binary: never fall back to an sdist build (see the agent-core failure above).
      - name: Install codna (productized blast-radius engine, from PyPI)
        run: |
          set -euo pipefail
          ./scripts/run_repo_python.sh -m pip install --quiet --only-binary=:all: "codna==0.2.16"

      # Same discipline as the memengine gate: a hard error, not a warning. If codna is importable
      # but the impact seam is missing (a wheel predating thyn-ai/codna#446), selection silently
      # degrades to the local graph and nobody notices -- so assert the SEAM, not just the import.
      - name: Verify the codna impact engine is live
        run: |
          ./scripts/run_repo_python.sh -c "
          from codna import codeunits
          from codna.impact import compute_impact
          assert hasattr(codeunits, 'language_for') and hasattr(codeunits, 'extract_file')
          assert callable(compute_impact)
          " || { echo "::error::codna installed but the impact seam is missing - blast radius would silently fall back to the local over-selecting graph"; exit 1; }
          echo "::notice::codna present - productized impact engine WILL drive selection"

      - name: Build compiled Mojo simulation runtime
        env:
          PIXI_HOME: ${{ github.workspace }}/.pixi
          RATTLER_CACHE_DIR: ${{ github.workspace }}/.cache/rattler/cache
          MOJO_RUNTIME_MODULE_FILTER: vector_kernels.dot
          MOJO_SRC: ${{ runner.temp }}/algenta-ci-runtime/main.mojo
          DISPATCH_OUTPUT_PATH: ${{ runner.temp }}/algenta-ci-runtime/runtime_library_dispatch_generated.mojo
          BINARY_PATH: ${{ runner.temp }}/algenta-ci-runtime/simulate
          OBJECT_PATH: ${{ runner.temp }}/algenta-ci-runtime/simulate.o
          TEMP_OBJECT_PATH: ${{ runner.temp }}/algenta-ci-runtime/simulate.o.tmp
          TEMP_BINARY_PATH: ${{ runner.temp }}/algenta-ci-runtime/simulate.tmp
        run: |
          mkdir -p "$RUNNER_TEMP/algenta-ci-runtime"
          cp mojo/engine/main.mojo "$MOJO_SRC"
          bash scripts/build_mojo_binary.sh

      - name: Install JavaScript workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify filtered compiled Mojo worker
        env:
          DE_TEST_MOJO_BINARY: ${{ runner.temp }}/algenta-ci-runtime/simulate
          DE_TEST_MOJO_SOURCES: ${{ runner.temp }}/algenta-ci-runtime/main.mojo:${{ runner.temp }}/algenta-ci-runtime/runtime_library_dispatch_generated.mojo
        run: >-
          ./scripts/run_repo_python.sh -m pytest -q
          tests/test_mojo_library_dispatch_server.py
          -k vector_dot_runtime_library_request

      - name: Run linting (Ruff)
        run: ./scripts/run_repo_python.sh -m ruff check apps/ --ignore E501 || true

      # Blast-radius CI: on PRs, run the tests inside the diff's dependency blast
      # radius (scripts/test_impact.py; codna/telys enrichment via CODNA_BLAST_URL).
      # Strictly additive over the explicit CI lists; ALL/NONE fall back to today's
      # behavior (fail-open). Push/main runs keep the explicit lists only.
      # REMOVED: a second "Blast-radius test selection (codna/telys-aware)" step used to sit here.
      # It invoked `scripts/test_impact.py FETCH_HEAD HEAD` -- positional args the CLI has never
      # accepted (it takes --base/--head/--changed). argparse therefore exited 2 with
      # "unrecognized arguments: FETCH_HEAD HEAD", `2>/dev/null || echo ALL` swallowed it, and
      # IMPACT was the literal string "ALL" on every single run: the step could only ever print
      # "keeping explicit CI lists (fail-open)" and select nothing. It was also redundant with
      # the "(PR only)" step below, which does the real selection, and had it ever worked it would
      # have run a SECOND full pytest pass over the subset on top of the check graph.
      - name: Verify GitBook v1 docs pack
        run: make docs-gitbook-verify

      - name: Verify generated docs references are current (no drift)
        run: make docs-check

      # schemas/openapi/openapi.yaml used to be generated by curl-ing a live server's
      # /openapi.json by hand (see git history of the `openapi` Makefile target) -- nothing
      # forced a regen after a route change, so the committed file could silently drift from
      # what the app actually serves. scripts/openapi/export_openapi.py now builds the same
      # schema in-process (imports the real app and calls app.openapi() directly, no server or
      # curl involved); this gate fails if that fresh regen differs from the committed file at
      # all. tests/test_openapi_spec_drift.py (run via `pnpm check` below) is the complementary,
      # narrower guard scoped to the (method, path) operation set.
      - name: Verify OpenAPI spec is current (no drift)
        run: make openapi-check

      # The kernel-inventory artifacts: the SDK-facing contract, the generated Mojo dispatch and
      # the GitBook catalog. `make inventory-check` already existed but NOTHING ran it, and it was
      # red on main -- the discovery pass published four nested `parallelize` closures as module
      # functions, so the regenerated dispatch imported symbols that do not exist. CI never saw it
      # because it compiles FILTERED shards, so a broken import only surfaces for whoever happens
      # to build the shard that contains it. Gate the artifacts here instead of at build time.
      - name: Verify kernel inventory artifacts are current (no drift)
        run: make inventory-check

      # The accelerator surface, compiled AND executed on a runner with NO accelerator.
      # `--target-accelerator=none` makes every `@parameter if` gate elaborate for real, so a
      # broken gate is a compile error here rather than a `shader_toolchain_absent` surprise on
      # a user's GPU. This target already existed (Makefile) and NO workflow invoked it -- the
      # only CI coverage the accel surface had was the macOS leg, which was billing-dead since
      # 2026-08-24 and never executed a Metal kernel anyway (thyn-ai/algenta#922).
      #
      # This is the hardware-agnostic half of GPU coverage: it needs no GPU, no vendor toolkit
      # and no Apple hardware, so it runs on the ordinary fleet like everything else.
      - name: Verify the accelerator surface compiles AOT with no accelerator
        run: make verify-accel-aot

      # Codna blast-radius gating (v1): on PRs whose diff cannot influence the
      # test graph, skip the pytest legs (guard+lint+build still run). Subset
      # scoping of the pytest lists is phase 2; push/schedule/dispatch always
      # run the exhaustive graph. Fail-closed: any selection error => full run.
      - name: Blast-radius test selection (PR only)
        if: github.event_name == 'pull_request'
        id: impact
        env:
          # Turn the Telys/memengine lexical lane ON for selection. Installing memengine was only
          # half the wiring: _lexical_enrichment() short-circuits to (set(), 0) unless this flag
          # is set, so before this the lane was a guaranteed no-op even on a runner that had the
          # library. Same flag name the engine's own
          # apps/api_server/services/repository_intelligence_lexical.py uses -- deliberately not a
          # second flag for the same capability. The lane is additive-only: it can add tests to
          # the selected set, never remove them.
          ALGENTA_REPOSITORIES_LEXICAL_RANKING: "true"
        run: |
          # FAIL-CLOSED, for real this time. The previous form claimed "any selection error =>
          # full run" and did the exact opposite -- it failed open to running NOTHING:
          #
          #   BASE="<pr.base.sha>"
          #   git cat-file -e "$BASE" 2>/dev/null || BASE="origin/main"
          #   CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || true)
          #   if [ -z "$CHANGED" ]; then echo "mode=skip"; exit 0; fi
          #
          # actions/checkout runs with fetch-depth: 1, so the base sha is NOT in the clone and
          # `origin/main` is not fetched either. `git diff` therefore failed, `|| true` swallowed
          # the error, CHANGED came out empty, and the step exited mode=skip -- which makes the
          # check graph run `guard:reliability && lint && build` and NO pytest legs at all.
          # Caught live on run 33010565375 (PR #911): the rendered line
          # "Blast radius: diff cannot influence the test graph - skipping pytest legs."
          # means that PR merged green having executed essentially no Python tests.
          #
          # The bug is conflating two different things: an EMPTY diff ("nothing changed", safe to
          # skip) and a FAILED diff ("we don't know what changed", must run everything). They are
          # now distinguished explicitly -- `git diff` exit status is captured instead of
          # discarded, and only a SUCCESSFUL, genuinely-empty diff may reach mode=skip.
          set -uo pipefail
          # PRIMARY SOURCE IS THE API, NOT git. The changed-file list for a pull request is
          # authoritative from GET /pulls/{n}/files and needs NO local history at all, which
          # sidesteps the shallow-clone problem entirely instead of fighting it.
          #
          # The git route was tried first and does not work on these runners: with fetch-depth: 1
          # the base sha is absent, and BOTH deepening fetches failed too -- run 33012371772 (the
          # fix's own PR) rendered
          #   "##[warning]blast-radius could not compute the diff against 'e8f7bf5b...'"
          # so selection fell back to the full gate on every single PR. It was safe (that is what
          # the previous commit fixed) but it never actually trimmed anything. Worse, the fetch's
          # own errors were invisible because I had written `2>/dev/null` on them, so there was
          # nothing in the log explaining WHY -- the diagnostic was silenced by the same reflex
          # that caused the original bug.
          #
          # git diff is kept as the fallback for the case the API is unreachable, and its stderr
          # is now CAPTURED and printed rather than discarded.
          CHANGED=""
          DIFF_OK=0
          API="https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
          # One-line python on purpose: a multi-line `-c '...'` puts continuation lines at column 0,
          # which breaks the enclosing YAML block scalar (caught by yaml.safe_load before shipping).
          if CHANGED=$(
              curl -sS --fail-with-body -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                   -H "Accept: application/vnd.github+json" "$API?per_page=100" 2>/tmp/api_err.txt \
              | python3 -c 'import json,sys; print("\n".join(f["filename"] for f in json.load(sys.stdin)))' 2>/dev/null
             ) && [ -n "$CHANGED" ]; then
            DIFF_OK=1
            echo "::notice::blast-radius: changed files from the PR files API ($(printf '%s\n' "$CHANGED" | grep -c . || true) file(s))"
          else
            echo "::warning::blast-radius: PR files API unusable ($(head -c 120 /tmp/api_err.txt 2>/dev/null || true)) - falling back to git"
            BASE="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "$BASE" 2>/dev/null; then
              # stderr NOT discarded this time: if these fail, the reason must be in the log.
              git fetch --no-tags --depth=200 origin \
                "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}" 2>&1 | tail -3 || true
              git fetch --no-tags --depth=200 origin "$BASE" 2>&1 | tail -3 || true
            fi
            git cat-file -e "$BASE" 2>/dev/null || BASE="origin/${{ github.event.pull_request.base.ref }}"
            # TWO-dot, not three. `A...HEAD` needs a MERGE BASE, which a shallow clone does not
            # have even once the base sha itself is fetched -- observed live on PR #913:
            #   fatal: d8bf12ea...HEAD: no merge base
            # Two-dot compares the two commits directly and needs no common ancestor. For a PR
            # that is also the more accurate question: "what differs between the base the PR
            # targets and this head", which is exactly what the selector wants.
            if CHANGED=$(git diff --name-only "$BASE" HEAD 2>/tmp/git_err.txt); then
              DIFF_OK=1
            else
              DIFF_OK=0
              CHANGED=""
              echo "::warning::blast-radius: git diff also failed: $(head -c 160 /tmp/git_err.txt 2>/dev/null || true)"
            fi
          fi
          if [ "$DIFF_OK" != "1" ]; then
            # UNKNOWN change set -> full run. Never skip on ignorance.
            echo "::warning::blast-radius could not determine the changed files (API and git both failed) - failing CLOSED to the full gate (mode=all), never skip"
            {
              echo "mode=all"
              echo "tests="
              echo "lanes="
            } >> "$GITHUB_OUTPUT"
            echo "::notice::blast-radius selection mode=all tests=0 lanes=0 (diff unavailable)"
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            # Genuinely empty diff: the ONLY route to skip, and it is now provably a successful
            # `git diff` that returned nothing rather than a failed one.
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::blast-radius selection mode=skip (diff computed successfully and is empty)"
            exit 0
          fi
          # NO $BASE here. It is assigned only inside the git-fallback branch, so on the (normal)
          # API path it is unset -- and `set -u` turns an unset expansion into an immediate exit 1.
          # That is exactly what happened on this PR's first run: the API call SUCCEEDED
          # ("changed files from the PR files API"), then this line killed the step with exit 1
          # and failed the whole Test job. A leftover from the previous commit, where $BASE was
          # always defined.
          # Count with grep -c, not `wc -l`: $( ) strips the trailing newline, so `wc -l` reports
          # 0 for a single-file change (this PR's own first run printed "0 file(s)" for 1 file).
          echo "::notice::blast-radius: $(printf '%s\n' "$CHANGED" | grep -c . || true) changed file(s) -> running the selector"
          # Unquoted on purpose: $CHANGED is one path per line and the CLI takes them as separate
          # arguments (paths never contain whitespace here). Converting to an array is a tracked
          # follow-up together with paginating the PR-files call above.
          # shellcheck disable=SC2086
          OUT=$(./scripts/run_repo_python.sh scripts/test_impact.py --json --changed $CHANGED 2>/dev/null || true)
          MODE=$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('mode','all'))" "$OUT" 2>/dev/null || echo all)
          # SUBSET IS NOW ACTED ON. It used to be force-downgraded to `all` here ("v1: only
          # skip-mode is acted on"), which meant the selector ran, computed a real answer, and
          # had it thrown away on every PR -- blast radius never once trimmed a run. The
          # selector's bias is conservative-by-construction (it only ever widens: any broad or
          # unparseable change returns `all`, and the lexical lane can add tests but never
          # remove them), so honoring `subset` does not weaken the gate.
          TESTS=""
          if [ "$MODE" = "subset" ]; then
            TESTS=$(python3 -c "import json,sys; print(' '.join(json.loads(sys.argv[1]).get('tests') or []))" "$OUT" 2>/dev/null || true)
            # Empty list with mode=subset would silently run ZERO tests -- fail open to `all`
            # rather than let a selector bug present as a green, empty run.
            if [ -z "$TESTS" ]; then
              MODE=all
              echo "::warning::blast-radius returned subset with an EMPTY test list - failing open to full suite"
            fi
          fi
          # A BROAD change used to be tested LESS than a narrow one. mode=all is the safe verdict,
          # but the check graph below cannot afford the full ~1019-file suite on a PR, so it falls
          # back to the curated list -- and the curated list is exactly what a broad change most
          # needs to escape. Live cost: #902 changed scripts/run_js_test_suite.sh (a broad glob),
          # took mode=all, and the two tests asserting that script's contents never ran. It merged
          # green and broke main (2 failed, 950 passed).
          # `lanes` carries what the additive lanes flag for the diff even under mode=all. On the
          # #902 diff that is exactly 2 of 1019 test files -- so this closes the hole for the price
          # of two files, not a full suite.
          LANES=""
          if [ "$MODE" = "all" ]; then
            LANES=$(python3 -c "import json,sys; print(' '.join(json.loads(sys.argv[1]).get('lanes') or []))" "$OUT" 2>/dev/null || true)
          fi
          {
            echo "mode=$MODE"
            echo "tests=$TESTS"
            echo "lanes=$LANES"
          } >> "$GITHUB_OUTPUT"
          N=$(printf '%s' "$TESTS" | wc -w | tr -d ' ')
          L=$(printf '%s' "$LANES" | wc -w | tr -d ' ')
          echo "::notice::blast-radius selection mode=$MODE tests=$N lanes=$L"

      - name: Run repo check graph
        run: |
          MODE="${{ steps.impact.outputs.mode }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$MODE" = "skip" ]; then
            echo "Blast radius: diff cannot influence the test graph - skipping pytest legs."
            pnpm guard:reliability && pnpm lint && pnpm build
          else
            # CURATED GATE UNION BLAST-RADIUS SUBSET -- coverage can only ever GROW.
            #
            # `pnpm check` gates Python entirely through hand-listed files in package.json.
            # Measured 2026-08-26: 1014 test files exist under tests/, 176 are referenced by ANY
            # CI invocation, and 838 never execute on any PR or push. A curated list cannot grow,
            # so new coverage is born dead -- all 36 orchestrator tests written that day landed in
            # the 838 and a real regression (HTTP 401 in cleanup()) reached main GREEN because of
            # it.
            #
            # Replacing the list outright would risk DROPPING coverage if the selector ever
            # under-selects, so the curated gate still runs in full and the selected subset is
            # added on top, minus anything the curated gate already covers (no double-running).
            pnpm check
            # mode=all is handled here too, via `lanes`, NOT just mode=subset. Previously the
            # extras were appended only in subset mode, so a broad change (mode=all) ran the
            # curated list and nothing else -- the wider the change, the less a PR covered it.
            # See the selection step's own comment for the #902 case this cost.
            SELECTED="${{ steps.impact.outputs.tests }} ${{ steps.impact.outputs.lanes }}"
            if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$(printf '%s' "$SELECTED" | tr -d ' ')" ]; then
              ./scripts/run_repo_python.sh scripts/ci_curated_test_files.py > /tmp/curated.txt || : > /tmp/curated.txt
              EXTRA=""
              for t in $SELECTED; do
                # conftest.py is a fixture module, not a test: the selector legitimately reports
                # it as impacted (everything depends on it) but pytest has nothing to collect
                # from it, so passing it wastes a collection pass and reads as a 0-test file.
                case "$t" in */conftest.py|conftest.py) continue ;; esac
                grep -qxF "$t" /tmp/curated.txt || EXTRA="$EXTRA $t"
              done
              if [ -n "$EXTRA" ]; then
                N=$(printf '%s' "$EXTRA" | wc -w | tr -d ' ')
                echo "::notice::blast radius adds $N test file(s) the curated gate does not cover"
                # ADVISORY on the newly-reached files, deliberately, and this is NOT a `|| true`
                # that hides the result -- every failure is printed and counted, and the step says
                # plainly that triage is owed.
                #
                # Why it cannot be blocking yet: these files are drawn from the 792 top-level test
                # files that NO CI invocation has ever run (172 curated of 949). They are red for
                # reasons that predate the diff being tested, so blocking on them makes every
                # unrelated PR un-mergeable until the whole backlog is clean. Measured while
                # landing this: 2 lane-reached files on one diff -> 1 red
                # (tests/test_self_host_contract.py, stale since #737, fixed here); 6 lane-reached
                # files on a two-file diff -> 19 more reds in tests/test_source_surface_privacy.py,
                # all on GENERATED paths (packages/algenta/build/lib/**, packages/ts-sdk/dist/**)
                # whose artifacts are stale relative to source. Each fix grows the diff, which
                # reaches more files, which surfaces more reds -- a divergent loop.
                #
                # The curated gate above stays FULLY BLOCKING, so this change cannot weaken any
                # coverage that was enforced before blast radius existed. What is advisory is
                # strictly the newly-visible surface.
                #
                # THE RATCHET. Enforcement is switched by the EXISTENCE of a measured baseline,
                # deliberately, so there is no separate flag that can disagree with reality:
                #   no  tests/blast_radius_known_red.txt -> advisory (this is the state today)
                #   yes tests/blast_radius_known_red.txt -> only NEW reds fail the job
                # Measure it with `workflow_dispatch` + measure_baseline=true (see the step at the
                # end of this job), never on a laptop -- two classes of false local red were
                # observed on 2026-08-26 (a shared Postgres stamped at an alembic revision in no
                # tree, and a pixi env built from a stale branch pinning an older mcp), and
                # baselining either would silence a real failure forever.
                BASELINE="tests/blast_radius_known_red.txt"
                # ONE FILE PER INVOCATION, and the baseline sweep does the same. The unit of
                # measurement has to equal the unit of enforcement: a test that only fails when
                # co-executed with others would otherwise be recorded as a permanent known-red
                # (masking a later real failure at that node), and one that passes alone but
                # fails alongside its neighbours would BLOCK a PR on a red no measurement had
                # ever seen. Isolating both sides removes the whole class. Extras are a handful
                # of files, so the extra process starts are cheap.
                : > /tmp/extras.log
                extras_rc=0
                for one in $EXTRA; do
                  set +e
                  ./scripts/run_repo_python.sh -m pytest -q "$one" >> /tmp/extras.log 2>&1
                  one_rc=$?
                  set -e
                  # 5 = "no tests collected", which is not a failure.
                  if [ "$one_rc" != "0" ] && [ "$one_rc" != "5" ]; then extras_rc=1; fi
                done
                tail -3 /tmp/extras.log || true
                if [ "$extras_rc" = "0" ]; then
                  echo "::notice::blast-radius extras all passed ($N file(s), one invocation each)"
                elif [ -f "$BASELINE" ]; then
                  ./scripts/run_repo_python.sh scripts/ci_blast_radius_gate.py \
                    --pytest-output /tmp/extras.log --baseline "$BASELINE"
                else
                  echo "::warning::blast-radius extras FAILED in $N newly-reached file(s). No measured baseline exists yet, so this is ADVISORY, not blocking -- and deliberately not a \`|| true\`: every red is printed below and triage is owed. Measure the baseline via workflow_dispatch (measure_baseline=true) to make this gate blocking."
                  grep -E "^FAILED|^ERROR" /tmp/extras.log | head -25 || true
                fi
              else
                echo "::notice::blast-radius subset fully covered by the curated gate; nothing extra to run"
              fi
            fi
          fi
        env:
          PYTEST_TIMEOUT: 30

      # MEASURE the blast-radius known-red baseline that the gate above consumes. Manual only:
      # it sweeps the 793 top-level test files (measured 2026-08-26) that no CI invocation has
      # ever run, which is far too slow for a PR leg.
      #
      # Chunked, so one hard crash in an unknown file costs one chunk instead of the sweep. A
      # chunk that produces NO pytest summary is recorded as UNMEASURED rather than quietly
      # contributing zero reds -- a silently truncated sweep yields a baseline that looks clean
      # and then blocks PRs on exactly the files it skipped, which is the failure mode most
      # likely to discredit the whole ratchet.
      - name: Measure blast-radius known-red baseline (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.measure_baseline
        # 793 sequential pytest starts; batching would be faster but would measure the wrong
        # thing (see the loop's comment). Manual, one-off, so wall-clock is the cheap axis.
        timeout-minutes: 240
        env:
          PYTEST_TIMEOUT: 60
        run: |
          ./scripts/run_repo_python.sh scripts/ci_never_run_test_files.py > /tmp/never_run.txt
          TOTAL=$(grep -c . /tmp/never_run.txt || true)
          TOTAL=${TOTAL:-0}
          # ONE FILE PER INVOCATION, matching the gate's extras step exactly. Batching would
          # be faster but would measure a DIFFERENT thing: co-execution failures would enter
          # the baseline as permanent tolerances, and files that only fail alongside others
          # would block PRs on reds this sweep never saw. Isolation is the point, not speed.
          echo "::notice::measuring $TOTAL never-run test file(s), one invocation each"
          : > /tmp/reds.txt
          : > /tmp/unmeasured.txt
          i=0
          while read -r one; do
            [ -n "$one" ] || continue
            i=$((i + 1))
            set +e
            # </dev/null so pytest cannot consume the while-read loop's stdin and swallow
            # the rest of the file list -- the sweep would silently stop after one file.
            ./scripts/run_repo_python.sh -m pytest -q --continue-on-collection-errors "$one" \
              > /tmp/one.log 2>&1 < /dev/null
            one_rc=$?
            set -e
            # `tests/` is REQUIRED right after the keyword. pytest wraps a long node id and
            # puts the bare status on the next line ("FAILED            [ 9%]"); a keyword-only
            # match swallowed 18 of those into the first measured baseline as junk entries.
            grep -E "^(FAILED|ERROR) tests/" /tmp/one.log \
              | sed -E 's/^(FAILED|ERROR) //; s/ - .*$//' >> /tmp/reds.txt || true
            # pytest's own exit codes are the reliable signal: 0 ok, 1 tests failed,
            # 5 nothing collected -- all mean it RAN. 2/3/4 (interrupted, internal, usage) and
            # anything >128 (signal) mean it did not. Grepping the summary text instead flagged
            # 7 all-skipped files as UNMEASURED, because "7 skipped" contains none of the words
            # that pattern looked for.
            case "$one_rc" in
              0|1|5) ran=1 ;;
              *)     ran=0 ;;
            esac
            if [ "$ran" = "0" ]; then
              echo "::warning::$one produced no pytest summary (rc=$one_rc) -- UNMEASURED"
              tail -5 /tmp/one.log || true
              echo "$one" >> /tmp/unmeasured.txt
            fi
            if [ $((i % 25)) = 0 ] || [ "$i" = "$TOTAL" ]; then
              echo "  swept $i / $TOTAL  (distinct reds so far: $(sort -u /tmp/reds.txt | grep -c . || true))"
            fi
          done < /tmp/never_run.txt
          UNMEASURED=$(grep -c . /tmp/unmeasured.txt || true)
          REDS=$(sort -u /tmp/reds.txt | grep -c . || true)
          {
            echo "# blast-radius known-red baseline -- consumed by scripts/ci_blast_radius_gate.py"
            echo "#"
            echo "# MEASURED ON CI. Do NOT add entries from a local run: a laptop reproduces reds"
            echo "# that CI does not (a shared Postgres stamped at an alembic revision present in no"
            echo "# tree; a pixi env built from a stale branch pinning an older mcp -- both observed"
            echo "# 2026-08-26), and a false entry here silences a real failure permanently."
            echo "#"
            echo "# commit:      ${{ github.sha }}"
            echo "# run:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "# files swept: ${TOTAL:-0}"
            echo "# unmeasured:  ${UNMEASURED:-0}  (chunks that produced no summary; NOT proven green)"
            echo "#"
            echo "# Every line below is triage owed. This file may only shrink."
            sort -u /tmp/reds.txt
          } > /tmp/blast_radius_known_red.txt
          echo "::notice::baseline measured: ${REDS:-0} distinct red(s) across ${TOTAL:-0} file(s), ${UNMEASURED:-0} unmeasured"
          # Always written, even when empty, so the artifact upload has a stable file set and an
          # empty unmeasured list is positive evidence rather than a missing file.
          cp /tmp/unmeasured.txt /tmp/blast_radius_unmeasured.txt
          if [ "${UNMEASURED:-0}" != "0" ]; then
            echo "::warning::${UNMEASURED} file(s) were NOT measured -- commit the baseline only after re-running those, or the gate will block on them"
          fi

      - name: Upload the measured baseline
        if: github.event_name == 'workflow_dispatch' && inputs.measure_baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blast-radius-known-red-baseline
          path: |
            /tmp/blast_radius_known_red.txt
            /tmp/blast_radius_unmeasured.txt
          if-no-files-found: error
          retention-days: 14

      # Exercise the REAL S3Backend (boto3 → MinIO) + coordination against real Dragonfly. Every
      # object-store unit test mocks the backend with LocalFsBackend, so this is the only check that
      # the real boto3/endpoint/egress/bucket-create path actually works. ALGENTA_RI_OBJECT_STORE=s3
      # selects the S3Backend; S3_ENDPOINT_URL points it at the local MinIO. The storage client is an
      # explicitly-configured endpoint, so allowlisting the loopback host yields the
      # `destination_allowlisted` egress decision (NOT `outbound_network_enabled`) — that is the one
      # path the SSRF private-destination guard skips, so the loopback MinIO is permitted without
      # arming the guard. Do NOT instead set ALGENTA_ALLOW_OUTBOUND_NETWORK: that arms the SSRF guard.
      - name: Repository object-store + coordination s3 integration
        env:
          ALGENTA_RI_OBJECT_STORE: s3
          ALGENTA_COORDINATION: redis
          # S3_ENDPOINT_URL is NOT set here on purpose: it follows the Docker-assigned MinIO
          # port and arrives via $GITHUB_ENV from the service start step. A static value here
          # would shadow it.
          ALGENTA_EGRESS_ALLOWLIST: localhost,127.0.0.1
          PYTEST_TIMEOUT: 60
        run: ./scripts/run_repo_python.sh -m pytest -q tests/test_object_store_minio_smoke.py tests/test_multi_replica_chaos.py

      # Coverage lives HERE, not in a standalone workflow, because it needs the Postgres /
      # Dragonfly / MinIO containers this job already started. The old code-coverage.yml ran
      # `pytest tests/` on a bare runner with no services at all, so every DB-backed fixture
      # ERRORed at setup -- and because coverage was never a merge gate, nobody noticed it was
      # reporting a falsely LOW number rather than failing. (tests/conftest.py defaults
      # DATABASE_URL to a developer-local `angel@localhost/decision_engine`, which happened to
      # exist on the retired persistent Mac fleet and never exists on an ephemeral VM -- the
      # same stale-fleet assumption behind the buildx/npm/golden-image breakage.)
      # PUSH ONLY, and that is load-bearing, not tidiness. This step re-runs the ENTIRE
      # tests/ suite on top of a job that has already run the check graph, which pushed the
      # job past its time budget and got it KILLED mid-step -- surfacing as a red
      # `Test (Python 3.14)`, a REQUIRED check, on every PR. `|| true` does not save you
      # there: it swallows pytest's exit code, but not the job being terminated for running
      # too long. PRs are already gated by the check graph above and coverage is non-gating
      # signal, so PRs lose nothing by skipping it. (Self-inflicted, found live 2026-08-26.)
      - name: Python coverage report
        if: github.event_name == 'push'
        env:
          PYTEST_TIMEOUT: 60
        run: |
          ./scripts/run_repo_python.sh -m pytest -q \
            --cov=packages/algenta/algenta --cov=apps/api_server \
            --cov-report=xml:coverage.xml --cov-report=term-missing \
            tests/ || true

      - name: Upload coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

      # OBSERVED, not gating: repo-aware test selection (scripts/test_impact.py) reports the
      # subset of the suite this diff can actually influence — the signal that will trim PR test
      # runs once it has a production track record. Never fails the job: without codna installed
      # the tool degrades to its conservative local import graph (more tests, never fewer), and
      # any error surfaces as a notice instead of a red check.
      - name: Test-impact selection report (observed)
        if: always()
        run: |
          set +e
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="origin/main"
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null)
          if [ -z "$CHANGED" ]; then
            echo "::notice::test-impact: no diff against $BASE — nothing to report"
            exit 0
          fi
          ARGS=()
          while IFS= read -r f; do [ -n "$f" ] && ARGS+=("$f"); done <<< "$CHANGED"
          ./scripts/run_repo_python.sh scripts/test_impact.py --json --changed "${ARGS[@]}"
          rc=$?
          [ "$rc" -ne 0 ] && echo "::notice::test-impact exited $rc (observed-only, not gating)"
          exit 0

  # ── OpenResponses protocol conformance (Track C1) ──────────────────────────────────────────
  # Runs the REAL, official openresponses/openresponses compliance CLI (vendored NOWHERE in this
  # repo — checked out fresh at a pinned commit SHA below, under .openresponses-conformance/,
  # gitignored) against a REAL, network-booted instance of our own /v1/responses, authenticated
  # with a real bootstrapped API key. No real upstream LLM: apps/api_server/services/
  # llm_provider_service's own "openai_compatible" provider backend is pointed at
  # scripts/ci/openresponses_stub_provider.py, a tiny deterministic HTTP double (same JSON
  # shape tests/test_llm_chat_completions_tool_calling_contract.py's in-process
  # _FakeUpstreamClient already asserts against, just reachable over a real socket instead of a
  # monkeypatched httpx.AsyncClient — this job drives our app over real HTTP, so an in-process
  # fake cannot substitute for one).
  #
  # HONEST SCOPE (verified live, 2026-08-30, against this exact job's own boot sequence — see
  # PR description for the full scenario-by-scenario writeup): of the CLI's 17 real scenario
  # IDs, 7 are websocket-* (this repo has no WebSocket transport on /v1/responses at all — grep
  # apps/api_server/routers/llm.py, there is no `@router.websocket`) and 2 are compact-* (no
  # /v1/responses/compact endpoint exists). Those 9 are never attempted; see the step summary.
  # Of the remaining 8, only "response-output-phase-schema" is hard-gated below — it is the
  # ONLY one confirmed to pass for real, and it passes trivially: reading the CLI's own source
  # (src/lib/compliance-tests.ts) shows it sends no HTTP request at all — it validates a
  # hardcoded fixture against openresponses' OWN bundled zod schema and never touches
  # --base-url. It is wired here only as a live canary that the pinned checkout + bun + CLI
  # machinery itself still runs; it asserts nothing about our server.
  #
  # The other 7 (basic-response, system-prompt, multi-turn, assistant-phase, streaming-response,
  # tool-calling, image-input) are run in a SEPARATE, deliberately non-blocking step and today
  # ALL FAIL for real, confirmed by an actual run of this exact CLI against an actual booted
  # instance of this app. The root cause for 5 of them (basic-response, system-prompt,
  # multi-turn, assistant-phase, streaming-response) is the SAME, and it is bigger than any
  # single-field gap: ResponsesResponse (apps/api_server/schemas/llm.py) is a deliberate custom
  # "unified model response envelope", not the real OpenAI/OpenResponses Responses API wire
  # shape — it has no created_at/completed_at/tools/tool_choice/truncation/
  # parallel_tool_calls/text/top_p/temperature/reasoning/store/background/service_tier/... and
  # its output items carry `object: "response.output"` instead of the real API's
  # message/function_call/... `type` discriminator. openresponses' generated
  # responseResourceSchema (a strict zod object mirroring the real API 1:1) rejects our
  # response body at the schema-validation step, before any scenario-specific assertion even
  # runs. Closing this is a real, separate initiative (a new response-shape adapter, not a
  # field-level tweak) — tracked as a Track C1 follow-up, deliberately NOT attempted as a
  # "surgical" fix inside this job. The other 2 (tool-calling, image-input) fail for their own,
  # narrower, real reasons, independent of the above and individually fixable:
  #   - tool-calling: HTTP 422 "body.tools.0.function: Field required" — the real OpenResponses
  #     wire shape for a function tool is FLAT ({type, name, description, parameters}), but
  #     ResponsesRequest.tools (schemas/llm.py) only accepts the Chat-Completions-style NESTED
  #     shape ({type, function: {name, description, parameters}}). A real, narrow schema gap.
  #   - image-input: HTTP 422 — ResponseInputMessageItem's content list only ever accepts
  #     ResponseInputTextPart (type == "input_text"); there is no image content-part variant
  #     anywhere in the discriminated union. Image input is simply not implemented yet.
  # (For completeness: an assistant-role input item carrying an arbitrary extra "phase" field
  # does NOT 422 — pydantic's default extra="ignore" on ResponseInputMessageItem drops it
  # silently and the request still returns 200. That specific question the task set out to
  # answer resolves cleanly; it is the response-envelope shape above that actually blocks the
  # scenario, not the phase field.)
  #
  # This job stays green today (only the canary is hard-gated) while continuously, visibly
  # measuring the real 7 every run — the same "print every red, do not silently skip, do not
  # gate on it until it's real" shape this workflow's own blast-radius known-red baseline
  # already uses above for an analogous "known red, not yet closable inline" situation.
  openresponses-conformance:
    name: OpenResponses protocol conformance (Track C1)
    runs-on: ubuntu-latest
    needs: test
    env:
      JWT_SECRET: test-secret-not-for-production
      # Pinned upstream commit -- re-verify via
      # `gh api repos/openresponses/openresponses/commits/main --jq '.sha'` before ever bumping.
      OPENRESPONSES_PINNED_SHA: 92c12d96d7b61d6d15e2214daa5e9c6000ab6e1c
      ALGENTA_API_PORT: 58000
      STUB_PROVIDER_PORT: 58100
    steps:
      - name: Checkout algenta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Separate checkout, pinned to an exact commit SHA (not a branch/tag, which can move) --
      # never merged into this repo's tree; .gitignore excludes this path. Public repo, no
      # credentials needed.
      - name: Checkout openresponses/openresponses (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openresponses/openresponses
          ref: ${{ env.OPENRESPONSES_PINNED_SHA }}
          path: .openresponses-conformance
          persist-credentials: false

      # setup-bun extracts bun-linux-x64.zip with `unzip`, which the ubuntu-latest image ships.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: bun install (openresponses CLI)
        working-directory: .openresponses-conformance
        run: bun install --frozen-lockfile

      # Same dynamic-port, run-unique, labeled pattern as the `test` job above (see its own
      # "Start Postgres + Dragonfly + MinIO" step for the full rationale) -- this job runs on
      # its own runner and cannot reuse that job's containers.
      - name: Start Postgres + Redis
        env:
          CI_SERVICE_SUFFIX: openresponses-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pg_name="postgres-oresp-${CI_SERVICE_SUFFIX}"
          redis_name="redis-oresp-${CI_SERVICE_SUFFIX}"
          docker run -d --name "$pg_name" -p 0:5432 \
            --label algenta-ci=openresponses-conformance \
            --label "algenta-ci-created=$(date +%s)" \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=test_db \
            postgres:16-alpine
          docker run -d --name "$redis_name" -p 0:6379 \
            --label algenta-ci=openresponses-conformance \
            --label "algenta-ci-created=$(date +%s)" \
            redis:7-alpine
          pg_port=$(docker port "$pg_name" 5432 | head -n1 | awk -F: '{print $NF}')
          redis_port=$(docker port "$redis_name" 6379 | head -n1 | awk -F: '{print $NF}')
          {
            echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:${pg_port}/test_db"
            echo "DATABASE_URL_SYNC=postgresql://postgres:postgres@localhost:${pg_port}/test_db"
            echo "REDIS_URL=redis://localhost:${redis_port}/0"
          } >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            docker exec "$pg_name" pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | env PIXI_HOME="$GITHUB_WORKSPACE/.pixi" PIXI_BIN_DIR="$GITHUB_WORKSPACE/.pixi/bin" PIXI_NO_PATH_UPDATE=1 bash
          echo "$GITHUB_WORKSPACE/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Mojo/Pixi environment
        run: |
          PIXI_HOME="$GITHUB_WORKSPACE/.pixi" RATTLER_CACHE_DIR="$GITHUB_WORKSPACE/.cache/rattler/cache" pixi install --manifest-path mojo_env/pixi.toml

      - name: Run migrations
        run: ./scripts/run_repo_python.sh -m alembic -c apps/api_server/alembic.ini upgrade head

      - name: Start the deterministic stub upstream provider
        run: |
          nohup ./scripts/run_repo_python.sh scripts/ci/openresponses_stub_provider.py --port "$STUB_PROVIDER_PORT" \
            > /tmp/openresponses-stub-provider.log 2>&1 &
          echo $! > /tmp/openresponses-stub-provider.pid

      # ALGENTA_EGRESS_ALLOWLIST + ALGENTA_ALLOW_OUTBOUND_NETWORK: the stub provider is
      # loopback HTTP, which this app's own privacy/egress gate (B10, PRs #121-123) denies by
      # default the same as any other unlisted outbound host -- confirmed live: without these,
      # every /v1/responses call against the stub-backed model returns
      # {"error":{"code":"egress_denied", ...}}.
      - name: Boot the API server (stub provider configured)
        run: |
          PROVIDER_JSON='[{"id":"stub.chat","backend":"openai_compatible","base_url":"http://127.0.0.1:'"$STUB_PROVIDER_PORT"'","model_name":"stub-model","api_key_env":"OPENRESPONSES_STUB_API_KEY","capabilities":["chat_completions"]}]'
          {
            echo "ALGENTA_LLM_PROVIDER_MODELS_JSON=$PROVIDER_JSON"
            echo "OPENRESPONSES_STUB_API_KEY=stub-key-not-real"
            echo "ALGENTA_ALLOW_OUTBOUND_NETWORK=1"
            echo "ALGENTA_EGRESS_ALLOWLIST=localhost,127.0.0.1"
          } >> "$GITHUB_ENV"
          export ALGENTA_LLM_PROVIDER_MODELS_JSON="$PROVIDER_JSON"
          export OPENRESPONSES_STUB_API_KEY=stub-key-not-real
          export ALGENTA_ALLOW_OUTBOUND_NETWORK=1
          export ALGENTA_EGRESS_ALLOWLIST=localhost,127.0.0.1
          nohup ./scripts/run_repo_python.sh -m uvicorn apps.api_server.main:app --port "$ALGENTA_API_PORT" \
            > /tmp/openresponses-api.log 2>&1 &
          echo $! > /tmp/openresponses-api.pid
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${ALGENTA_API_PORT}/v1/health/ready" >/dev/null 2>&1; then
              echo "API server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API server did not become ready in time" >&2
          cat /tmp/openresponses-api.log >&2
          exit 1

      - name: Bootstrap a real API key
        run: |
          BOOTSTRAP_OUTPUT=$(./scripts/run_repo_python.sh scripts/bootstrap_self_host.py)
          API_KEY=$(printf '%s\n' "$BOOTSTRAP_OUTPUT" | sed -n 's/^BOOTSTRAP_API_KEY=//p' | head -1)
          if [ -z "$API_KEY" ]; then
            echo "::error::bootstrap_self_host.py did not emit BOOTSTRAP_API_KEY" >&2
            exit 1
          fi
          echo "::add-mask::$API_KEY"
          echo "ALGENTA_CONFORMANCE_API_KEY=$API_KEY" >> "$GITHUB_ENV"

      # Hard gate: the ONLY scenario directly confirmed (by an actual run against an actual
      # booted instance of this app, see this job's header comment) to pass. It never contacts
      # --base-url at all (a static fixture check against openresponses' own bundled schema),
      # so it functions purely as a live canary on the pinned checkout + bun + CLI machinery,
      # not as a conformance signal about our server -- asserting total==1 guards against a
      # silently-empty run masquerading as a pass.
      - name: Run compliance CLI — hard gate (confirmed-passing canary only)
        working-directory: .openresponses-conformance
        run: |
          bun run bin/compliance-test.ts \
            --base-url "http://localhost:${ALGENTA_API_PORT}/v1" \
            --api-key "$ALGENTA_CONFORMANCE_API_KEY" \
            --model stub.chat \
            --json \
            --filter response-output-phase-schema \
            > /tmp/openresponses-canary.json || true
          python3 ../scripts/ci/check_openresponses_canary.py /tmp/openresponses-canary.json 1

      # Advisory (non-blocking): the other 7 real, non-websocket, non-compact scenarios. All 7
      # are expected red today for the documented, confirmed-live reasons in this job's header
      # comment -- printed in full below and in the step summary every run, never silenced,
      # so this becomes a real gate the moment the response-envelope/tool-shape/image gaps
      # close, without needing anyone to remember to come back and wire it up then.
      - name: Run compliance CLI — advisory (real scenarios, currently red)
        if: always()
        working-directory: .openresponses-conformance
        run: |
          bun run bin/compliance-test.ts \
            --base-url "http://localhost:${ALGENTA_API_PORT}/v1" \
            --api-key "$ALGENTA_CONFORMANCE_API_KEY" \
            --model stub.chat \
            --json \
            --filter basic-response,system-prompt,multi-turn,assistant-phase,streaming-response,tool-calling,image-input \
            > /tmp/openresponses-advisory.json || true
          cat /tmp/openresponses-advisory.json

      - name: Step summary
        if: always()
        run: |
          {
            echo "## OpenResponses protocol conformance (Track C1)"
            echo
            echo "Upstream: [openresponses/openresponses@${OPENRESPONSES_PINNED_SHA}](https://github.com/openresponses/openresponses/commit/${OPENRESPONSES_PINNED_SHA})"
            echo
            echo "### Hard-gated (confirmed passing)"
            echo '```json'
            cat /tmp/openresponses-canary.json 2>/dev/null || echo '(missing)'
            echo '```'
            echo
            echo "### Advisory only — real scenarios against our real /v1/responses, currently red"
            echo "See this job's own header comment in .github/workflows/ci.yml for the full, confirmed root-cause writeup per scenario."
            echo '```json'
            cat /tmp/openresponses-advisory.json 2>/dev/null || echo '(missing)'
            echo '```'
            echo
            echo "### Deliberately never attempted (deferred, with reason)"
            echo "- websocket-response, websocket-sequential-responses, websocket-continuation, websocket-reconnect-store-false-recovery, websocket-previous-response-not-found, websocket-failed-continuation-evicts-cache, websocket-compact-new-chain — no WebSocket transport exists on /v1/responses."
            echo "- compact-response, compact-missing-model — no /v1/responses/compact endpoint exists."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── SDK artifact install ──────────────────────────────────────────────────
  # Proves the public Python SDKs install + import from the BUILT wheel in a fresh venv (not just
  # from source) — the "a user can actually `pip install` it" gate. Lean: no DB/Redis/pixi needed.
  sdk-artifact-install:
    name: SDK artifact install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 3.14 explicitly: verify_sdk_artifact_install.py SKIPS the algenta CLI gate on <3.14
      # (packages/algenta requires >=3.14), so running it on the image's system 3.12 would
      # turn this check into a green no-op.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build + fresh-venv install + import smoke
        run: |
          python -m pip install --upgrade build
          python scripts/verify_sdk_artifact_install.py

  # Proves the public TypeScript SDK installs + imports from the PACKED npm tarball (the artifact
  # `npm publish` uploads) in a fresh project — CJS require + ESM named import + @grpc/proto load +
  # a strict TS type-check + metadata. The Node LTS matrix catches version-specific ESM/CJS-interop
  # differences. Lean: npm-only, no DB/Redis/pixi.
  ts-sdk-artifact-install:
    name: TS SDK artifact install (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No pnpm setup in this job, deliberately: it builds a FRESH npm project and never
      # invokes pnpm (verify_ts_sdk_artifact_install.mjs mentions it only in comments). pnpm
      # was here solely to satisfy setup-node@v5's "Environment details" step, which runs
      # `pnpm -v` when it auto-detects the repo's pnpm — package-manager-cache:false below
      # already suppresses that, so the step was pure liability. Concretely: pnpm 10.15.0's
      # @pnpm/exe installer uses import.meta.dirname (Node >= 20.11), so under this job's
      # Node 18 matrix leg it died with path.resolve(undefined) -> "paths[0] must be of type
      # string". The Test job below still sets pnpm up — it genuinely uses it, on Node 22.
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # setup-node@v5 defaults package-manager-cache:true, which auto-detects the repo's pnpm
          # (packageManager field / lockfile) and hard-fails here with "Unable to locate executable
          # file: pnpm" — this job installs its own fresh npm project and needs no pnpm cache.
          package-manager-cache: false
      - name: Pack + fresh-project install + CJS/ESM/gRPC/strict-types smoke
        run: node scripts/verify_ts_sdk_artifact_install.mjs

  # PR-safe production-image proof: build the API image without pushing or deploying, then prove
  # the bundled Mojo worker supports the long-lived server mode the Fly API startup requires.
  # The push-to-main deploy repeats the same smoke against the pushed GHCR image before Fly rollout.
  api-image-mojo-smoke:
    name: API image Mojo runtime smoke
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    env:
      # Per-run-unique image tag: with per-ref concurrency, PR runs for DIFFERENT PRs may
      # overlap, and a single shared tag (the old :pr) would let one PR's build overwrite
      # the image another PR is about to verify. The verify script itself runs the image
      # with an auto-generated container name and no published ports, so no collision there.
      SMOKE_IMAGE_TAG: algenta-api-smoke:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image locally
        # `--platform linux/amd64` + DOCKER_BUILDKIT=1 pin the TARGET platform explicitly: Fly.io
        # production is x86_64 (the bundled Mojo binary is compiled for it), and the legacy
        # builder only partially honors --platform on a multi-stage Dockerfile (it resolves
        # stages that have a manifest for the host's arch to the host's arch), which on any
        # non-amd64 host produced a mixed-architecture image. BuildKit propagates --platform to
        # every stage uniformly, so the image is the same contract on every runner arch. The
        # per-run tag keeps overlapping PR runs from clobbering each other's image (see the
        # job env).
        run: DOCKER_BUILDKIT=1 docker build --pull --platform linux/amd64 -f infra/docker/Dockerfile.api.prod -t "$SMOKE_IMAGE_TAG" .

      # secret-scanning #14: the finished image must not carry the HS256 dev-licence secret (the
      # Dockerfile strips the stub; this proves it on the built filesystem). Same gate the push-to-main
      # build-* jobs run before pushing and the deploy jobs run before Fly.
      - name: Gate -- the image must not contain the dev-licence secret
        run: bash scripts/verify_no_dev_secret.sh "$SMOKE_IMAGE_TAG"

      - name: Verify bundled Mojo server mode
        run: bash scripts/verify_api_image_mojo_server_mode.sh "$SMOKE_IMAGE_TAG"

  # ── Helm chart: lint + template + kubeconform (no cluster, no registry creds) ──────────────
  # Mirrors api-image-mojo-smoke's shape: PR-triggered, validation-only, no push. Two values
  # overlays exercise the chart's two mutually-exclusive shapes (bundled deps + multi-replica
  # API + every optional feature on; external-dependency default) so both branches of
  # templates/_helpers.tpl's algenta.validateValues render at least once.
  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up helm + kubeconform
        uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          setup-tools: |
            helm
            kubeconform
          helm: "3.20.1"
          kubeconform: "0.7.0"

      - name: helm lint (bundled-deps + multi-replica + every optional feature)
        run: helm lint infra/helm/algenta -f infra/helm/algenta/ci/values-lint.yaml

      - name: helm lint (external-dependency default shape)
        run: helm lint infra/helm/algenta -f infra/helm/algenta/ci/values-lint-external.yaml

      - name: helm template + kubeconform (bundled-deps overlay)
        run: |
          helm template algenta infra/helm/algenta -f infra/helm/algenta/ci/values-lint.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.29.0 -

      - name: helm template + kubeconform (external-dependency overlay)
        run: |
          helm template algenta infra/helm/algenta -f infra/helm/algenta/ci/values-lint-external.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.29.0 -

      # Negative tests: the values.schema.json / algenta.validateValues guards documented in
      # README.md must actually fire, not just exist. `helm template` exiting non-zero is the
      # PASS condition for every case below.
      - name: Guard — engine.replicaCount must reject anything but 1
        run: |
          if helm template infra/helm/algenta --set api.image.tag=x --set engine.image.tag=x \
               --set engine.replicaCount=2 >/tmp/out.yaml 2>/tmp/err.txt; then
            echo "::error::engine.replicaCount=2 should have been rejected" >&2
            cat /tmp/err.txt >&2
            exit 1
          fi
          grep -q "must be 1" /tmp/err.txt

      - name: Guard — api.replicaCount>1 requires RWX + acknowledgement
        run: |
          if helm template infra/helm/algenta --set api.image.tag=x --set engine.image.tag=x \
               --set api.replicaCount=3 --set config.apiPublicBaseUrl=http://x \
               --set externalDatabase.host=h --set externalDatabase.existingSecret=s \
               --set externalRedis.host=h \
               --set externalObjectStore.endpointUrl=http://x --set externalObjectStore.existingSecret=s \
               >/tmp/out.yaml 2>/tmp/err.txt; then
            echo "::error::api.replicaCount=3 without the RWX acknowledgement should have been rejected" >&2
            cat /tmp/err.txt >&2
            exit 1
          fi
          grep -q "ReadWriteMany" /tmp/err.txt

      - name: Guard — external and bundled Postgres cannot both be enabled
        run: |
          if helm template infra/helm/algenta --set api.image.tag=x --set engine.image.tag=x \
               --set postgresql.enabled=true --set config.apiPublicBaseUrl=http://x \
               --set externalDatabase.host=h --set externalDatabase.existingSecret=s \
               --set externalRedis.host=h \
               --set externalObjectStore.endpointUrl=http://x --set externalObjectStore.existingSecret=s \
               >/tmp/out.yaml 2>/tmp/err.txt; then
            echo "::error::externalDatabase.enabled + postgresql.enabled both true should have been rejected" >&2
            cat /tmp/err.txt >&2
            exit 1
          fi
          grep -q "pick exactly one Postgres source" /tmp/err.txt

  # ── Helm chart: real kind-cluster install smoke test ───────────────────────────────────────
  # PR-triggered. Builds the REAL API image the same way api-image-mojo-smoke already does
  # (local build, no push, no registry creds beyond the default GITHUB_TOKEN reading the
  # public-within-org mojo base image) and installs this chart against it in a disposable kind
  # cluster. Does NOT build or load the engine image — see
  # infra/helm/algenta/ci/values-kind-smoke.yaml and infra/helm/algenta/README.md ("What was
  # and was not verified with a real kind cluster") for exactly why, and what that leaves
  # untested.
  helm-kind-smoke:
    name: Helm chart kind install smoke
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    env:
      SMOKE_IMAGE_TAG: algenta-api-kind-smoke:${{ github.run_id }}-${{ github.run_attempt }}
      KIND_CLUSTER: algenta-helm-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identical build to api-image-mojo-smoke's own step — see that job's comment for why
      # --platform linux/amd64 + DOCKER_BUILDKIT=1 pin the target platform explicitly.
      - name: Build API image locally
        run: DOCKER_BUILDKIT=1 docker build --pull --platform linux/amd64 -f infra/docker/Dockerfile.api.prod -t "$SMOKE_IMAGE_TAG" .

      - name: Set up helm
        uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          setup-tools: |
            helm
          helm: "3.20.1"

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          version: v0.31.0
          kubectl_version: v1.35.0

      - name: Load API image into kind
        run: kind load docker-image "$SMOKE_IMAGE_TAG" --name "$KIND_CLUSTER"

      - name: helm install (bundled Postgres/Redis/MinIO, engine disabled — see the overlay's header)
        run: |
          helm install algenta-smoke infra/helm/algenta \
            -f infra/helm/algenta/ci/values-kind-smoke.yaml \
            --set api.image.repository="${SMOKE_IMAGE_TAG%%:*}" \
            --set api.image.tag="${SMOKE_IMAGE_TAG##*:}" \
            --set api.image.pullPolicy=Never \
            --wait --timeout 8m

      # Only runs when the install above failed to reach Ready in time — prints exactly what
      # was stuck (pending/crashlooping Pod, OOMKilled container, failing probe) instead of
      # leaving a bare "context deadline exceeded" as the only diagnostic, which is what the
      # first run of this job left behind.
      - name: Diagnose a failed install
        if: failure()
        run: |
          echo "::group::kubectl get pods"
          kubectl get pods -o wide || true
          echo "::endgroup::"
          echo "::group::kubectl describe pods"
          kubectl describe pods || true
          echo "::endgroup::"
          echo "::group::api container logs (current + previous, if crashed)"
          kubectl logs -l app.kubernetes.io/component=api --all-containers --tail=300 || true
          kubectl logs -l app.kubernetes.io/component=api --all-containers --tail=300 --previous || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events --sort-by=.lastTimestamp | tail -60 || true
          echo "::endgroup::"

      # Two prior attempts at this job both left the api Pod stuck at readiness 503 with NO
      # exception ever logged (apps/api_server/main.py's health_ready() catches Exception
      # silently, by design, so it "reports, never raises" -- but that also means it never
      # tells an operator WHY). Reproducing the same DB check inside the live container, with
      # a real traceback, is the only way to see the actual cause instead of guessing again.
      #
      # infra/helm/algenta/ci/kind_smoke_check_db.py is a real, left-aligned .py file (read
      # via `cat`, not embedded as multi-line `python -c "..."` in this YAML block) --
      # deliberately, after an earlier version of this exact step broke YAML's
      # literal-block-scalar parsing by putting Python continuation lines at column 0. See
      # this workflow's own "Blast-radius test selection" step for the same lesson learned
      # previously about one-line vs multi-line embedded Python.
      - name: Deep-dive DB connectivity from inside the api Pod
        if: failure()
        run: |
          POD=$(kubectl get pods -l app.kubernetes.io/component=api -o jsonpath='{.items[0].metadata.name}' || true)
          if [ -z "$POD" ]; then
            echo "::warning::no api Pod found to exec into"
            exit 0
          fi
          echo "::group::resolved environment inside the api container (secrets redacted)"
          kubectl exec "$POD" -- env | sort | sed -E 's/(PASSWORD|SECRET|TOKEN|KEY)=.*/\1=***REDACTED***/' || true
          echo "::endgroup::"
          echo "::group::DNS + TCP reachability to the bundled Postgres Service"
          kubectl exec "$POD" -- python3 -c "import socket; print('resolved:', socket.gethostbyname('algenta-smoke-postgresql'))" || echo "DNS resolution failed"
          kubectl exec "$POD" -- python3 -c "import socket; s=socket.create_connection(('algenta-smoke-postgresql', 5432), timeout=5); print('TCP connect: OK'); s.close()" || echo "TCP connect failed"
          echo "::endgroup::"
          echo "::group::live reproduction of the readiness DB check, with a real traceback"
          kubectl exec "$POD" -- python3 -c "$(cat infra/helm/algenta/ci/kind_smoke_check_db.py)" || true
          echo "::endgroup::"

      - name: Assert /v1/health and /v1/health/ready return 200 through the api Service
        run: |
          kubectl run algenta-smoke-curl --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- \
            sh -c '
              set -eu
              echo "liveness:"; curl -sf --max-time 10 http://algenta-smoke-api:8000/v1/health; echo
              echo "readiness:"; curl -sf --max-time 10 http://algenta-smoke-api:8000/v1/health/ready; echo
            '

      - name: helm test
        run: helm test algenta-smoke --logs

  # ── Build Docker images ───────────────────────────────────────────────────
  # THREE SEPARATE JOBS, not three sequential builds crammed into one job on one runner's disk.
  # That original shape needed `docker builder/image prune` between images (#950), then again
  # before the Engine image's own SBOM scan specifically (#954), then clearing syft's own /tmp
  # stereoscope cache too (#963) -- three rounds of "reclaim one more thing" in one week is the
  # actual signal: patching the symptom after each new disk sink surfaces doesn't end, because the
  # real problem is architectural, not a missing prune call. `helm-oci-push` right below already
  # states the correct fix for this whole failure class in its own pre-existing comment: "a fresh
  # runner for this job sidesteps that failure class entirely rather than needing a fourth reclaim
  # step." Applying that same principle to the image builds themselves -- one job per image, each
  # on its own fresh GitHub-hosted runner -- means no image's build+push+scan ever shares a disk
  # with another's, so there is nothing to accumulate and nothing left to prune. No
  # `docker builder/image prune` step appears anywhere below -- but see THE INCIDENT further down:
  # one does exist again, in the composite scan action, because this paragraph's conclusion was
  # wrong about a single job's own footprint even though it is right about jobs not sharing a disk.
  # Runner sizing, MEASURED rather than remembered -- the previous text here claimed
  # "ubuntu-latest's 14 GB disk", which the `df -h` that ./.github/actions/image-sbom-scan now
  # prints disproves on both counts:
  #
  #   /dev/root   72G   61G   12G  85% /     <- at scan time, before reclaim
  #   /dev/root   72G   59G   14G  82% /     <- after reclaim (~2G freed)
  #
  # The disk is 72G, and ~14G is the space FREE at that point in the job, not the disk's size --
  # 61G is already consumed by the runner image's preinstalled toolchains before this workflow
  # runs a thing. Reading free space as capacity is how the wrong number got written down, and it
  # matters because the sizing rule below is calibrated against it.
  #
  # ESCALATION RULE, in the units the `df` output actually reports. None of these jobs compiles
  # Mojo (the Dockerfiles COPY the prebuilt worker from ghcr.io/<repo>/mojo), so free disk at scan
  # time is the only constraint. Two data points bracket it:
  #   * 12G free  -> FAILED, grype "database or disk is full" while hydrating its vulnerability DB
  #                  (it downloads to a temp dir then migrates in place, needing ~2x the DB size
  #                  transiently) on top of the scan's docker-daemon image copy.
  #   * 14G free  -> PASSED, but only after the daemon copy was removed via the `registry:` source.
  # So escalate a job to `thyn-8c` (300 GB) when free disk at scan time is BELOW 20 GB. 14G is a
  # proven-pass with no margin and 12G is a proven-fail; 20G sits clear of both. Read the number
  # off the composite's "disk before reclaim" line rather than estimating -- that step exists so
  # this decision is made against a measurement.
  #
  # THE INCIDENT the rule above was recalibrated from. On main at be51fd2ba all three of these
  # jobs failed inside ./.github/actions/image-sbom-scan with grype's "unable to migrate: database
  # or disk is full" -- after the image build and push had already SUCCEEDED, so the failure was
  # purely in the advisory scan step. The reasoning in the first paragraph, "one job per image on a
  # fresh runner means nothing accumulates", holds ACROSS jobs but is false WITHIN one: a single
  # build+push+scan is by itself enough to exhaust the free space, because the scan was resolving
  # the image through the docker daemon (pull + `docker save` to an on-disk tarball) on top of the
  # buildkit state, and then hydrating grype's DB. Hence the two fixes now living in the composite
  # action -- a `registry:` source so the scan never touches the daemon, and a prune step ahead of
  # it -- and hence the `df -h` pair that makes the next such decision measurable.
  #
  # Note also that `fail-build: false` on the grype step did NOT protect these jobs. It suppresses
  # failing on discovered CVE severities, not on grype being unable to run at all; a DB that cannot
  # hydrate exits non-zero and fails the step with no vulnerability finding involved. An advisory
  # step that can still red the build is worth knowing about before you rely on it being advisory.
  build-api:
    name: Build & Push Docker (API image)
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.deploy_needed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          # Per-run, per-image builder: a reused docker-container builder kept a stale buildkit
          # auth state and pulled ghcr.io/thyn-ai/algenta/mojo ANONYMOUSLY mid-job (401) even
          # though the login step had succeeded minutes earlier in the same job. A fresh buildkit
          # per run always sees this run's docker config; the teardown step below removes it.
          name: ci-${{ github.run_id }}-api

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      # secret-scanning #14: gate the FINISHED image on the absence of the HS256 dev-licence secret
      # before anything reaches the registry. The rootfs is STREAMED out of buildx (`--output
      # type=tar,dest=-`, the same filesystem `docker export` would give) straight into the gate:
      # nothing is loaded into the daemon and nothing is written to the runner disk. The first
      # cut of this gate used `load: true`, which materialised a second copy of the image in the
      # daemon and ran the 14 GB ubuntu-latest disk out of space on the engine image (sidecar +
      # Mojo + Python) -- `write /app/agent-core/...: no space left on device`. The push step
      # below re-runs the identical build on the same per-run builder (every layer a cache hit);
      # the deploy jobs gate the pulled image once more before Fly.
      - name: Gate -- the API image rootfs must not contain the dev-licence secret
        env:
          BUILDER: ci-${{ github.run_id }}-api
          CACHE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:api-v2
        run: |
          set -euo pipefail
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            -f infra/docker/Dockerfile.api.prod \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --output type=tar,dest=- . \
            | python3 scripts/verify_no_dev_secret.py --tar - --label "api-image@$GITHUB_SHA"

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.api.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          # The gha cache backend measured as a net loss here: all three images shared the ONE
          # default scope (each export evicted the others) and mode=max layer blobs exceeded the
          # 10 GB actions-cache cap, so every run paid ~10 min/image EXPORTING cache that was
          # already evicted before the next run (29.6 of 45.2 build-minutes = cache export;
          # only 10/117 stages CACHED). GHCR registry cache has its own storage budget and each
          # image gets its own ref.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:api-v2
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:api-v2,mode=max,compression=zstd

      # B4 (supply chain): SBOM + vulnerability report for the exact image just pushed, by digest
      # (not `latest` — see the composite action's own header for why that distinction matters).
      # Advisory only; not a signing step — see the composite action's header for that boundary.
      - name: SBOM + vulnerability scan for API image
        uses: ./.github/actions/image-sbom-scan
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api@${{ steps.build-api.outputs.digest }}
          artifact-prefix: api
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # See the setup step's comment above.
      - name: Remove per-run buildx builder
        if: always()
        run: docker buildx rm "ci-${{ github.run_id }}-api" 2>/dev/null || true

  build-worker:
    name: Build & Push Docker (Worker image)
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.deploy_needed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          # See build-api's identical step for why this is per-run and per-image.
          name: ci-${{ github.run_id }}-worker

      - name: Extract metadata for Worker image
        id: meta-worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      # secret-scanning #14: gate the FINISHED image on the absence of the HS256 dev-licence secret
      # before anything reaches the registry. The rootfs is STREAMED out of buildx (`--output
      # type=tar,dest=-`, the same filesystem `docker export` would give) straight into the gate:
      # nothing is loaded into the daemon and nothing is written to the runner disk. The first
      # cut of this gate used `load: true`, which materialised a second copy of the image in the
      # daemon and ran the 14 GB ubuntu-latest disk out of space on the engine image (sidecar +
      # Mojo + Python) -- `write /app/agent-core/...: no space left on device`. The push step
      # below re-runs the identical build on the same per-run builder (every layer a cache hit);
      # the deploy jobs gate the pulled image once more before Fly.
      - name: Gate -- the Worker image rootfs must not contain the dev-licence secret
        env:
          BUILDER: ci-${{ github.run_id }}-worker
          CACHE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:worker-v2
        run: |
          set -euo pipefail
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            -f infra/docker/Dockerfile.worker.prod \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --output type=tar,dest=- . \
            | python3 scripts/verify_no_dev_secret.py --tar - --label "worker-image@$GITHUB_SHA"

      - name: Build and push Worker image
        id: build-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.worker.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          # Per-image registry cache — see the rationale at the API image step.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:worker-v2
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:worker-v2,mode=max,compression=zstd

      - name: SBOM + vulnerability scan for Worker image
        uses: ./.github/actions/image-sbom-scan
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker@${{ steps.build-worker.outputs.digest }}
          artifact-prefix: worker
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove per-run buildx builder
        if: always()
        run: docker buildx rm "ci-${{ github.run_id }}-worker" 2>/dev/null || true

  build-engine:
    name: Build & Push Docker (Engine image)
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.deploy_needed == 'true'
    permissions:
      contents: read
      packages: write
    # `secrets` cannot be used in `if:` conditionals, but `env` (which may read secrets) can.
    env:
      CODNA_TOKEN: ${{ secrets.CODNA_GHCR_READ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          # See build-api's identical step for why this is per-run and per-image.
          name: ci-${{ github.run_id }}-engine

      # The published Algenta engine encapsulates the async worker, Mojo binary, and agent runtime.
      # Its internal base is private, so a missing read token must fail the release rather than
      # silently omit the image required by the public self-host installer.
      - name: Require bundled engine build credential
        if: ${{ env.CODNA_TOKEN == '' }}
        run: |
          echo "CODNA_GHCR_READ_TOKEN is required to publish the Algenta engine image" >&2
          exit 1

      - name: Log in to GHCR for the bundled engine base
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.CODNA_TOKEN }}

      - name: Extract metadata for Engine image
        id: meta-engine
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/engine
          tags: |
            type=sha,prefix=git-,format=short
            type=raw,value=latest

      # secret-scanning #14: gate the FINISHED image on the absence of the HS256 dev-licence secret
      # before anything reaches the registry. The rootfs is STREAMED out of buildx (`--output
      # type=tar,dest=-`, the same filesystem `docker export` would give) straight into the gate:
      # nothing is loaded into the daemon and nothing is written to the runner disk. The first
      # cut of this gate used `load: true`, which materialised a second copy of the image in the
      # daemon and ran the 14 GB ubuntu-latest disk out of space on the engine image (sidecar +
      # Mojo + Python) -- `write /app/agent-core/...: no space left on device`. The push step
      # below re-runs the identical build on the same per-run builder (every layer a cache hit);
      # the deploy jobs gate the pulled image once more before Fly.
      - name: Gate -- the Engine image rootfs must not contain the dev-licence secret
        env:
          BUILDER: ci-${{ github.run_id }}-engine
          CACHE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:engine-v2
        run: |
          set -euo pipefail
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            -f infra/docker/Dockerfile.engine.prod \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --output type=tar,dest=- . \
            | python3 scripts/verify_no_dev_secret.py --tar - --label "engine-image@$GITHUB_SHA"

      - name: Build and push Engine image
        id: build-engine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.engine.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-engine.outputs.tags }}
          labels: ${{ steps.meta-engine.outputs.labels }}
          # Per-image registry cache — see the rationale at the API image step. Pushed with the
          # same credentials that already push the engine image itself (same GHCR namespace).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:engine-v2
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:engine-v2,mode=max,compression=zstd

      # CODNA_TOKEN, NOT GITHUB_TOKEN. Live failure the first time this ran (this job only
      # triggers on push to main, so this could not be caught pre-merge): GITHUB_TOKEN pulling
      # ghcr.io/thyn-ai/algenta/engine got `permission_denied: read_package` / MANIFEST_UNKNOWN --
      # the reasoning that it would have the same read access as api/worker (same repo, same
      # package namespace) was wrong, and untested. deploy.yml's own comment already documented
      # the actual fact: "CODNA_GHCR_READ_TOKEN (broad read:packages) reads all three images
      # (api/worker/engine)" -- GITHUB_TOKEN evidently does not, for the engine package
      # specifically. CODNA_TOKEN is the same credential the "Log in to GHCR for the bundled
      # engine base" step above already uses successfully against this exact image.
      - name: SBOM + vulnerability scan for Engine image
        uses: ./.github/actions/image-sbom-scan
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/engine@${{ steps.build-engine.outputs.digest }}
          artifact-prefix: engine
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ env.CODNA_TOKEN }}

      - name: Remove per-run buildx builder
        if: always()
        run: docker buildx rm "ci-${{ github.run_id }}-engine" 2>/dev/null || true

  # ── Package + push the Helm chart as an OCI artifact ───────────────────────
  # Separate job (not a step in any build-* job) so this chart's own package/push never shares a
  # disk with an image build — the same fresh-runner-per-unit-of-work principle the three build-*
  # jobs above now also follow. Runs only after all three image builds succeed (needs: [...]),
  # same push-to-main-only gating, and only once helm-lint would have passed on this same content
  # (this job re-lints before packaging — belt and suspenders, cheap relative to the rest of the
  # build jobs).
  helm-oci-push:
    name: Package + push Helm chart (OCI)
    runs-on: ubuntu-latest
    needs: [build-api, build-worker, build-engine]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up helm
        uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          setup-tools: |
            helm
          helm: "3.20.1"

      - name: helm lint (sanity check before packaging)
        run: |
          helm lint infra/helm/algenta -f infra/helm/algenta/ci/values-lint.yaml
          helm lint infra/helm/algenta -f infra/helm/algenta/ci/values-lint-external.yaml

      # Chart.yaml's version stays a plain SemVer the maintainer bumps deliberately (matching
      # "no manual release pushes" — chart version bumps are a normal PR, not a release
      # ceremony); the pushed OCI tag adds +git.<sha> build metadata instead of mutating
      # Chart.yaml on every main push, so the chart's own version history stays meaningful
      # while every push is still individually retrievable by digest or by this suffix.
      - name: Package chart
        id: package
        run: |
          CHART_VERSION=$(grep -m1 '^version:' infra/helm/algenta/Chart.yaml | awk '{print $2}')
          FULL_VERSION="${CHART_VERSION}+git.$(git rev-parse --short HEAD)"
          helm package infra/helm/algenta --version "$FULL_VERSION" --app-version "$FULL_VERSION" --destination /tmp/helm-package
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (helm registry login)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart as an OCI artifact
        run: helm push "/tmp/helm-package/algenta-${{ steps.package.outputs.full_version }}.tgz" "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/charts"

  # ── Deploy to Fly (AUTOMATIC on merge to main) ────────────────────────────
  # Self-contained (not a reusable-workflow call): mirror the freshly-built `latest` API image into
  # the Fly registry and `flyctl deploy` codna-api, whose release_command applies alembic migrations.
  # Runs only after all three images are pushed (needs: [build-api, build-worker, build-engine])
  # and only on a push to main — never on PRs.
  #
  # The CONTROL PLANE deploys automatically too — see the deploy-control-plane job below. Only the
  # ENGINE (codna-engine) and tag-pinned/one-off deploys still go through the manual deploy.yml.
  deploy:
    name: Deploy to Fly (codna-api)
    runs-on: ubuntu-latest
    needs: [build-api, build-worker, build-engine]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    # Serialize deploys OF THIS APP so two quick merges cannot run two `alembic upgrade head`
    # against codna-pg concurrently. cancel-in-progress is deliberately false: cancelling a
    # half-finished deploy/migration is worse than queueing behind it. The group is per-app, so
    # this never blocks the control-plane deploy.
    concurrency:
      group: deploy-codna-api
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SRC: ghcr.io/${{ github.repository }}
      TAG: latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flyctl
        # FLYCTL_INSTALL (respected by fly.io/install.sh) keeps the install inside this job's
        # own scratch dir.
        run: |
          export FLYCTL_INSTALL="$RUNNER_TEMP/fly"
          curl -fsSL https://fly.io/install.sh | sh
          echo "$FLYCTL_INSTALL/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR (pull the prebuilt api image)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CODNA_GHCR_READ_TOKEN }}

      - name: Authenticate Docker to the Fly registry
        run: flyctl auth docker

      - name: Deploy codna-api
        run: |
          set -euo pipefail
          # Architecture-agnostic deploy: the build publishes linux/amd64 (the Fly target
          # platform) regardless of runner arch, so pin the PULL to the image's platform
          # instead of inheriting the runner's.
          docker pull --platform linux/amd64 "$SRC/api:$TAG"
          bash scripts/verify_no_dev_secret.sh "$SRC/api:$TAG"
          bash scripts/verify_api_image_mojo_server_mode.sh "$SRC/api:$TAG"
          docker tag  "$SRC/api:$TAG" "registry.fly.io/codna-api:$TAG"
          docker push "registry.fly.io/codna-api:$TAG"
          flyctl deploy -c fly.api.toml -a codna-api -i "registry.fly.io/codna-api:$TAG"

      # Prove the rollout serves the docs' FIRST call, rather than trusting a green flyctl exit
      # (fly.api.toml's /v1/health check only proves the process answers). On 2026-09-22 every
      # POST /v1/playground on api.algenta.ai -- which fronts codna-api, see
      # infra/cloudflare/telys/waf.tf -- returned 500 because the image lacked the algenta SDK
      # package, and nothing in this job noticed. The body is gitbook/playground.md's cURL example
      # verbatim; the keyless route allows 10 requests/minute per IP, so one probe is well inside.
      - name: Verify codna-api serves the documented playground call
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -A "ci-verify" -X POST https://api.algenta.ai/v1/playground \
            -H "Content-Type: application/json" \
            -d '{"mode":"decision","inputs":{"revenue":120000,"cost":70000},"runs":1000}' \
            | tee /dev/stderr | grep -q '"mode":"decision"'

  # ── Deploy the CONTROL PLANE to Fly (AUTOMATIC on merge to main) ──────────
  # WHY THIS EXISTS: api.telys.ai is served by the `algenta-control-plane` Fly app, but until now
  # NOTHING deployed it automatically — it was reachable only via a manual `workflow_dispatch` of
  # deploy.yml. The result was silent drift: on 2026-07-28 the control plane was found running a
  # 10-commit-old image (last deployed af9b72d6, 2026-07-25), so merged-and-"deployed" fixes were
  # live on codna-api but absent from the hostname the Telys CLI actually calls. A merged
  # /v1/products/{product}/whoami endpoint 404'd in production as a result.
  #
  # DELIBERATELY A SEPARATE JOB, not another step in `deploy`: it depends on the three build-*
  # jobs, NOT on `deploy`. If the codna-api deploy fails, the control plane must still get the new
  # image —
  # otherwise a flaky engine-image check silently reintroduces exactly the drift this job exists
  # to prevent.
  #
  # TRADE-OFF, STATED PLAINLY: this makes every merge to main run `alembic upgrade head` against
  # algenta-control-plane-pg (the control plane's OWN Postgres — never codna-pg). That is the same
  # contract codna-api has already had, but the blast radius is larger: this app is the shared
  # auth / billing / licensing plane for algenta, codna, cohenta and telys. Mitigations are the
  # rolling strategy + /v1/health checks in fly.control-plane.toml, and the concurrency group
  # below. A migration that cannot be applied safely on every merge must be gated behind an
  # expand/contract pattern, not by leaving this app un-deployed.
  deploy-control-plane:
    name: Deploy to Fly (algenta-control-plane)
    runs-on: ubuntu-latest
    needs: [build-api, build-worker, build-engine]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    # Per-app group: serializes control-plane deploys with each other (never two concurrent
    # migrations against algenta-control-plane-pg) without blocking the codna-api deploy.
    concurrency:
      group: deploy-algenta-control-plane
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SRC: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flyctl
        # FLYCTL_INSTALL (respected by fly.io/install.sh) keeps the install inside this job's
        # own scratch dir.
        run: |
          export FLYCTL_INSTALL="$RUNNER_TEMP/fly"
          curl -fsSL https://fly.io/install.sh | sh
          echo "$FLYCTL_INSTALL/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR (pull the prebuilt api image)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CODNA_GHCR_READ_TOKEN }}

      - name: Authenticate Docker to the Fly registry
        run: flyctl auth docker

      # The control plane reuses the SAME api image as codna-api and selects the engine-free app
      # via ALGENTA_SERVICE_ROLE=control_plane (set in fly.control-plane.toml). Passing -i makes
      # flyctl ignore that file's [build] section, so no separate image is built. This mirrors
      # deploy.yml's existing control-plane step.
      #
      # Pinned to the IMMUTABLE git-<short-sha> tag rather than `latest`, so the artifact deployed
      # is provably the commit that triggered this run. `latest` is mutable: with two auto-deploy
      # jobs now running in parallel, a second merge could move `latest` between the two pulls and
      # deploy mismatched images to the two apps. The tag comes from the build job's
      # docker/metadata-action (`type=sha,prefix=git-,format=short`).
      #
      # No verify_api_image_mojo_server_mode.sh here, unlike codna-api: the control plane mounts
      # no engine routers and ships no Mojo, so that assertion does not apply to it.
      - name: Deploy algenta-control-plane
        run: |
          set -euo pipefail
          TAG="git-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "Deploying algenta-control-plane at pinned tag: $TAG"
          docker pull --platform linux/amd64 "$SRC/api:$TAG"
          bash scripts/verify_no_dev_secret.sh "$SRC/api:$TAG"
          docker tag  "$SRC/api:$TAG" "registry.fly.io/algenta-control-plane:$TAG"
          docker push "registry.fly.io/algenta-control-plane:$TAG"
          flyctl deploy -c fly.control-plane.toml -a algenta-control-plane \
            -i "registry.fly.io/algenta-control-plane:$TAG"

      # Prove the deploy actually took, rather than trusting a green flyctl exit. The drift was
      # invisible precisely because nobody asserted what the hostname served, so assert it.
      - name: Verify the control plane is serving
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -A "ci-verify" \
            https://api.telys.ai/v1/control-plane/meta | tee /dev/stderr \
            | grep -q '"role":"control_plane"'
