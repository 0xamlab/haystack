# Build + sign + verify + publish the managed-runtime bundle — the artifact the SQAI
# provisioner downloads and runs transparently (no venv, no repo checkout, no manual
# daemon). The bundle carries main's SHARDED runtime workers (27 shards × <=24 modules,
# the #2766 module-ceiling mitigation) + their runtime-shards.json routing map, a frozen
# PyInstaller daemon, a baked runtime-library inventory (the lean bundle ships no .mojo
# source) and a trimmed CPython home for the workers' embedded interpreter.
#
# Runners: build-linux compiles the full 27-shard Mojo runtime and runs on `thyn-8c` (org
# larger runner, 8 cores / 32 GB / 300 GB, billed); release only talks to the GitHub API and
# runs on `ubuntu-latest`. There is no darwin leg (see the removal commit for what shipping
# macOS artifacts again would require). The linux-x64 leg runs inside an explicit ubuntu:22.04
# container (same pattern as build-runtime.yml's build-linux job). Linux OS baseline: the
# daemon is PyInstaller-built ON ubuntu:22.04, so its floor is ubuntu:22.04's glibc (2.35);
# the acceptance gate below re-runs the built bundle inside a CLEAN ubuntu:22.04 container.
#
# Signing: secrets.ALGENTA_BUNDLE_SIGNING_PRIVATE_KEY (RSA-4096; the matching public key
# is embedded in the SQAI SDK's trust root — runtime/trust.ts, key_id
# algenta-runtime-bundle-release-1). Without the secret (forks / dry runs) the build falls
# back to a LOUDLY-flagged dev keypair; the SQAI provisioner rejects dev-signed bundles.
#
# Distribution: GitHub Release assets on runtime-bundle-v* tags (this repo has no R2
# secrets; the provisioner fetches plain HTTPS URLs, so release asset URLs work as-is).
# The runtime_bundle footer for the capability contract is regenerated at cut time with
# scripts/generate_algenta_runtime_contract.py --bundle-metadata.

name: build-runtime-bundle

on:
  push:
    tags: ["runtime-bundle-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "runtime_bundle_version (default: 0.1.1-dev)"
        required: false
        default: "0.1.1-dev"

permissions:
  contents: write # release upload on runtime-bundle-v* tags

# Never let two overlapping cuts of the same ref race on the release tag; queue instead
# of cancelling a cut mid-flight.
concurrency:
  # Per-ref group (this workflow has no pull_request trigger).
  group: runtime-bundle-${{ github.ref }}
  cancel-in-progress: false

env:
  # Job-level (not step-level) so BOTH the shard compiles AND the bundle's
  # inventory-baking step see the same module set — the baked inventory must match the
  # compiled workers (else discovery advertises functions the worker can't run). The
  # production cut leaves this EMPTY: build_runtime_shards.py compiles the full catalog
  # across the shards, and the baked inventory is the same full catalog. A filtered
  # local/dry-run build sets it for both halves at once.
  MOJO_RUNTIME_MODULE_FILTER: ""

jobs:
  build-linux:
    name: bundle (linux-x64)
    # `thyn-8c`: full 27-shard Mojo compile (~40-50 min native). The build runs inside an
    # explicit ubuntu:22.04 container (`docker run`, not job-level `container:`: the script
    # hardcodes root + the /work mount, and the container IS the daemon's glibc-2.35 build
    # floor) — the same pattern build-runtime.yml's build-linux uses. See
    # .github/scripts/build_runtime_bundle_linux_amd64.sh.
    runs-on: thyn-8c
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve bundle version
        id: version
        env:
          # `${{ }}` never appears inside `run:`: the dispatch input reaches bash as data through
          # env and is read back as "$VAR", so a crafted value cannot become script text.
          INPUT_VERSION: ${{ github.event.inputs.version || '0.1.1-dev' }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == runtime-bundle-v* ]]; then
            echo "version=${GITHUB_REF_NAME#runtime-bundle-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build linux bundle in an amd64 container
        env:
          ALGENTA_BUNDLE_SIGNING_PRIVATE_KEY: ${{ secrets.ALGENTA_BUNDLE_SIGNING_PRIVATE_KEY }}
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker pull --platform linux/amd64 ubuntu:22.04
          # Same per-shard budget as build-runtime's build-linux; the RSS ceiling is generous
          # next to the measured 1.2-1.8 GiB per-shard peaks on Mojo 1.0.0.
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ALGENTA_BUNDLE_SIGNING_PRIVATE_KEY \
            -e BUNDLE_VERSION \
            -e GITHUB_REPOSITORY \
            -e SHARD_TIMEOUT=2700 -e SHARD_MAX_RSS_MB=32768 \
            ubuntu:22.04 bash .github/scripts/build_runtime_bundle_linux_amd64.sh

      - name: Acceptance gate — clean ubuntu:22.04 container health check
        run: |
          rm -rf /tmp/bundle-extract-linux
          mkdir -p /tmp/bundle-extract-linux
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/dist/runtime-bundle:/opt/bundle" \
            -v /tmp/bundle-extract-linux:/opt/extract \
            ubuntu:22.04 bash -ec '
              tar -xzf /opt/bundle/algenta-runtime-*-linux-x64.tar.gz -C /opt/extract
              ALGENTA_RUNTIME_DIR=/opt/extract/.runtime /opt/extract/daemon/algenta-runtime-daemon --version
              ALGENTA_RUNTIME_DIR=/opt/extract/.runtime \
                ALGENTA_DAEMON_TCP=127.0.0.1:50199 \
                ALGENTA_DAEMON_SOCK=/opt/extract/daemon.sock \
                ALGENTA_MOJO_SOCK=/opt/extract/worker.sock \
                /opt/extract/daemon/algenta-runtime-daemon start &
              for i in $(seq 1 90); do
                if ALGENTA_RUNTIME_DIR=/opt/extract/.runtime \
                   /opt/extract/daemon/algenta-runtime-daemon status | grep -q "Algenta Runtime running"; then
                  echo "HEALTH CHECK OK (clean ubuntu:22.04, glibc baseline)"
                  exit 0
                fi
                sleep 1
              done
              echo "daemon did not become healthy in a clean container"
              ALGENTA_RUNTIME_DIR=/opt/extract/.runtime /opt/extract/daemon/algenta-runtime-daemon status || true
              exit 1
            '

      - name: Stage per-platform artifacts
        run: |
          cp dist/runtime-bundle/bundle-metadata.json \
             "dist/runtime-bundle/bundle-metadata-linux-x64.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-bundle-linux-x64
          if-no-files-found: error
          path: |
            dist/runtime-bundle/algenta-runtime-*.tar.gz
            dist/runtime-bundle/bundle-metadata-linux-x64.json
            dist/runtime-bundle/bundle-signing-public.pem

  release:
    name: GitHub release (runtime-bundle-v* tags)
    needs: [build-linux]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'runtime-bundle-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-bundle-linux-x64
          path: artifacts

      - name: Create release with bundles + metadata + public key
        # The release is created through the REST API with curl so the job has zero toolchain
        # dependencies beyond curl + python3.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts/
          PY="$(command -v python3.14 || command -v python3)"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "authorization: Bearer ${GH_TOKEN}" -H "accept: application/vnd.github+json")
          VERSION="${GITHUB_REF_NAME#runtime-bundle-v}"
          RELEASE_JSON="$(mktemp)"
          curl -fsSL -X POST "${AUTH[@]}" \
            -H "content-type: application/json" \
            -d @- "${API}/releases" -o "$RELEASE_JSON" <<JSON
          {
            "tag_name": "${GITHUB_REF_NAME}",
            "name": "Algenta managed-runtime bundle ${VERSION}",
            "body": "Signed self-contained Algenta runtime bundles (frozen daemon + sharded Mojo workers). Verify with scripts/verify_runtime_bundle.py and bundle-signing-public.pem."
          }
          JSON
          UPLOAD_URL="$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1]))['upload_url'].split('{')[0])" "$RELEASE_JSON")"
          for asset in artifacts/algenta-runtime-*.tar.gz artifacts/bundle-metadata-*.json artifacts/bundle-signing-public.pem; do
            name="$(basename "$asset")"
            case "$name" in
              *.tar.gz) ctype="application/gzip" ;;
              *.json)   ctype="application/json" ;;
              *.pem)    ctype="application/x-pem-file" ;;
              *)        ctype="application/octet-stream" ;;
            esac
            curl -fsSL -X POST "${AUTH[@]}" \
              -H "content-type: ${ctype}" \
              --data-binary "@${asset}" \
              "${UPLOAD_URL}?name=${name}" > /dev/null
            echo "uploaded ${name}"
          done

      - name: Print contract footer fragment
        # The runtime_bundle footer for the SQAI capability contract, regenerated with the
        # REAL release URLs + hashes. Land it with:
        #   python3 scripts/generate_algenta_runtime_contract.py \
        #     --bundle-metadata .../bundle-metadata-linux-x64.json \
        #     --bundle-public-key .../bundle-signing-public.pem
        run: |
          PY="$(command -v python3.14 || command -v python3)"
          "$PY" scripts/generate_algenta_runtime_contract.py --check \
            --bundle-metadata artifacts/bundle-metadata-linux-x64.json \
            --bundle-public-key artifacts/bundle-signing-public.pem
