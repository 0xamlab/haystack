# Ships infra/ci/az_orchestrator.py to the ci-orch box that actually runs it.
#
# Why this exists: NOTHING deployed this file. It is the source of truth in git, but the running
# copy at /opt/ci/az_orchestrator.py was hand-copied, so the two drifted constantly. Verified
# 2026-08-26 -- deployed 51084 bytes (md5 3e67ebcc...) vs main 52505 bytes (md5 b656e8e0...),
# meaning three MERGED fixes (#904 pagination, #906 reconciliation sweeps, #908 stopped-VM reap)
# were not running. "Merged" silently did not mean "live" for this one file.
#
# WHY IT RUNS ON ci-orch AND NOT THE EPHEMERAL FLEET -- this is the whole trick. az_orchestrator
# is what provisions the az-ephemeral workers. A deploy job on `[self-hosted, az-ephemeral]` would
# need the orchestrator to be healthy in order to deploy the orchestrator, so it would queue
# forever in exactly the situation where deploying matters most (orchestrator down or wedged).
# ci-orch runs its own always-online REPO-level runner labelled `az-orch` -- the same runner
# az-ci-smoke.yml targets. That runner is independent of provisioning, and being ON the target box
# means the deploy is a local copy plus a systemctl restart: no SSH keys, no AZURE_CREDENTIALS, no
# network path to secure.
#
# Verified prerequisites on ci-orch (2026-08-26), so this is not aspirational:
#   * runner service user is `azureuser`, and /etc/sudoers.d grants `azureuser ALL=(ALL)
#     NOPASSWD:ALL` -- confirmed by actually running `sudo -u azureuser sudo -n true`.
#   * /opt/ci/az_orchestrator.py is root:root 0600, so the copy MUST go through sudo; `install`
#     reproduces that mode rather than leaving a 0644 world-readable file behind.
#   * the unit is `az-orchestrator.service`. It is NOT `ci-orch` -- an earlier `journalctl -u
#     ci-orch` guess returned nothing at all. Logs go to journald; there is no /var/log file.

name: deploy-az-orchestrator

on:
  push:
    branches: [main]
    paths:
      - "infra/ci/az_orchestrator.py"
      - ".github/workflows/deploy-az-orchestrator.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Never cancel a deploy in flight: a half-applied file plus a restart is worse than making the
# second run wait. Same reasoning as sync-public-sdk.yml, opposite of the PR-oriented workflows.
concurrency:
  group: deploy-az-orchestrator
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy orchestrator to ci-orch
    runs-on: [self-hosted, az-orch]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sanity-check the candidate before touching the running copy
        run: |
          set -euo pipefail
          # A syntax error here would restart the orchestrator into a crash loop and take ALL
          # provisioning down. Compile first, deploy second.
          python3 -m py_compile infra/ci/az_orchestrator.py
          echo "candidate compiles: $(wc -c < infra/ci/az_orchestrator.py) bytes, md5 $(md5sum infra/ci/az_orchestrator.py | cut -d' ' -f1)"
          echo "currently deployed:  $(sudo wc -c < /opt/ci/az_orchestrator.py) bytes, md5 $(sudo md5sum /opt/ci/az_orchestrator.py | cut -d' ' -f1)"

      - name: Install + restart, with rollback on a failed start
        run: |
          set -euo pipefail
          BACKUP=/opt/ci/az_orchestrator.py.prev
          sudo cp -p /opt/ci/az_orchestrator.py "$BACKUP"
          # install, not cp: reproduces root:root 0600 explicitly instead of inheriting whatever
          # the checkout's umask produced.
          sudo install -m 600 -o root -g root infra/ci/az_orchestrator.py /opt/ci/az_orchestrator.py
          sudo systemctl restart az-orchestrator

          # A unit can be "active" for a moment and then crash, so poll rather than checking once.
          ok=0
          for _ in $(seq 1 12); do
            sleep 5
            if sudo systemctl is-active --quiet az-orchestrator; then ok=$((ok+1)); else ok=0; fi
            [ "$ok" -ge 3 ] && break   # active across 3 consecutive samples (~15s)
          done
          if [ "$ok" -lt 3 ]; then
            echo "::error::az-orchestrator did not stay active after the restart - rolling back"
            sudo journalctl -u az-orchestrator --no-pager -n 40 || true
            sudo install -m 600 -o root -g root "$BACKUP" /opt/ci/az_orchestrator.py
            sudo systemctl restart az-orchestrator
            sleep 10
            sudo systemctl is-active --quiet az-orchestrator \
              && echo "::error::rolled back to the previous build, which is running" \
              || echo "::error::ROLLBACK ALSO FAILED - ci-orch needs manual attention"
            exit 1
          fi
          echo "::notice::az-orchestrator restarted and stable on the new build"

      - name: Prove the new build is doing real work, not just running
        run: |
          set -euo pipefail
          # "active" only means the process exists. The orchestrator's own log lines are the
          # evidence that its poll loop actually completed a pass against Azure and GitHub --
          # a process that starts and then throws on every cycle would still read as active.
          for _ in $(seq 1 10); do
            sleep 10
            if sudo journalctl -u az-orchestrator --no-pager --since "3 min ago" 2>/dev/null \
                 | grep -qiE "provisioned|warm pool|deleting|released stale|sweeping|pruned|no queued"; then
              echo "::notice::observed a completed reconcile cycle on the new build"
              sudo journalctl -u az-orchestrator --no-pager -n 12 || true
              exit 0
            fi
          done
          echo "::warning::no reconcile activity observed within 100s. The unit is active and this is not necessarily a fault (an idle fleet with nothing queued can be genuinely quiet), but it is unverified - check the journal before trusting this deploy."
          sudo journalctl -u az-orchestrator --no-pager -n 25 || true
