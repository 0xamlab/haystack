name: sdk-audit

# SDK real-world usability audit — fully automated on every update, no manual triggers.
#
# PR tier (fast): static gap checks — contract drift, silent visibility loss, surface
# leaks, test coverage, capability checklist, SDK parity, release-gate style.
#
# Main tier (heavy): compiles the module-routed shard workers, then executes EVERY
# published runtime-library function through the SDK path (smoke + hostile battery +
# state round-trips), re-runs the ratchet suite against the compiled workers, and proofs
# the published PyPI/npm artifacts install and execute.
#
# JIT evidence does not count (docs/mojo/new-kernel-package-rules.md rule 1b): the sweep
# only runs against compiled workers.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Per-ref group, matching ci.yml's grouping: a newer push to the same PR supersedes its stale
# run; main pushes queue. Every job runs on its own GitHub-hosted VM with its own Docker
# daemon, so execution-sweep's fixed postgres port cannot collide across jobs by construction
# and nothing needs to serialize org-wide.
concurrency:
  group: sdkaudit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gap-checks:
    name: SDK gap checks (static)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run gap checks
        run: python3 scripts/audit_gap_checks.py

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-audit-gap-checks
          path: |
            build/audit/gap_checks.json
            build/audit/gap_checks.md
          if-no-files-found: error

  execution-sweep:
    name: Full execution sweep (compiled workers)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `thyn-8c` (org larger runner, 8 cores / 32 GB, billed): this job compiles 27 filtered
    # Mojo shard workers in-job (28.5 min measured on 8 vCPU; 53 min with 5.8-7.2 GiB peaks on
    # 2-vCPU hosted with an older pin). main-push only.
    runs-on: thyn-8c

    # tests/conftest.py's autouse ensure_test_database_schema fixture runs the Alembic
    # migrations for EVERY pytest session under tests/ — including the ratchet suite —
    # so this job needs the same postgres the Test job gets (ci.yml). Without it the
    # ratchet step errors 4/4 with "connection refused" before the sweep can start.
    # A plain `docker run` (same shape as ci.yml's Postgres/Dragonfly/MinIO) on a fixed
    # host port: this job has its own VM and its own Docker daemon, so nothing else can
    # bind 15433 here.
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:15433/test_db
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:15433/test_db
      CI_WAIT_POSTGRES_URL: postgresql://postgres:postgres@localhost:15433/test_db

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start Postgres, wait for it
        run: |
          # GitHub-hosted images start dockerd at boot; this is a defensive fallback only.
          if ! docker info >/dev/null 2>&1; then
            (sudo -n systemctl enable --now docker || sudo -n service docker start) >/dev/null 2>&1 || true
            for _ in 1 2 3 4 5 6; do docker info >/dev/null 2>&1 && break; sleep 5; done
          fi
          docker rm -fv postgres-ci-sdkaudit >/dev/null 2>&1 || true
          # `docker run` on an uncached image implicitly pulls, which talks to Docker Hub's
          # auth endpoint before any layer transfer — a transient failure there (seen live as
          # a DNS blip: "dial tcp: lookup auth.docker.io ...: server misbehaving") aborts the
          # whole container start with nothing to retry on the daemon side. A failed
          # `docker run` here leaves no container (rm -fv above/below is therefore always
          # safe, not just cosmetic), so retrying the exact same command is safe and
          # sufficient — no separate `docker pull` step needed.
          pull_ok=0
          for attempt in 1 2 3 4 5; do
            if docker run -d --name postgres-ci-sdkaudit -p 15433:5432 \
              -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=test_db \
              postgres:16-alpine; then
              pull_ok=1
              break
            fi
            echo "docker run postgres:16-alpine failed (attempt $attempt/5) -- retrying after cleanup" >&2
            docker rm -fv postgres-ci-sdkaudit >/dev/null 2>&1 || true
            sleep $((attempt * 5))
          done
          [ "$pull_ok" = "1" ] || { echo "docker run postgres:16-alpine failed after 5 attempts" >&2; exit 1; }
          # Wait via pg_isready INSIDE the container: fresh managed microVMs have no
          # pixi/asyncpg yet (run_repo_python's python3 fallback lacks the module),
          # which made ci_wait_for_services.py report "not ready" on Blacksmith.
          ok=0
          for _ in $(seq 1 30); do
            docker exec postgres-ci-sdkaudit pg_isready -U postgres >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [ "$ok" = "1" ] || { echo "postgres not ready after 60s" >&2; exit 1; }

      # No swap-provisioning step: thyn-8c carries 32 GB, and the per-shard ceiling below only
      # needs headroom over the heaviest shard (1.2-1.8 GiB measured on Mojo 1.0.0; the runtime
      # library keeps growing, so the default carries slack).

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | env PIXI_HOME="$GITHUB_WORKSPACE/.pixi" PIXI_BIN_DIR="$GITHUB_WORKSPACE/.pixi/bin" PIXI_NO_PATH_UPDATE=1 bash
          echo "$GITHUB_WORKSPACE/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Mojo/Pixi environment
        run: |
          PIXI_HOME="$GITHUB_WORKSPACE/.pixi" RATTLER_CACHE_DIR="$GITHUB_WORKSPACE/.cache/rattler/cache" pixi install --manifest-path mojo_env/pixi.toml

      # Mojo shard builds link with the system clang. GitHub-hosted ubuntu images ship clang;
      # the probe installs whatever half of the pair is missing (passwordless sudo is present).
      - name: Ensure build toolchain (clang/lld)
        run: |
          command -v clang >/dev/null 2>&1 && command -v lld >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq clang lld build-essential

      - name: Build audit shard workers
        env:
          PIXI_HOME: ${{ github.workspace }}/.pixi
          RATTLER_CACHE_DIR: ${{ github.workspace }}/.cache/rattler/cache
        run: |
          set -euo pipefail
          max_rss="${AUDIT_SHARD_MAX_RSS_MB:-16000}"
          echo "per-shard footprint ceiling: ${max_rss} MiB"
          ./scripts/run_repo_python.sh scripts/build_runtime_shards.py \
            --out mojo_build/audit-worker \
            --shard-size 24 \
            --timeout-seconds 900 \
            --max-rss-mb "${max_rss}"

      - name: Ratchet suite against compiled workers
        env:
          PIXI_HOME: ${{ github.workspace }}/.pixi
          RATTLER_CACHE_DIR: ${{ github.workspace }}/.cache/rattler/cache
        run: ./scripts/run_repo_python.sh -m pytest -q tests/test_sdk_audit_ratchet.py

      - name: Full execution sweep (every published function)
        env:
          PIXI_HOME: ${{ github.workspace }}/.pixi
          RATTLER_CACHE_DIR: ${{ github.workspace }}/.cache/rattler/cache
        # Ratchet mode: fails only on NEW worker-killing functions vs the baseline; the
        # known backlog (scripts/sdk_audit_baseline.json, sweep_p0_baseline) only shrinks.
        run: ./scripts/run_repo_python.sh scripts/audit_library_execution_sweep.py --battery all --p0-baseline scripts/sdk_audit_baseline.json

      - name: Upload sweep artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-audit-execution-sweep
          path: |
            build/audit/library_sweep_results.json
            build/audit/library_sweep_results.md
          if-no-files-found: error

  published-artifact-proof:
    name: Published artifact install + execute proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The published wheels require >=3.14; the hosted image's system python is 3.12 and 3.14
      # is only put on PATH by setup-python (tool-cache hit, seconds -- no PPA, no apt).
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install published SDK from PyPI
        run: |
          python -m venv /tmp/algenta-audit-venv
          /tmp/algenta-audit-venv/bin/pip install --upgrade pip
          /tmp/algenta-audit-venv/bin/pip install algenta

      - name: Doctor invariants (launch gates 8/9/13)
        run: |
          out=$(/tmp/algenta-audit-venv/bin/algenta runtime doctor || true)
          echo "$out"
          echo "$out" | grep -q "fallback:        denied"
          echo "$out" | grep -q "tcp listeners:   none"
          echo "$out" | grep -qi "status:          READY"
          forbidden=("install Mo""jo" "install Mod""ular" "start daemon" "docker run")
          for bad in "${forbidden[@]}"; do
            if echo "$out" | grep -qi "$bad"; then echo "::error::doctor leaked forbidden runtime setup text"; exit 1; fi
          done

      - name: Execute one function per shard through the installed runtime
        run: |
          /tmp/algenta-audit-venv/bin/python - <<'PY'
          import algenta
          from algenta.native import worker

          runtime = algenta.MojoRuntime(mode="local")
          health = runtime.health()
          assert health.get("status") == "ok", health
          modules = runtime.list_modules()
          print(f"published runtime serves {len(modules)} modules")
          routes = {}
          for module_name in worker.runtime_module_filter() or ():
              resolution = worker.require_worker(module_name=module_name, require_verified=True)
              routes.setdefault(resolution.path.name, module_name)
          assert len(routes) >= 2, f"expected multiple shard workers, saw {sorted(routes)}"
          for worker_name, module_name in sorted(routes.items()):
              result = runtime.execute(module_name, runtime.list_functions(module_name)[0], None)
              print(worker_name, module_name, "ok" if result.get("success") else result.get("error_code"))
              assert result.get("success") or result.get("error_code") in {
                  "invalid_arguments", "count_exceeds_list_length"
              }, result
          print("published artifact proof: all shards executed")
          PY

      # setup-node: a deterministic Node major with a real npm on PATH, independent of what the
      # runner image happens to ship. This job runs only on push-to-main, so a Node/npm gap
      # would never be caught on a PR.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: npm artifact install + import proof
        run: |
          mkdir -p /tmp/algenta-audit-npm
          cd /tmp/algenta-audit-npm
          npm init -y >/dev/null
          npm install algenta-sdk
          node -e "const sdk = require('algenta-sdk'); for (const name of ['AlgentaClient','DecisionEngineClient','Runtime','MojoRuntime','libraries','CONTRACT_VERSION']) { if (!(name in sdk)) { throw new Error('missing export: ' + name); } } console.log('npm artifact proof: CJS exports present');"
          node --input-type=module -e "import { MojoRuntime, libraries, CONTRACT_VERSION } from 'algenta-sdk'; if (!MojoRuntime || !libraries || !CONTRACT_VERSION) throw new Error('missing ESM named exports'); console.log('npm artifact proof: ESM named imports present');"
