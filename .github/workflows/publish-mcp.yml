# Publish the Algenta MCP server to the Official MCP Registry (registry.modelcontextprotocol.io).
#
# The registry is metadata-only — it points at the PyPI package `algenta-mcp` (published separately by
# release-sdks.yml). Ownership of the `io.github.thyn-ai/*` namespace is proven by GitHub Actions OIDC
# (no stored secrets) and by the `<!-- mcp-name: io.github.thyn-ai/algenta -->` marker in the PyPI README
# (packages/mcp/README.md → the package's long_description on PyPI).
#
# Run AFTER the matching `algenta-mcp` version is live on PyPI: publish is gated to a manual dispatch (or a
# GitHub Release) so it never races the package upload. Keep server.json's version in sync with the
# published PyPI version before dispatching. Mirrors telys' publish-mcp.yml.
name: publish-mcp

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the OIDC token mcp-publisher exchanges for a registry JWT (namespace auth)

jobs:
  publish-mcp:
    name: publish to the Official MCP Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        # Runner-agnostic: pick the release asset for THIS runner's OS/arch (linux amd64 on
        # ubuntu-latest) and install under RUNNER_TEMP -- no sudo.
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported arch $ARCH"; exit 1 ;;
          esac
          BIN_DIR="$RUNNER_TEMP/mcp-publisher-bin"
          mkdir -p "$BIN_DIR"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          install -m 755 mcp-publisher "$BIN_DIR/mcp-publisher"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/mcp-publisher" --help >/dev/null

      - name: Authenticate (GitHub Actions OIDC → registry JWT)
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: mcp-publisher publish

      - name: Confirm it resolves
        run: |
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.thyn-ai/algenta" \
            | head -c 800 || echo "::warning::registry search did not return yet (may lag); check manually."
