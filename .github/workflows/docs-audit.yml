name: docs-audit

# Shares the one-machine self-hosted runner fleet with thyn-ai/codna, so cap it: a superseded
# run on the same ref is moot, and two heavy runs starve each other (a codna parity sidecar
# missed its 30s port-bind deadline purely from contention on 2026-08-19).
concurrency:
  group: docs-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Enforces the shared GitBook interaction contract repo-side (GitBook itself allows no custom
# CSS/HTML/JS, so quality is gated here). See GITBOOK.md for the rules and scripts/gitbook/audit.py.
# Algenta layout: docs pages live in gitbook/ (the GitBook Git Sync root); the golden-template
# tooling lives in scripts/gitbook/ (outside the sync root).
on:
  pull_request:
    branches: [main]
    paths:
      - "gitbook/**"
      - "scripts/gitbook/**"
      - "scripts/docs/**"
      - "apps/mcp_server/**"
      - "apps/api_server/**"
      - "apps/api-server/config.py"
      - "engines/manifest.py"
      - "schemas/openapi/openapi.yaml"
      - ".gitbook.yaml"
      - ".github/workflows/docs-audit.yml"
  push:
    branches: [main]
    paths:
      - "gitbook/**"
      - "scripts/gitbook/**"
      - "scripts/docs/**"
      - "apps/mcp_server/**"
      - "apps/api_server/**"
      - "apps/api-server/config.py"
      - "engines/manifest.py"
      - "schemas/openapi/openapi.yaml"
      - ".gitbook.yaml"
      - ".github/workflows/docs-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: docs interaction-contract audit
    # Compute: algenta Azure CI plane -- one ephemeral self-hosted VM per job (provisioned by infra/ci); was ubuntu-latest.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No actions/setup-python (needs passwordless sudo on macOS, not configured here) —
      # python3.14 is a Homebrew-installed binary already on this runner's PATH.
      - name: Run docs interaction-contract audit
        run: python3.14 scripts/gitbook/audit.py gitbook/

      - name: Run GitBook A-Z source audit
        run: >-
          python3.14 scripts/docs/audit_gitbook_claims.py
          --source gitbook
          --skip-live
          --execute-safe-commands
          --strict
          --json-report build/docs-audit/gitbook-a-z-source.json
