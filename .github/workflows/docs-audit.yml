name: docs-audit

# Enforces the shared GitBook interaction contract repo-side (GitBook itself allows no custom
# CSS/HTML/JS, so quality is gated here). See GITBOOK.md for the rules and scripts/gitbook/audit.py.
# Algenta layout: docs pages live in gitbook/ (the GitBook Git Sync root); the golden-template
# tooling lives in scripts/gitbook/ (outside the sync root).
on:
  pull_request:
    branches: [main]
    paths:
      - "gitbook/**"
      - "scripts/gitbook/**"
      - "scripts/docs/**"
      - "apps/mcp_server/**"
      - "apps/api_server/**"
      - "apps/api-server/config.py"
      - "engines/manifest.py"
      - "schemas/openapi/openapi.yaml"
      - ".gitbook.yaml"
      - ".github/workflows/docs-audit.yml"
  push:
    branches: [main]
    paths:
      - "gitbook/**"
      - "scripts/gitbook/**"
      - "scripts/docs/**"
      - "apps/mcp_server/**"
      - "apps/api_server/**"
      - "apps/api-server/config.py"
      - "engines/manifest.py"
      - "schemas/openapi/openapi.yaml"
      - ".gitbook.yaml"
      - ".github/workflows/docs-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: docs interaction-contract audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"

      - name: Run docs interaction-contract audit
        run: python3 scripts/gitbook/audit.py gitbook/

      - name: Run GitBook A-Z source audit
        run: >-
          python3 scripts/docs/audit_gitbook_claims.py
          --source gitbook
          --skip-live
          --strict
          --json-report build/docs-audit/gitbook-a-z-source.json
