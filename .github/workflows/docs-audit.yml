name: docs-audit

# A superseded run on the same ref is moot; cancelling it saves hosted-runner minutes.
concurrency:
  group: docs-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Enforces the shared GitBook interaction contract repo-side (GitBook itself allows no custom
# CSS/HTML/JS, so quality is gated here). See GITBOOK.md for the rules and scripts/gitbook/audit.py.
# Algenta layout: docs pages live in gitbook/ (the GitBook Git Sync root); the golden-template
# tooling lives in scripts/gitbook/ (outside the sync root).
on:
  pull_request:
    branches: [main]
    paths:
      - "gitbook/**"
      - "scripts/gitbook/**"
      - "scripts/docs/**"
      - "apps/mcp_server/**"
      - "apps/api_server/**"
      - "apps/api-server/config.py"
      - "engines/manifest.py"
      - "schemas/openapi/openapi.yaml"
      - ".gitbook.yaml"
      - ".github/workflows/docs-audit.yml"
  push:
    branches: [main]
    paths:
      - "gitbook/**"
      - "scripts/gitbook/**"
      - "scripts/docs/**"
      - "apps/mcp_server/**"
      - "apps/api_server/**"
      - "apps/api-server/config.py"
      - "engines/manifest.py"
      - "schemas/openapi/openapi.yaml"
      - ".gitbook.yaml"
      - ".github/workflows/docs-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: docs interaction-contract audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both audit scripts are stdlib-only, but they run on the same 3.14 the repo pins
      # (mojo_env/pixi.toml). setup-python puts the tool-cache 3.14 (and its `python3.14`
      # binary) on PATH -- no PPA, no apt, no pip.
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run docs interaction-contract audit
        run: python3.14 scripts/gitbook/audit.py gitbook/

      - name: Run GitBook A-Z source audit
        run: >-
          python3.14 scripts/docs/audit_gitbook_claims.py
          --source gitbook
          --skip-live
          --execute-safe-commands
          --strict
          --json-report build/docs-audit/gitbook-a-z-source.json
