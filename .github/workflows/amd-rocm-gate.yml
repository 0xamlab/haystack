name: amd-rocm-gate

# DISABLED BY DESIGN — manual-only (workflow_dispatch), deliberately NOT on push/pull_request,
# deliberately NOT in any job's `needs`. The AMD lane is COMPILE-GATED exactly like the CUDA
# lane (build-runtime.yml's build-linux-cuda): the portable GPU kernel layer cross-compiles
# for AMD CDNA targets with NO ROCm toolkit and NO AMD GPU (the AMDGPU LLVM backend ships
# inside the pinned mojo toolchain — `mojo build --print-supported-accelerators` lists the
# ROCm/HIP table: gfx90a/gfx942/mi300x/gfx950/mi355x/...), but LAUNCHING the result needs
# real MI300X/MI355X hardware with ROCm >= 6.3.3 (MI355X: ROCm 7). No CI runner has any.
#
# The gate was compile-verified on the macOS build host with the pinned Mojo 1.0.0 /
# MAX 26.5.0 toolchain (gfx942 + gfx950, embedded HSACO + `global_load_dwordx4` vector-load
# evidence recorded in benchmarks/llm_smoke/REALRACE_RESULTS.md, "THE AMD ROCM COMPILE GATE").
# This workflow exists so the compile stays re-provable from CI the day launch hardware
# appears; until then it runs only on explicit request and nothing depends on it.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  amd-rocm-compile-gate:
    name: AMD ROCm compile gate (portable GPU kernels, gfx942 + gfx950 + gfx90a)
    # `thyn-8c` (billed) because this is a real `mojo build` x3; the linux peak RSS has never
    # been measured (workflow_dispatch-only, ~$0.30/run). Downgrade to ubuntu-latest after one
    # measured run if the peak stays well under 8 GB.
    runs-on: thyn-8c
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compile the portable kernel layer for AMD CDNA targets (amd64 container)
        run: |
          docker pull --platform linux/amd64 ubuntu:22.04
          # Same container pattern as build-linux / build-linux-cuda. The gate compiles ONE
          # driver (every portable kernel family), not the shard set, so the budget is far
          # below the runtime builds'.
          docker run --rm --platform linux/amd64 \
            --user root \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ubuntu:22.04 bash .github/scripts/amd_rocm_compile_gate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: algenta-amd-rocm-compile-gate
          path: mojo_build/amd-gate/*
