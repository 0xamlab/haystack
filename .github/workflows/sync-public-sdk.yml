# Mirrors packages/python-sdk + packages/ts-sdk + packages/mcp out to the public,
# forkable thyn-ai/algenta-sdk repo as a reviewable pull request — never a direct push.
#
# This workflow itself is CODEOWNED (see CODEOWNERS) — changes to the sync
# mechanism require the same review rigor as changes to what it exports.
#
# Credentials: a dedicated GitHub App ("algenta-sdk-sync") installed on exactly
# thyn-ai/algenta and thyn-ai/algenta-sdk, scoped to only the `contents` and
# `pull_requests` permissions on those two repos. Its App ID / private key live in
# the ALGENTA_SDK_SYNC_APP_ID / ALGENTA_SDK_SYNC_APP_PRIVATE_KEY secrets (in place
# since 2026-08-16; the workflow runs green on every main push that touches the
# SDK packages). Do not substitute a long-lived personal access token here even
# as a stopgap — that's exactly the pattern this design avoids.

name: sync-public-sdk

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "packages/python-sdk/**"
      - "packages/ts-sdk/**"
      - "packages/mcp/**"

permissions:
  contents: read

# Serialize: this job PUSHES to the public thyn-ai/algenta-sdk mirror, so two runs racing (two
# main pushes landing close together, or a dispatch overlapping a push) can interleave commits on
# the mirror. cancel-in-progress is deliberately FALSE, unlike the PR-oriented workflows here: a
# sync killed midway can leave the mirror half-updated, which is strictly worse than making the
# second run wait. Queue it, never cancel it.
concurrency:
  group: sync-public-sdk
  cancel-in-progress: false

jobs:
  sync:
    # Everything below is platform-independent: one pip dependency, rsync, gitleaks, git, gh
    # (all on the ubuntu-latest image or installed under RUNNER_TEMP). ~30 s per run; the
    # timeout exists because cancel-in-progress is false above, so a hung run would otherwise
    # block every later sync for the 360-minute default.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # 3.14 explicitly (the hosted image's system python is 3.12; 3.14 is in its tool cache).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the contract generator's one dependency
        # apps.platform_contract (imported by the generator below) needs only pydantic --
        # confirmed by reading its actual import list, not guessed. Before #724 no step
        # installed it and every run died here with ModuleNotFoundError.
        run: python -m pip install --quiet --disable-pip-version-check pydantic

      - name: Regenerate contract snapshots (internal generator never leaves this job)
        run: |
          python scripts/generate_platform_contract_artifacts.py

      - name: Mint a short-lived installation token for the sync App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALGENTA_SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.ALGENTA_SDK_SYNC_APP_PRIVATE_KEY }}
          owner: thyn-ai
          repositories: algenta-sdk

      - name: Check out the public SDK repo alongside this one
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: thyn-ai/algenta-sdk
          path: algenta-sdk-public
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Mirror the public packages (python-sdk, ts-sdk, mcp), preserving the packages/ prefix
        run: |
          set -euo pipefail
          mkdir -p algenta-sdk-public/packages
          for pkg in python-sdk ts-sdk mcp; do
            mkdir -p "algenta-sdk-public/packages/$pkg"
            # Explicit allowlist copy, not a blind rsync of the whole tree — anything not
            # matched here simply doesn't cross the boundary. --delete propagates real deletions
            # from this repo, but packages/python-sdk/tests/ is excluded: it's a smoke-test suite
            # that only exists in the public repo (this repo's python-sdk test coverage lives
            # elsewhere, see release-sdks.yml's guard job) — a blind mirror would silently delete
            # it every single run. Tested against a real clone and confirmed the hard way.
            # The same exclude keeps engine-side test trees (packages/mcp/tests/) out of the
            # source-only public mirror.
            rsync -a --delete --exclude 'build/' --exclude '*.egg-info' --exclude 'node_modules/' \
              --exclude 'dist/' --exclude '.git' --exclude 'tests/' \
              "packages/$pkg/" "algenta-sdk-public/packages/$pkg/"
            # Reject symlinks in what actually got copied — NOT in the source tree, which
            # legitimately contains pnpm's internal node_modules symlinks (excluded above,
            # never present in the output). Checking the source directly here would make this
            # step fail on every normal `pnpm install`, tested and confirmed the hard way.
            find "algenta-sdk-public/packages/$pkg" -type l -print -quit | grep -q . && {
              echo "::error::Refusing to sync — symlink found in the mirrored output for $pkg" >&2
              exit 1
            }
          done
          # examples/ is also part of the public surface (linked from both package READMEs) and
          # lives outside packages/ in this repo — mirror it the same way.
          rm -rf algenta-sdk-public/examples
          mkdir -p algenta-sdk-public/examples
          rsync -a --exclude '__pycache__' --exclude '*.pyc' examples/ algenta-sdk-public/examples/

      - name: Set up thyn-sec
        uses: thyn-ai/security-toolchain@6045a94a409bca3d9321c9369a31e0d42b15efcd # v0.1.7
        with:
          prefetch: "false"

      - name: Outbound secret + forbidden-path scan (blocks the PR, not just warns)
        env:
          THYN_SEC_QUIET: "1"
        run: |
          set -euo pipefail
          # thyn-sec fetches and sha256-verifies gitleaks itself (security/toolchain.lock is the
          # one version source for laptop + CI + this mirror gate) and scans the working tree as
          # plain files -- not the mirrored repo's own commit history (a fresh checkout of
          # algenta-sdk's *existing* history, already scanned when it was written; re-scanning it
          # here would just be slow, not safer). This also finally honors a `.gitleaksignore` (or
          # `.gitleaks.toml`) committed at the export root, which the previous bare `gitleaks
          # detect` invocation never read despite the promise in this comment's earlier revision.
          # Zero unresolved findings required — a real false positive (embedded public keys, test
          # fixtures, hashes) needs an explicit .gitleaksignore entry committed alongside the fix
          # that introduces it, never a silently-loosened scan step.
          thyn-sec gitleaks-dir --root algenta-sdk-public
          # Reject submodules and anything outside the fixed export allowlist regardless of
          # what the scanner finds.
          find algenta-sdk-public/packages -name ".gitmodules" -print -quit | grep -q . && {
            echo "::error::Refusing to sync — a submodule was found in the export" >&2
            exit 1
          }
          true

      - name: Open (or update) the sync PR
        working-directory: algenta-sdk-public
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "algenta-sdk-sync[bot]"
          git config user.email "algenta-sdk-sync[bot]@users.noreply.github.com"
          BRANCH="sync/${{ github.sha }}"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync — clean no-op."
            exit 0
          fi
          git commit -m "sync: mirror packages/python-sdk + packages/ts-sdk + packages/mcp from thyn-ai/algenta@${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create \
            --repo thyn-ai/algenta-sdk \
            --base main \
            --head "$BRANCH" \
            --title "sync: mirror from thyn-ai/algenta@${{ github.sha }}" \
            --body "Automated mirror of packages/python-sdk, packages/ts-sdk, and packages/mcp from thyn-ai/algenta at ${{ github.sha }}. A human CODEOWNER must review and merge — this PR does not merge itself."
