name: "CodeQL"

# Advanced setup (replaces GitHub default setup) so we can scope analysis with
# .github/codeql/codeql-config.yml (paths-ignore). Default setup analyzed the entire
# tree (tests + generated benchmark libs + examples) and "Analyze (python)" ran >90 min.
# Produces the same check names — Analyze (python) / (javascript-typescript) / (actions) —
# that the branch ruleset requires. Default setup MUST be disabled for this to run.
#
# Runs on the org's GitHub-hosted larger runner `thyn` (8-core/32 GB) instead of the standard
# 2-core/7 GB `ubuntu-latest`: a workflow only lands on a larger runner when its `runs-on:`
# matches the runner's name/label, so `ubuntu-latest` never picks it up.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: thyn
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript", "actions"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          category: "/language:${{ matrix.language }}"
