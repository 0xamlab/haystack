name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Friday at 05:15 UTC.
    - cron: "15 5 * * 5"
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same branch/PR.
# Saves runner minutes and avoids stale results lingering on the security tab.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # CodeQL needs to upload SARIF results to the Security tab.
  security-events: write
  # Required for private repos so the runner can read repo + workflows.
  contents: read
  actions: read
  # Required to fetch internal/private CodeQL query packs.
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality = broader coverage than the default security
          # suite (also catches code-quality issues). Drop to security-extended
          # if false-positive volume gets too high.
          queries: security-and-quality
          config: |
            paths-ignore:
              # Auto-generated Python (92K+ lines — slows analysis, no real signal)
              - benchmarks/python_libs/runtime_library_dispatch_generated.py
              # Build artifacts (mirror of source — duplicate alerts)
              - "**/build/lib/**"
              - "**/dist/**"
              # Local caches / runtime state
              - .cache/**
              - .pixi/**
              - .pnpm-store/**
              - .algenta-runtime/**
              - .docker-selfhost/**
              # Vendored Python venvs
              - mcp_venv/**
              - .venv/**
              # Mojo source files (CodeQL doesn't analyze Mojo)
              - mojo/**

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # `category` disambiguates results when multiple analyses run
          # against the same commit (e.g. PR vs scheduled scan).
          category: "/language:${{ matrix.language }}"
          # Upload SARIF even on partial failure so partial findings reach
          # the Security tab.
          upload: always
