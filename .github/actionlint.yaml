# actionlint config: custom `runs-on` labels this repo uses, so the runner-label check can tell
# a real typo from an org runner. actionlint only knows GitHub's own label set by default.
self-hosted-runner:
  labels:
    # thyn-ai org larger runner (8 cores / 32 GB / 300 GB, billed): Mojo-compile jobs only
    # (build-runtime, build-runtime-bundle, build-mojo, amd-rocm-gate, sdk-audit
    # execution-sweep, and the ci.yml `test` job's dispatch-only baseline sweep).
    - thyn-8c
    # `az-ephemeral` and `az-orch` were listed here until the decommission wave. Removed rather
    # than commented out, deliberately: an allowlist entry for a label no runner carries turns a
    # genuine `runs-on:` typo into a silent pass, which is the opposite of what this file is for.
    # The two workflows that used them (az-ci-smoke.yml, deploy-az-orchestrator.yml) were deleted
    # in the same commit, and the orchestrator VM they targeted no longer exists.
