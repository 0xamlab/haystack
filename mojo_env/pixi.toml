[workspace]
authors = ["Angel Marinov <angel@eplane.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo_env"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12,<3.13"
mojo = ">=0.26.3.0.dev2026032005,<0.27"

[pypi-dependencies]
# Keep the repository test and verification lane inside the repo-local
# Mojo/Pixi environment instead of falling back to host-installed Python tools.
alembic = "==1.13.1"
anyio = { version = ">=4.5.0", extras = ["trio"] }
asyncpg = "==0.29.0"
fastapi = "==0.110.0"
greenlet = "==3.0.3"
httpx = "==0.27.0"
pandas = "==2.2.2"
pydantic = { version = "==2.6.4", extras = ["email"] }
pydantic-settings = "==2.2.1"
pyarrow = "==17.0.0"
psycopg2-binary = "==2.9.10"
pytest = "==8.1.1"
pytest-asyncio = "==0.23.5"
pytest-cov = "==5.0.0"
python-multipart = "==0.0.20"
redis = "==5.0.3"
ruff = "==0.12.0"
sqlalchemy = { version = "==2.0.28", extras = ["asyncio"] }
starlette = "==0.36.3"
structlog = "==24.1.0"
openpyxl = "==3.1.5"
boto3 = "==1.34.122"
google-cloud-storage = "==2.17.0"
azure-storage-blob = "==12.20.0"
clickhouse-connect = "==1.0.0"
neo4j = "==5.28.4"
snowflake-connector-python = ">=3.9.0"
uvicorn = { version = "==0.27.1", extras = ["standard"] }
openapi-spec-validator = "==0.9.0"
celery = { version = "==5.4.0", extras = ["redis"] }
bcrypt = "==4.1.2"
pyjwt = ">=2.12.0,<3.0.0"
prometheus-client = "==0.21.0"
anthropic = "==0.94.1"
huggingface-hub = "==0.33.0"
grpcio = "==1.76.0"
protobuf = "==6.33.4"
types-redis = "==4.6.0.20240425"
