[workspace]
authors = ["angelatgithub <79715912+angelatgithub@users.noreply.github.com>"]
# max-nightly was retired upstream (its repodata is now empty), so the pin below moved to
# the stable max channel, which is also what mojolang.org/install documents.
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "mojo_env"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14,<3.15"
mojo = "==1.0.0b2"

[pypi-dependencies]
# Keep the repository test and verification lane inside the repo-local
# Mojo/Pixi environment instead of falling back to host-installed Python tools.
alembic = "==1.18.5"
anyio = { version = ">=4.5.0", extras = ["trio"] }
asyncpg = "==0.31.0"
fastapi = "==0.133.1"
greenlet = "==3.5.3"
httpx = "==0.28.1"
pandas = "==2.3.3"
pydantic = { version = "==2.12.0", extras = ["email"] }
pydantic-settings = "==2.7.1"
pyarrow = "==23.0.1"
psycopg2-binary = "==2.9.11"
pytest = "==9.0.3"
pytest-asyncio = "==1.4.0"
pytest-cov = "==7.1.0"
python-multipart = "==0.0.31"
redis = "==5.0.3"
ruff = "==0.12.0"
sqlalchemy = { version = "==2.0.51", extras = ["asyncio"] }
starlette = "==1.3.1"
mcp = "==1.28.1"
structlog = "==24.1.0"
openpyxl = "==3.1.5"
boto3 = "==1.34.122"
google-cloud-storage = "==2.17.0"
azure-storage-blob = "==12.20.0"
clickhouse-connect = "==1.0.0"
neo4j = "==5.28.4"
snowflake-connector-python = ">=3.9.0"
uvicorn = { version = "==0.51.0", extras = ["standard"] }
openapi-spec-validator = "==0.9.0"
celery = { version = "==5.4.0", extras = ["redis"] }
bcrypt = "==4.1.2"
pyjwt = ">=2.13.0,<3.0.0"
keyring = ">=25,<26"
prometheus-client = "==0.21.0"
anthropic = "==0.94.1"
huggingface-hub = "==0.33.0"
grpcio = "==1.76.0"
protobuf = "==6.33.5"
types-redis = "==4.6.0.20240425"
oracledb = "==4.0.1"
