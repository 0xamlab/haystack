        min_join_confidence:
          type: number
          title: Min Join Confidence
          description: "Reject join paths below this confidence threshold. Default\
            \ 0.85 \u2014 only statistically solid joins are accepted. Lower to 0.50\
            \ to allow weaker joins at your own risk."
          default: 0.85
        mode:
          type: string
          title: Mode
          description: "strict \u2014 reject invalid plans with no suggestions (enterprise\
            \ enforcement). assist \u2014 reject invalid plans AND return corrective\
            \ suggestions (default, LLM-friendly)."
          default: assist
        resolved_plan:
          anyOf:
          - $ref: '#/components/schemas/ResolvedPlan-Input'
          - type: 'null'
          description: Exact plan returned by POST /v1/resolve.
      type: object
      title: VerifyRequest
      description: 'LLM-produced execution plan. All names are EXACT (from schema
        endpoint).

        Mojo checks: source exists, columns exist, aggregation is valid for the

        column role, and join keys have sufficient confidence.'
    VerifyResponse:
      properties:
        valid:
          type: boolean
          title: Valid
        errors:
          items:
            type: string
          type: array
          title: Errors
        suggestions:
          items:
            type: string
          type: array
          title: Suggestions
        resolved:
          additionalProperties:
            type: string
          type: object
          title: Resolved
        valid_dimensions:
          items:
            type: string
          type: array
          title: Valid Dimensions
          default: []
        valid_measures:
          items:
            type: string
          type: array
          title: Valid Measures
          default: []
        source_behavior:
          type: string
          title: Source Behavior
          default: ''
        latency_ms:
          type: number
          title: Latency Ms
        verified:
          type: boolean
          title: Verified
          default: false
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        schema_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Revision
        plan_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan Hash
        verification_mode:
          type: string
          title: Verification Mode
          default: assist
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
      type: object
      required:
      - valid
      - errors
      - suggestions
      - resolved
      - latency_ms
      title: VerifyResponse
    VersionResponse:
      properties:
        api_version:
          type: string
          title: Api Version
        engine_version:
          type: string
          title: Engine Version
        environment:
          type: string
          title: Environment
      type: object
      required:
      - api_version
      - engine_version
      - environment
      title: VersionResponse
    WebhookTestRequest:
      properties:
        callback_url:
          type: string
          title: Callback Url
          description: URL to send test webhook to
      type: object
      required:
      - callback_url
      title: WebhookTestRequest
    WebhookTestResponse:
      properties:
        success:
          type: boolean
          title: Success
        status_code:
          type: integer
          title: Status Code
        message:
          type: string
          title: Message
      type: object
      required:
      - success
      - status_code
      - message
      title: WebhookTestResponse
    WhatIfRequest:
      properties:
        request:
          oneOf:
          - $ref: '#/components/schemas/SimulateRequestAuto'
          - $ref: '#/components/schemas/SimulateRequestExpert'
          title: Request
          description: Base simulation request
          discriminator:
            propertyName: mode
            mapping:
              auto: '#/components/schemas/SimulateRequestAuto'
              expert: '#/components/schemas/SimulateRequestExpert'
        variable:
          type: string
          title: Variable
          description: Variable name to sweep
        param:
          type: string
          title: Param
          description: 'Which parameter to vary: mean, std, low, high, mode, value'
          default: mean
        range_pct:
          type: number
          title: Range Pct
          description: "Sweep range as fraction of base value (e.g. 0.30 = \xB130%)"
          default: 0.3
        n_steps:
          type: integer
          maximum: 51.0
          minimum: 3.0
          title: N Steps
          description: Number of steps (odd number recommended for symmetric sweep)
          default: 11
        runs_per_step:
          type: integer
          maximum: 100000.0
          minimum: 100.0
          title: Runs Per Step
          description: Monte Carlo runs per step. Lower for faster response.
          default: 5000
      type: object
      required:
      - request
      - variable
      title: WhatIfRequest
      description: Inline what-if request (no stored run needed).
    WhatIfResponse:
      properties:
        variable:
          type: string
          title: Variable
        n_steps:
          type: integer
          title: N Steps
        range_low:
          type: number
          title: Range Low
        range_high:
          type: number
          title: Range High
        param_changed:
          type: string
          title: Param Changed
        steps:
          items:
