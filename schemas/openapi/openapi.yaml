          title: Value
          description: Fixed value (for type='fixed')
          default: 0.0
        mean:
          type: number
          title: Mean
          description: Mean (for type='normal' or 'lognormal')
          default: 0.0
        std:
          type: number
          title: Std
          description: Std dev (for type='normal' or 'lognormal')
          default: 0.0
        low:
          type: number
          title: Low
          description: Lower bound (for type='uniform')
          default: 0.0
        high:
          type: number
          title: High
          description: Upper bound (for type='uniform')
          default: 0.0
      type: object
      title: StochasticParam
      description: 'A simulation parameter that is itself stochastic (drawn fresh
        for each path).

        Use for uncertain drift, volatility, or any time-series parameter.'
