      description: "Called by `<product> login` with a Supabase access_token. The\
        \ product comes from the URL path (validated against the product registry\
        \ \u2014 an unknown product 404s), never a request body. Verifies the token,\
        \ resolves-or-creates the caller's org on that product's free tier (so the\
        \ device license carries `products.<product>`), and returns a freshly minted\
        \ API key. Idempotent per email at the org level; never downgrades a paid\
        \ plan."
