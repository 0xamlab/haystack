        p25:
          type: number
          title: P25
        p50:
          type: number
          title: P50
        p75:
          type: number
          title: P75
        p95:
          type: number
          title: P95
        probability_of_loss:
          type: number
          title: Probability Of Loss
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
      type: object
      required:
      - step
      - value
      - label
      - mean
      - std
      - p5
      - p25
      - p50
      - p75
      - p95
      - probability_of_loss
      title: WhatIfStep
      description: A single point in the what-if sweep.
