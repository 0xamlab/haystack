      summary: Validate a structured query plan before execution
      description: '**LLM calls this after reading /v1/sources/schema.**


        Submit the exact source + column names chosen by the LLM. The engine verifies:

        - Source exists in registry

        - metric_column exists and is numeric

        - aggregation is valid for the column''s role

        - group_column exists (if given)

        - join path exists with sufficient confidence (if join_source_name given)


        Returns `valid: true` + resolved names on success, or `valid: false` + errors
        + suggestions on failure. **Call /v1/execute (or /v1/query with exact-spec)
        only after verify returns valid.**'
