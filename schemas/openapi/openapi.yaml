            verification is scoped to that one registered dataset.
        metric_column:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Column
          description: Exact column name to aggregate
        aggregation:
          anyOf:
          - type: string
          - type: 'null'
          title: Aggregation
          description: sum | avg | count | max | min
        group_column:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Column
          description: Exact column name for group-by
        join_source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Join Source Name
          description: Second source name for join
        join_columns:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Join Columns
