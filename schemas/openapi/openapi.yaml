            from base_source.
        edges:
          items:
            $ref: '#/components/schemas/JoinEdgeSpec'
          type: array
          title: Edges
          description: Ordered join edges from base_source toward the dimension source.
        max_hops:
          type: integer
          maximum: 6.0
          minimum: 1.0
          title: Max Hops
          description: Maximum allowed join hops for this request. Defaults to 4;
            explicit opt-in can raise this to 6 hops (7 tables).
          default: 4
        min_path_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Path Confidence
          description: Minimum acceptable composed confidence across the full join
            path.
          default: 0.0
        reject_on_ambiguity:
          type: boolean
          title: Reject On Ambiguity
          description: Reject if more than one viable path exists with insufficient
            score separation.
          default: true
        reject_on_fanout:
          type: boolean
          title: Reject On Fanout
          description: Reject if estimated path fanout exceeds safe execution thresholds.
          default: true
      additionalProperties: false
      type: object
      required:
