    DataSource:
      properties:
        name:
          type: string
          title: Name
          description: Label for this source (e.g., 'sales', 'orders')
        dataset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Id
          description: Public dataset ID alias for a registered source.
        source_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Id
          description: Registered source ID; fastest path and avoids re-uploading
            data.
        records:
          anyOf:
          - items:
              type: object
            type: array
          - type: 'null'
          title: Records
          description: Inline JSON records
        csv:
          anyOf:
          - type: string
          - type: 'null'
          title: Csv
          description: Raw CSV text
        json_str:
          anyOf:
          - type: string
          - type: 'null'
          title: Json Str
          description: Raw JSON array/object text (nested auto-flattened)
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: "HTTP URL \u2014 format auto-detected"
        excel_b64:
          anyOf:
          - type: string
          - type: 'null'
          title: Excel B64
          description: Excel .xlsx file, base64-encoded
        parquet_b64:
          anyOf:
          - type: string
          - type: 'null'
          title: Parquet B64
          description: Parquet file, base64-encoded
        connection:
          anyOf:
          - type: object
          - type: 'null'
          title: Connection
          description: "Connector config dict \u2014 see DataSource docstring for\
            \ all types"
        table:
          anyOf:
          - type: string
          - type: 'null'
          title: Table
          description: "Legacy field \u2014 use connection instead"
      type: object
      required:
      - name
      title: DataSource
      description: "A data source to map. Every format normalizes to list[dict] internally.\n\
        \nInline (no external dependency):\n  `records`    \u2014 JSON array of objects\
        \ (fastest)\n  `csv`        \u2014 raw CSV text\n  `json_str`   \u2014 raw\
        \ JSON array/object text (nested JSON is auto-flattened)\n  `url`        \u2014\
        \ HTTP(S) URL; format auto-detected from Content-Type / extension\n\nBinary\
        \ files (base64-encoded for API transport):\n  `excel_b64`  \u2014 Excel .xlsx\
        \ file, base64-encoded\n  `parquet_b64`\u2014 Parquet file, base64-encoded\n\
        \nConnector config (routes through ConnectorRegistry):\n  `connection` \u2014\
        \ dict with `type` + connector-specific keys:\n    {\"type\": \"sql\",   \
        \     \"connection_string\": \"postgresql+asyncpg://...\",\n     \"query\"\
        : \"SELECT ...\"}\n    {\"type\": \"sql\",        \"connection_string\": \"\
        sqlite+aiosqlite:///db.sqlite\", \"query\": \"...\"}\n    {\"type\": \"rest_api\"\
        ,   \"url\": \"https://...\", \"data_path\": \"data.items\"}\n    {\"type\"\
        : \"s3\",         \"bucket\": \"my-bucket\", \"key\": \"data/sales.parquet\"\
        }\n    {\"type\": \"gcs\",        \"bucket\": \"my-bucket\", \"blob\": \"\
        data/orders.csv\"}\n    {\"type\": \"azure_blob\", \"connection_string\":\
        \ \"DefaultEndpointsProtocol=...\",\n                           \"container\"\
        : \"data\", \"blob\": \"sales.parquet\"}"
