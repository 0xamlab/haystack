openapi: 3.1.0
info:
  title: Algenta API
  description: Hosted and self-hosted Algenta API for governed data discovery, exact
    queries, read-only SQL reports, and simulation workflows.
  version: 1.0.0
paths:
  /v1/health:
    get:
      tags:
      - System
      summary: Health check
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/version:
    get:
      tags:
      - System
      summary: API and engine version
      operationId: version_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /v1/meta/contract:
    get:
      tags:
      - System
      summary: Machine-readable Algenta contract
      operationId: contract_v1_meta_contract_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformContractResponse'
  /v1/simulate:
    post:
      tags:
      - Simulation
      summary: Run a simulation
      description: 'Execute a Monte Carlo simulation and receive a structured decision
        envelope. Use `mode: ''auto''` for minimal setup or `mode: ''expert''` for
        full control.


        **Performance**: p50 < 15ms server-side (Mojo worker pool, async persistence).


        **Quota**: Each successful call consumes 1 simulation from your monthly quota.
        Returns HTTP 429 when quota or rate limit is exceeded.'
      operationId: simulate_v1_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SimulateRequestAuto'
              - $ref: '#/components/schemas/SimulateRequestExpert'
              title: Payload
              discriminator:
                propertyName: mode
                mapping:
                  auto: '#/components/schemas/SimulateRequestAuto'
                  expert: '#/components/schemas/SimulateRequestExpert'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/recommend:
    post:
      tags:
      - Decision
      summary: Compare actions and get a recommendation
      description: "Run simulations for 2\u201310 named actions and return them ranked\
        \ by expected value. The top-ranked action is returned as `recommended_action`."
      operationId: recommend_v1_recommend_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/score:
    post:
      tags:
      - Decision
      summary: Score a simulation with custom weights
      operationId: score_v1_score_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/batch:
    post:
      tags:
      - Decision
      summary: Run multiple simulations in one request
      description: "Submit 1\u2013100 simulation requests. Partial failures are allowed;\
        \ failed items include an error message."
      operationId: batch_v1_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/compare:
    post:
      tags:
      - Decision
      summary: Side-by-side scenario comparison
      description: "Run and compare 2\u201310 named scenarios. Returns full results\
        \ with deltas versus the winning scenario."
      operationId: compare_v1_compare_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/simulate/what-if:
    post:
      tags:
      - What-If Analysis
      summary: What-if parametric sweep
      description: Vary one variable parameter across a range and see how outcomes
        change. All steps run in parallel via Mojo worker pool. Returns a sweep with
        mean, percentiles, and probability of loss at each step. Automatically computes
        sensitivity direction and elasticity.
      operationId: what_if_inline_v1_simulate_what_if_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatIfRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatIfResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /auth/signup:
    post:
      tags:
      - Auth
      summary: Create a new account
      description: "Self-serve signup. Creates an organization, user account, and\
        \ first API key in one step. The raw API key is shown **once** in the response\
        \ \u2014 store it securely."
      operationId: signup_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login and get a session token
      description: 'Returns a JWT bearer token valid for 7 days. Use as `Authorization:
        Bearer <token>`.'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/verify:
    get:
      tags:
      - Auth
      summary: Verify email address via token link
      description: Verify a user's email address. Token sent on signup.
      operationId: verify_email_auth_verify_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          description: Verification token from email
          title: Token
        description: Verification token from email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Verify Email Auth Verify Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Request a password reset email
      description: Send a password reset link to the user's email.
      operationId: forgot_password_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Forgot Password Auth Forgot Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Complete password reset with token
      description: Reset a user's password using a valid reset token.
      operationId: reset_password_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Reset Password Auth Reset Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me:
    get:
      tags:
      - Account
      summary: Get current user and org info
      operationId: me_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      security:
      - BearerAuth: []
    patch:
      tags:
      - Account
      summary: Update current user and/or org name
      operationId: update_me_v1_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/usage:
    get:
      tags:
      - Account
      summary: Get usage summary for current billing period
      operationId: usage_v1_usage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
      security:
      - BearerAuth: []
  /v1/limits:
    get:
      tags:
      - Account
      summary: Get rate limits and quotas for current plan
      operationId: limits_v1_limits_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsResponse'
      security:
      - BearerAuth: []
  /v1/distributions:
    get:
      tags:
      - Account
      summary: List supported distribution types
      operationId: distributions_v1_distributions_get
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/DistributionInfo'
                - $ref: '#/components/schemas/DistributionListResponse'
                title: Response Distributions V1 Distributions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/templates:
    get:
      tags:
      - Account
      summary: List built-in simulation templates
      operationId: templates_v1_templates_get
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/TemplateInfo'
                - $ref: '#/components/schemas/TemplateListResponse'
                title: Response Templates V1 Templates Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/api-keys:
    get:
      tags:
      - Account
      summary: List active API keys
      operationId: list_api_keys_v1_api_keys_get
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/APIKeyInfo'
                - $ref: '#/components/schemas/APIKeyListResponse'
                title: Response List Api Keys V1 Api Keys Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Account
      summary: Create a new API key
      operationId: create_api_key_v1_api_keys_post
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/api-keys/{key_id}:
    delete:
      tags:
      - Account
      summary: Revoke an API key
      operationId: revoke_api_key_v1_api_keys__key_id__delete
      security:
      - BearerAuth: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/list:
    get:
      tags:
      - Async Jobs
      summary: List async jobs for this org
      description: Paginated list of all jobs for the authenticated org.
      operationId: list_jobs_v1_jobs_list_get
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response List Jobs V1 Jobs List Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs:
    post:
      tags:
      - Async Jobs
      summary: Submit an async simulation job
      description: Submit a large simulation to run asynchronously. Returns a job_id
        immediately. Poll /v1/jobs/{job_id} for status. Provide a callback_url to
        receive a webhook when complete.
      operationId: submit_job_v1_jobs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/jobs/{job_id}:
    get:
      tags:
      - Async Jobs
      summary: Poll job status
      operationId: get_job_status_v1_jobs__job_id__get
      security:
      - BearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/result:
    get:
      tags:
      - Async Jobs
      summary: Fetch job result
      description: Returns the full result if completed, or 202 with status if still
        processing.
      operationId: get_job_result_endpoint_v1_jobs__job_id__result_get
      security:
      - BearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Job Result Endpoint V1 Jobs  Job Id  Result Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/cancel:
    post:
      tags:
      - Async Jobs
      summary: Cancel a job
      operationId: cancel_job_endpoint_v1_jobs__job_id__cancel_post
      security:
      - BearerAuth: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/webhooks/test:
    post:
      tags:
      - Async Jobs
      summary: Test webhook delivery
      description: Send a test webhook payload to a URL and return the delivery result.
      operationId: test_webhook_v1_webhooks_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /v1/billing/checkout:
    post:
      tags:
      - Billing
      summary: Create Stripe Checkout session
      operationId: checkout_v1_billing_checkout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Checkout V1 Billing Checkout Post
      security:
      - BearerAuth: []
  /v1/billing/portal:
    post:
      tags:
      - Billing
      summary: Create Stripe Billing Portal session
      operationId: portal_v1_billing_portal_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Portal V1 Billing Portal Post
      security:
      - BearerAuth: []
  /v1/billing/info:
    get:
      tags:
      - Billing
      summary: Get current billing info
      operationId: billing_info_v1_billing_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Billing Info V1 Billing Info Get
      security:
      - BearerAuth: []
  /v1/runs:
    get:
      tags:
      - Runs
      summary: List simulation runs for this org
      description: Return paginated simulation run history for the authenticated org.
      operationId: list_runs_v1_runs_get
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Offset
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: mode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/{run_id}:
    get:
      tags:
      - Runs
      summary: Get a single simulation run
      description: Return details for a single simulation run (org-scoped).
      operationId: get_run_v1_runs__run_id__get
      security:
      - BearerAuth: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/analytics:
    get:
      tags:
      - Runs
      summary: Aggregated analytics for dashboard charts
      description: "Return aggregated analytics using real SQL GROUP BY \u2014 O(1)\
        \ in DB, not O(n) in Python."
      operationId: get_analytics_v1_analytics_get
      security:
      - BearerAuth: []
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/infrastructure:
    get:
      tags:
      - Infrastructure
      summary: Real compute infrastructure health
      description: Return real engine health status and compute node information.
      operationId: get_infrastructure_v1_infrastructure_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfrastructureResponse'
      security:
      - BearerAuth: []
  /v1/nodes/register:
    post:
      tags:
      - Infrastructure
