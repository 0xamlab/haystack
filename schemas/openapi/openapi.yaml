  /v1/resolve:
    post:
      tags:
      - Semantic Query
      summary: Resolve structured intent into an exact executable plan
      description: '**Bounded deterministic planner.**


        This endpoint resolves structured intent into an exact plan for `POST /v1/query`.

        It only uses registered-source metadata, join graph metadata, planner cache,
        and precomputed statistics. It does not scan datasets or execute queries.


        **Scope rules:**

        - Provide `dataset_id` for dataset-scoped planning, or

        - set `allow_org_scope=true` to plan across all visible datasets.


        **Deterministic guarantees:**

        - identical intent_signature + schema_revision + scope => identical output

        - ambiguity clarifies or rejects; it never expands search

        - no fallback to slower planning paths exists'
      operationId: resolve_sources_v1_resolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/query:
    post:
      tags:
      - Semantic Query
      summary: "Execute a structured query \u2014 schema-free, zero domain assumptions"
      description: "**Structured query execution engine.**\n\nThis endpoint takes\
        \ structured intent \u2014 produced by an LLM from the user's natural-language\
        \ question. It does NOT accept raw text.\n\n**Separation of concerns:**\n\
        - LLM: language \u2192 structured intent, ambiguity resolution, user interaction\n\
        - Algenta: schema understanding, math relationships, fast execution, correctness\n\
        \n**Role resolution:**\n1. Detect derived formulas across all numeric column\
        \ triples (Mojo, ~100ms)\n2. Assign structural roles: derived_measure, base_measure,\
        \ unit_measure\u2026\n3. Match requested role \u2192 best column\n4. Execute\
        \ aggregation, return result + all candidates for LLM disambiguation\n\n**Ambiguity\
        \ handling:**\nIf confidence < 0.7, check `candidates` \u2014 multiple columns\
        \ may match the role. The LLM can present options to the user or pick the\
        \ most contextually appropriate one."
      operationId: query_sources_v1_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/sources/schema:
    post:
      tags:
      - Semantic Query
      - Semantic Query
      summary: Infer and return the structural schema of data sources
      description: "**Call this once when a user connects a data source.**\n\nReturns\
        \ the full Algenta structural schema: column roles, detected formulas, cardinality,\
        \ and `query_hints` the LLM should use when calling `POST /v1/query`.\n\n\
        The schema is also embedded as Arrow metadata in the returned Parquet bytes\
        \ (`parquet_b64`), which the LLM agent can store and reuse \u2014 no re-profiling\
        \ on subsequent queries.\n\n**Flow:**\n1. User connects data source\n2. Call\
        \ `POST /v1/sources/schema` \u2014 ~1-2s, runs once\n3. LLM reads `schema`\
        \ JSON and `query_hints`\n4. User asks questions \u2192 LLM produces structured\
        \ intent \u2192 `POST /v1/query` (~200ms, cached)"
      operationId: infer_schema_v1_sources_schema_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Infer Schema V1 Sources Schema Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
