    TimeSeriesConfig:
      properties:
        model:
          type: string
          title: Model
          description: 'Path model: gbm | ou | arithmetic | compound | custom'
          default: gbm
        initial_value:
          type: number
          title: Initial Value
          description: Starting value of the process (e.g. current stock price, balance,
            etc.)
        horizons:
          items:
            type: integer
          type: array
          maxItems: 100
          minItems: 1
          title: Horizons
          description: Time steps at which to record distributions. E.g. [1,3,6,12]
            for 1/3/6/12 months.
          default:
          - 1
          - 3
          - 6
          - 12
        granularity:
          type: string
          title: Granularity
          description: 'Time unit per step. One of: ms, s, min, h, day, week, month,
            quarter, year. All drift/vol parameters assumed annualized unless granularity=''custom''.'
          default: month
        drift:
          anyOf:
          - $ref: '#/components/schemas/StochasticParam'
          - type: number
          title: Drift
          description: 'Annualized drift / expected return. Float shorthand or StochasticParam
            for uncertain drift. GBM: annual log-return. OU: not used (use long_run_mean).
            Compound: annual return.'
          default: 0.0
        volatility:
          anyOf:
          - $ref: '#/components/schemas/StochasticParam'
          - type: number
          title: Volatility
          description: "Annualized volatility (\u03C3). Float or StochasticParam."
          default: 0.2
        autocorrelation:
          type: number
          maximum: 0.99
          minimum: -0.99
          title: Autocorrelation
          description: AR(1) autocorrelation coefficient for innovations (0 = i.i.d.,
            >0 = trending, <0 = mean-reverting noise)
          default: 0.0
        long_run_mean:
          anyOf:
          - type: number
          - type: 'null'
          title: Long Run Mean
          description: "OU model: long-run mean (\u03BC\u221E). Defaults to initial_value."
        mean_reversion_speed:
          type: number
          minimum: 0.0
          title: Mean Reversion Speed
          description: "OU model: speed of mean reversion (\u03B8). Higher = faster\
            \ pull to mean."
          default: 0.5
        path_expression:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Path Expression
          description: 'Custom model: Python expression for next step value. Variables:
            value, t, dt, drift, vol, z, initial. Example: ''value * exp((drift -
            0.5*vol**2)*dt + vol*dt**0.5*z)'''
        fan_chart_percentiles:
          items:
            type: integer
          type: array
          maxItems: 20
          minItems: 1
          title: Fan Chart Percentiles
          description: Percentile levels to include in the fan chart output at each
            horizon.
          default:
          - 5
          - 10
          - 25
          - 50
          - 75
          - 90
          - 95
        output_paths:
          type: boolean
          title: Output Paths
          description: Include sample path data in response (for fan chart visualization).
            Adds ~50 paths.
          default: false
        n_sample_paths:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: N Sample Paths
          description: Number of sample paths to include when output_paths=True.
          default: 50
      type: object
      required:
      - initial_value
      title: TimeSeriesConfig
      description: "Config for engine_type='time_series' \u2014 multi-horizon stochastic\
        \ path simulation.\n\nSupported models:\n  gbm        \u2014 Geometric Brownian\
        \ Motion\n  ou         \u2014 Ornstein-Uhlenbeck mean-reversion\n  arithmetic\
        \ \u2014 Arithmetic Brownian Motion\n  compound   \u2014 Compound return\n\
        \  custom     \u2014 Expression-driven path\n\nGranularities: ms, s, min,\
        \ h, day, week, month, quarter, year"
    TokenResponse:
