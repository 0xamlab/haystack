          title: Completion Tokens
        total_tokens:
          type: integer
          title: Total Tokens
      type: object
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
      title: ChatCompletionUsage
    ChatCompletionsRequest:
      properties:
        model:
          type: string
          title: Model
          description: Chat-capable utility model identifier from GET /v1/models.
          default: text.tokenizer
        messages:
          items:
            $ref: '#/components/schemas/ChatCompletionInputMessage'
          type: array
          minItems: 1
          title: Messages
          description: Ordered chat transcript processed by the selected utility model.
        stream:
          type: boolean
          title: Stream
          description: When true, return Server-Sent Events with deterministic completion
            chunks.
          default: false
        max_tokens:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Tokens
          description: Maximum tokens to generate. Applies to algenta_local backend
            models (default 256) and forwarded providers that accept an output budget;
            ignored otherwise.
        temperature:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Temperature
          description: 'Sampling temperature. Applies to algenta_local backend models:
            0 or omitted is greedy (argmax), > 0 draws from the model distribution.
            Remote providers use their server-side defaults.'
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Top P
          description: Nucleus sampling threshold for algenta_local backend models.
            Remote providers use their server-side defaults.
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: 'Sampling seed for algenta_local backend models: same prompt
            + parameters + seed reproduce the identical completion. Remote providers
            use their server-side defaults.'
      type: object
      required:
      - messages
      title: ChatCompletionsRequest
    ChatCompletionsResponse:
      properties:
        id:
          type: string
          title: Id
        object:
          type: string
          const: chat.completion
          title: Object
          default: chat.completion
        model:
          type: string
          title: Model
        provider_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Backend
          description: Concrete provider backend that served this chat completion
            when routed.
        provider_model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Model Id
          description: Concrete configured provider model that served this chat completion
            when routed.
        provider_attempts:
          items:
            $ref: '#/components/schemas/ProviderAttemptResponse'
          type: array
          title: Provider Attempts
          description: Ordered provider attempts made while serving this chat completion.
        choices:
          items:
