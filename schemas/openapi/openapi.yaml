  /v1/calibration:
    get:
      tags:
      - Calibration
      summary: Get confidence calibration status
      description: "Returns the org's historical prediction accuracy metrics computed\
        \ from all recorded outcomes (`PATCH /v1/decisions/{id}/outcome`). The `confidence_multiplier`\
        \ is applied automatically to every simulation and recommendation once `n_samples\
        \ >= 5`.\n\n**Key fields**\n- `bias`: mean relative error \u2014 negative\
        \ means over-optimistic\n- `hit_rate`: fraction of predictions within \xB1\
        20% of actual\n- `confidence_multiplier`: factor currently applied to raw\
        \ simulation confidence\n- `is_reliable`: false until 5+ outcomes are recorded"
      operationId: get_calibration_status_v1_calibration_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationResponse'
      security:
      - BearerAuth: []
  /v1/execution/policy:
    get:
      tags:
      - Execution Policy
      summary: Get execution policy
      description: "Returns the org's current autonomous execution safety policy.\
        \ Gates applied to every POST /v1/decisions/{id}/execute call and trigger\
        \ auto_execute:\n\n- **min_confidence**: decisions below this confidence are\
        \ blocked\n- **risk_floor**: decisions where worst-case (p5) exceeds this\
        \ loss are blocked\n- **require_calibration**: auto_execute waits for \u2265\
        5 recorded outcomes\n- **allow_reexecution**: idempotency \u2014 prevents\
        \ double-actions\n\nAll gates can be bypassed individually: `force=true` (idempotency)\
        \ or `override_safety=true` (confidence + risk_floor)."
      operationId: get_execution_policy_v1_execution_policy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPolicyResponse'
      security:
      - BearerAuth: []
    patch:
      tags:
      - Execution Policy
      summary: Update execution policy
      description: "Partial update \u2014 only supplied fields are changed. Changes\
        \ take effect immediately for all subsequent executions. Audit logs record\
        \ every update."
      operationId: update_execution_policy_v1_execution_policy_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPolicyResponse'
        '422':
