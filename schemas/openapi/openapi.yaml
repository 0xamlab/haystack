  /billing/plans:
    get:
      tags:
      - Billing
      summary: "Public \u2014 active plans for an app, dynamic from Stripe"
      description: "Plan titles/prices/descriptions/features straight from Stripe\
        \ (no hardcoding). Public \u2014\npricing is public (a pricing page renders\
        \ before sign-in). Free + Enterprise (no Stripe price)\nare added by the frontend\
        \ as bookends.\n\nA BRANDED host prices exactly one brand: its own, resolved\
        \ from an authoritative signal\n(`ALGENTA_PRODUCT`, else the request's own\
        \ `Host` via the registry's `public_api_base`). A\nrequest for a DIFFERENT\
        \ brand on a branded host is refused rather than served: cross-brand\npricing\
        \ stays possible only on the shared engine's own non-brand host, which is\
        \ where a\nmulti-brand portal belongs. `?app=<own brand>` remains valid so\
        \ existing callers keep working.\n\nAn unregistered `app` is rejected rather\
        \ than answered with an empty plan list under a 200, which\nread as \"this\
        \ brand has no paid tiers\" instead of \"no such brand\" \u2014 and, because\
        \ the brand string\nwas passed straight into the Stripe catalogue cache, an\
        \ unbounded number of distinct values each\nbought a permanent cache entry\
        \ and a live Stripe call from an unauthenticated endpoint."
      operationId: public_plans_billing_plans_get
      parameters:
      - name: app
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: App
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Public Plans Billing Plans Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
