      properties:
        role:
          type: string
          title: Role
          description: 'Structural role. One of: base_measure, category, component,
            derived_measure, identifier, metric, ratio, text, time, unit_measure.
            derived_measure = computed aggregate (revenue, total value). base_measure
            = count/quantity. unit_measure = price/rate. ratio = percentage/margin.
            metric = best numeric column.'
          default: derived_measure
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
          description: "Optional weak signal \u2014 a word from the user's question.\
            \ Used only as a tiebreaker when multiple columns share the same role.\
            \ Never the primary signal. Examples: 'revenue', 'quantity', 'price'."
      type: object
      title: MetricSpec
      description: "Structural role target. The LLM selects based on what the user\
        \ wants.\n\nUse 'derived_measure' for revenue, spend, total value \u2014 the\
        \ computed aggregate.\nUse 'base_measure' for counts, quantities, discrete\
        \ amounts.\nUse 'unit_measure' for prices, rates, per-unit values.\nUse 'ratio'\
        \ for percentages, margins, fill rates.\nUse 'metric' to let the engine pick\
        \ the best numeric column."
