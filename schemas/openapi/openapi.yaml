          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Correlation identifier propagated from the API request.
        scenario_analysis:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Scenario Analysis
          description: 'Populated for simulation_model=''scenario'': expected_value,
            best_case, scenarios list'
        sensitivity_analysis:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Sensitivity Analysis
          description: 'Populated for simulation_model=''sensitivity'': tornado_chart,
            first_order_sobol, variable_importance'
        bootstrap_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Bootstrap Result
          description: 'Populated for simulation_model=''bootstrap'': statistic, observed_value,
            CI, bias, SE'
        mcmc_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Mcmc Result
          description: 'Populated for simulation_model=''mcmc'': posterior summaries,
            R-hat, acceptance_rate'
        importance_sampling_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Importance Sampling Result
          description: 'Populated for simulation_model=''importance_sampling''. Contains:
            tail_direction, target_threshold, tail_probability, tail_probability_se,
            cvar_tail, weighted_mean, weighted_std, theta (tilt parameter), tilt_variable,
            effective_sample_size, nominal_sample_size, variance_reduction_factor,
            naive_tail_count.'
        scenario_ranking:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Scenario Ranking
        sensitivity_ranking:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Sensitivity Ranking
        score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Score
        score_breakdown:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Score Breakdown
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        decision_tree_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Decision Tree Result
          description: 'Populated for simulation_model=''decision_tree'': n_paths,
            expected_value, paths[]'
        time_series_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Time Series Result
          description: 'Populated for simulation_model=''time_series''. Contains:
            model, granularity, dt_years, initial_value, n_steps, fan_chart (per-horizon
            p5/p25/p50/p75/p95), terminal distribution, max_drawdown_pct, and optional
            sample_paths for visualization.'
        formatted_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Formatted Result
          description: 'Human-readable formatted output values with units. Populated
            when output_unit_specs or unit_spec is provided. Contains: mean_formatted,
            p5_formatted, p95_formatted, unit, unit_type, etc.'
        unit_context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Unit Context
          description: Unit metadata for all variables and outputs. Contains per-variable
            unit type, code, precision, and display scale. Use this to reconstruct
            formatted values client-side.
        unit_warnings:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Unit Warnings
          description: "Non-fatal unit validation warnings (e.g. negative currency,\
            \ out-of-range probability). Simulation still ran \u2014 these are advisory\
            \ only."
        charts:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Charts
          description: 'Pre-computed Vega-Lite compatible chart specs for instant
            rendering. Populated when include_charts=true in the request or automatically
            for sensitivity/time_series engine types. Keys: ''histogram'', ''cdf'',
            ''tornado'', ''fan_chart'', ''scatter''. Each value is a complete Vega-Lite
            spec that can be passed to vega-embed.'
        histogram_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Histogram Data
          description: Pre-computed histogram bins (50 bins) for the primary output
            distribution.
        decision_plan:
          anyOf:
          - $ref: '#/components/schemas/DecisionPlan'
          - type: 'null'
          description: 'Structured decision summary. Always populated by /v1/simulate
            and /v1/recommend. Contains: recommended_action, confidence, expected_value,
            risk (p5/p95/PoL), all ranked options, rationale, and integrity hashes.'
        request_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Hash
          description: 'SHA-256 fingerprint of the INPUT payload (variables, distributions,
            objective function, seed). Cryptographic proof of what data was used to
            make this decision. Computed at submission time before simulation runs.
            Format: hex string, 64 chars.'
        result_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Hash
          description: 'SHA-256 fingerprint of this decision OUTPUT (64-char hex).
            Covers: run_id, request_hash (input binding), recommended_action, confidence,
            rationale, metrics, percentiles, scenarios_run, engine_version, simulation_model.
            Binds the decision to both its inputs AND outputs. Use to verify the decision
            has not been tampered with. Also returned as X-Decision-Hash response
            header.'
      type: object
      required:
      - run_id
      - engine_version
      - recommended_action
      - confidence
      - rationale
      - metrics
      - percentiles
      - scenarios_run
      - execution_ms
      - metadata
      title: DecisionEnvelope
      description: Full decision output returned by /v1/simulate, /v1/recommend, and
        /v1/score.
