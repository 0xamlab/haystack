    ExpertSimulation:
      properties:
        variables:
          items:
            $ref: '#/components/schemas/VariableSpec'
          type: array
          minItems: 1
          title: Variables
        correlations:
          items:
            $ref: '#/components/schemas/CorrelationSpec'
          type: array
          title: Correlations
        objective_function:
          anyOf:
          - type: string
          - type: 'null'
          title: Objective Function
          description: 'Expression evaluated each scenario. Supports all math functions.
            Multi-output: separate with | pipe character. Example: ''revenue - cost
            | (revenue - cost) / revenue * 100 | min(cash_flow, 0)'''
        scoring:
          $ref: '#/components/schemas/ScoringWeights'
        domain:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Domain
          description: 'Industry/domain hint: finance, medical, manufacturing, aerospace,
            defense, etc.'
        domain_template:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Domain Template
          description: Name of predefined domain template used (for reference)
        output_labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Output Labels
          description: Labels for multi-output objectives (matches | separator count)
        output_units:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Output Units
          description: Physical/currency units for each output. E.g. ['USD', '%',
            'years']
        output_unit_specs:
          anyOf:
          - items:
              $ref: '#/components/schemas/UnitSpec'
            type: array
          - type: 'null'
          title: Output Unit Specs
          description: 'Full UnitSpec per output objective (matches | separator count).
            Enables formatted_result in the response with currency symbols, compact
            notation ($1.2M), scientific notation (1.23e-9 Pa), etc. Example: [{''type'':''currency'',''code'':''USD'',''format'':''compact''},
            {''type'':''percentage''}]'
      type: object
      required:
      - variables
      title: ExpertSimulation
      description: "Universal simulation specification. No restrictions on domain,\
        \ variable count,\nor expression complexity. Works for any industry and data\
        \ type.\n\nobjective_function \u2014 complete function reference:\n  Arithmetic:\
        \   +, -, *, /, ^ (power), % (mod)\n  Standard:     sqrt(x), exp(x), ln(x),\
        \ log(x), log10(x), log2(x), log1p(x),\n                expm1(x), abs(x),\
        \ floor(x), ceil(x), round(x)\n  Min/Max:      min(a,b), max(a,b), clip(v,lo,hi)\n\
        \  Conditional:  if(cond>0, then_val, else_val)\n  Trigonometry: sin(x), cos(x),\
        \ tan(x), asin(x), acos(x), atan(x)\n                atan2(y,x), sinh(x),\
        \ cosh(x), tanh(x)\n  Special:      erf(x), erfc(x), gamma(x), lgamma(x),\
        \ sign(x), hypot(a,b)\n  Statistical:  norm_cdf(x), norm_pdf(x), norm_ppf(p),\n\
        \                t_cdf(x, df), chi2_cdf(x, df), logistic(x), logit(x)\n  Combinatorics:\
        \ factorial(n), comb(n,k), perm(n,k)\n  Sequences:    fibonacci(n), fib(n),\
        \ fib_ratio(n) = F(n)/F(n-1)\n  Financial:    npv(rate,cf0,cf1,...), pmt(rate,n,pv),\
        \ fv(rate,n,pmt,pv),\n                pv(rate,n,pmt), annuity(rate,n), duration(rate,n)\n\
        \  Constants:    c (speed of light), G (gravity), g (9.81 m/s\xB2),\n    \
        \            kB (Boltzmann), NA (Avogadro), R (gas), pi, e, phi\n  Multi-output:\
        \ separate objectives with | e.g. \"net_profit | risk_score | irr\"\n  Variables:\
        \    any variable name from the variables list as a symbol\n\nExamples:\n\
        \  \"revenue - cost\"\n  \"max(0, sales * margin - fixed_cost)\"\n  \"npv(0.1,\
        \ -capex, cf1, cf2, cf3, cf4, cf5)\"\n  \"norm_cdf((mu - threshold) / sigma)\"\
        \n  \"mass * g * height\"            # kinetic/potential energy\n  \"fibonacci(growth_stage)\"\
        \      # Fibonacci growth model\n  \"revenue - cost | revenue / cost | norm_cdf(revenue\
        \ - target)\"  # multi-output"
