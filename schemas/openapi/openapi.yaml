          $ref: '#/components/schemas/AutoScenario'
        runs:
          type: integer
          maximum: 100000.0
          minimum: 100.0
          title: Runs
          default: 10000
        seed:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Seed
        simulation_model:
          allOf:
          - $ref: '#/components/schemas/SimulationModel'
          description: Simulation algorithm. All run natively in Mojo.
          default: monte_carlo
        bootstrap_config:
          anyOf:
          - $ref: '#/components/schemas/BootstrapConfig'
          - type: 'null'
        scenario_config:
          anyOf:
          - $ref: '#/components/schemas/ScenarioConfig'
          - type: 'null'
        sensitivity_config:
          anyOf:
          - $ref: '#/components/schemas/SensitivityConfig'
          - type: 'null'
      type: object
      required:
      - mode
      - scenario
      title: SimulateRequestAuto
      description: "Auto-mode simulation request \u2014 minimal setup, engine infers\
        \ distributions."
      example:
        mode: auto
        runs: 10000
        scenario:
          name: Product launch decision
          objective: maximize_net_value
          variables:
            cost:
              high: 90000
              low: 40000
            revenue:
              high: 200000
              low: 80000
        simulation_model: monte_carlo
    SimulateRequestExpert:
      properties:
        mode:
          const: expert
          title: Mode
        simulation:
          $ref: '#/components/schemas/ExpertSimulation'
        runs:
          type: integer
          maximum: 1000000.0
          minimum: 100.0
          title: Runs
          default: 10000
        seed:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Seed
        simulation_model:
          allOf:
          - $ref: '#/components/schemas/SimulationModel'
          description: Simulation algorithm. All run natively in Mojo.
          default: monte_carlo
        bootstrap_config:
          anyOf:
          - $ref: '#/components/schemas/BootstrapConfig'
          - type: 'null'
        scenario_config:
          anyOf:
          - $ref: '#/components/schemas/ScenarioConfig'
          - type: 'null'
        mcmc_config:
          anyOf:
          - $ref: '#/components/schemas/MCMCConfig'
          - type: 'null'
        sensitivity_config:
          anyOf:
          - $ref: '#/components/schemas/SensitivityConfig'
          - type: 'null'
        importance_sampling_config:
          anyOf:
          - $ref: '#/components/schemas/ImportanceSamplingConfig'
          - type: 'null'
          description: "Config for engine_type='importance_sampling' \u2014 exponential\
            \ tilting for rare tail events. Required when simulation_model='importance_sampling'.\
            \ Provides unbiased tail probability and CVaR estimates with 100\u2013\
            10,000\xD7 fewer samples than brute-force MC."
        decision_tree_config:
          anyOf:
          - $ref: '#/components/schemas/DecisionTreeConfig'
          - type: 'null'
          description: "Config for engine_type='decision_tree' \u2014 multi-layered\
            \ branching decisions."
        time_series_config:
          anyOf:
          - $ref: '#/components/schemas/TimeSeriesConfig'
          - type: 'null'
          description: "Config for engine_type='time_series' \u2014 multi-horizon\
            \ stochastic path simulation. Models: GBM (stocks/crypto), OU (rates/spreads),\
            \ arithmetic, compound, custom. Granularities: ms, s, min, h, day, week,\
            \ month, quarter, year."
        include_charts:
          type: boolean
          title: Include Charts
          description: Include pre-computed Vega-Lite chart specs in the response.
            When true, adds 'charts' dict with histogram, CDF, tornado (if sensitivity),
            fan_chart (if time_series). Ready to pass to vega-embed for instant rendering.
            Adds ~5ms to response time.
          default: false
        include_histogram:
          type: boolean
          title: Include Histogram
          description: Include pre-computed 50-bin histogram data (lighter than full
            chart spec). Adds 'histogram_data' to response. Useful for quick distribution
            preview.
          default: false
      type: object
      required:
      - mode
      - simulation
      title: SimulateRequestExpert
      description: "Expert-mode simulation request \u2014 full distribution and objective\
        \ control."
      example:
        mode: expert
        runs: 50000
        seed: 42
        simulation:
          objective_function: revenue - cost
          scoring:
            downside_risk: 0.4
            expected_value: 0.6
          variables:
          - distribution: lognormal
            name: revenue
            params:
              mean: 11.5
              std: 0.4
          - distribution: triangular
            name: cost
            params:
              high: 90000
              low: 40000
              mode: 60000
        simulation_model: monte_carlo
    SimulationModel:
      type: string
      enum:
      - monte_carlo
      - qmc_sobol
      - lhs
      - bootstrap
      - scenario
      - sensitivity
      - mcmc
      - decision_tree
      - time_series
      - compare
      - importance_sampling
      title: SimulationModel
      description: "Which simulation algorithm to use. ALL run natively in Mojo \u2014\
        \ zero Python bottlenecks."
    StochasticParam:
      properties:
        type:
          type: string
          title: Type
          description: fixed | normal | uniform | lognormal
          default: fixed
        value:
          type: number
          title: Value
          description: Fixed value (for type='fixed')
          default: 0.0
        mean:
          type: number
          title: Mean
          description: Mean (for type='normal' or 'lognormal')
          default: 0.0
        std:
          type: number
          title: Std
          description: Std dev (for type='normal' or 'lognormal')
          default: 0.0
        low:
          type: number
          title: Low
          description: Lower bound (for type='uniform')
          default: 0.0
        high:
          type: number
          title: High
          description: Upper bound (for type='uniform')
          default: 0.0
      type: object
      title: StochasticParam
      description: 'A simulation parameter that is itself stochastic (drawn fresh
        for each path).

        Use for uncertain drift, volatility, or any time-series parameter.'
    SubmitJobRequest:
      properties:
        request:
          oneOf:
          - $ref: '#/components/schemas/SimulateRequestAuto'
          - $ref: '#/components/schemas/SimulateRequestExpert'
