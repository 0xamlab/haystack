          title: Code
          description: 'Unit identifier: ISO 4217 currency, crypto ticker, SI symbol,
            etc.'
          default: ''
        precision:
          anyOf:
          - type: integer
            maximum: 18.0
            minimum: 0.0
          - type: 'null'
          title: Precision
          description: Display decimal places. None = auto-inferred from type/code.
        scale:
          type: number
          title: Scale
          description: Multiply raw simulation output by this for display (e.g. 100
            for percentage).
          default: 1.0
        format:
          type: string
          title: Format
          description: 'Display format: standard | compact ($1.2M) | scientific (1.23e-9)'
          default: standard
        base_unit:
          type: string
          maxLength: 50
          title: Base Unit
          description: Sub-unit label (informational). E.g. 'satoshi' for BTC, 'wei'
            for ETH.
          default: ''
        sim_scale:
          type: number
          title: Sim Scale
          description: Divide input params by this before simulation. E.g. sim_scale=1e8
            if BTC inputs are in satoshis, converts to whole BTC for Mojo.
          default: 1.0
      additionalProperties: true
      type: object
      title: UnitSpec
      description: "Universal unit specification \u2014 supports any numeric domain.\n\
        \nShort-hand strings also accepted anywhere a UnitSpec is expected:\n  \"\
        USD\"        \u2192 currency/USD (2 decimal places)\n  \"BTC\"        \u2192\
        \ crypto/BTC (8 decimal places, satoshi-aware)\n  \"ETH\"        \u2192 crypto/ETH\
        \ (18 decimals, wei-aware)\n  \"%\"          \u2192 percentage (scale \xD7\
        \ 100 for display)\n  \"bps\"        \u2192 basis points (scale \xD7 10,000\
        \ for display)\n  \"days\"       \u2192 duration in days\n  \"Pa\" / \"kg\"\
        \  \u2192 SI unit (scientific notation for tiny/huge values)\n  \"probability\"\
        \ \u2192 strictly [0,1] validated\n  \"count\"      \u2192 non-negative integer-like\n\
        \nFull dict form:\n  {\n    \"type\": \"currency\",      # unit category\n\
        \    \"code\": \"USD\",           # unit identifier\n    \"precision\": 2,\
        \          # display decimal places (None = auto)\n    \"scale\": 1.0,   \
        \         # multiply raw value for display (e.g. 100 for 0\u21921 % \u2192\
        \ 0\u2192100%)\n    \"format\": \"compact\",     # standard | compact | scientific\n\
        \    \"base_unit\": \"satoshi\",  # sub-unit label (informational)\n    \"\
        sim_scale\": 1.0         # divide input by this before simulation\n  }"
    UpdateMeRequest:
