      properties:
        target_threshold:
          type: number
          title: Target Threshold
          description: The rare event level. E.g. -500000 for a $500k loss, or 2.5
            for an extreme gain.
        tail_direction:
          type: string
          title: Tail Direction
          description: '''lower'' for loss events (outcome < threshold), ''upper''
            for extreme gains (outcome > threshold).'
          default: lower
        tilt_variable:
          anyOf:
          - type: string
          - type: 'null'
          title: Tilt Variable
          description: Name of the normal-distributed variable to apply exponential
            tilting to. Auto-detects the highest-variance normal variable if omitted.
        tilt_sigma:
          type: number
          title: Tilt Sigma
          description: "Override the tilt parameter \u03B8 directly (0 = auto-compute\
            \ from threshold). Advanced use only."
          default: 0.0
      type: object
      required:
      - target_threshold
      title: ImportanceSamplingConfig
      description: "Config for engine_type='importance_sampling' \u2014 exponential\
        \ tilting for rare tail events.\n\nUse when you need accurate estimates of\
        \ very low-probability events\n(e.g. 1-in-10,000 loss scenarios) without running\
        \ millions of MC trials.\n\nThe engine shifts sampling mass toward the target\
        \ tail using exponential tilting\n(\u03B8 optimal tilt), then corrects back\
        \ with likelihood ratio weights.\nReports: tail_probability, tail_probability_se,\
        \ cvar_tail, ESS, variance_reduction_factor."
