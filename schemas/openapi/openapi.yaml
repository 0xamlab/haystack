openapi: 3.1.0
info:
  title: Algenta API
  description: Hosted and self-hosted Algenta API for governed data discovery, exact
    queries, read-only SQL reports, and simulation workflows.
  version: 1.0.0
paths:
  /v1/health:
    get:
      tags:
      - System
      summary: Health check
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/version:
    get:
      tags:
      - System
      summary: API and engine version
      operationId: version_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /v1/meta/contract:
    get:
      tags:
      - System
      summary: Machine-readable Algenta contract
      operationId: contract_v1_meta_contract_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformContractResponse'
  /v1/runtime/manifest:
    get:
      tags:
      - System
      summary: Signed runtime manifest
      operationId: runtime_manifest_v1_runtime_manifest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeManifestResponse'
  /v1/runtime/library-stats:
    get:
      tags:
      - System
      summary: Runtime library contract counts
      description: "Public counts from the sanitized runtime-library contract \u2014\
        \ the same source\nthe docs are generated from. algenta.ai renders its catalog\
        \ counters from this\nroute (fail-soft to pinned values), so the site can\
        \ never drift from docs."
      operationId: runtime_library_stats_v1_runtime_library_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeLibraryStatsResponse'
  /v1/admin/runtime/modules:
    get:
      tags:
      - System
      summary: Admin runtime module catalog
      operationId: runtime_admin_modules_v1_admin_runtime_modules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeAdminModulesResponse'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/admin/runtime/benchmarks:
    get:
      tags:
      - System
      summary: Admin runtime benchmark catalog
      operationId: runtime_admin_benchmarks_v1_admin_runtime_benchmarks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeAdminBenchmarksResponse'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/admin/runtime/validation:
    get:
      tags:
      - System
      summary: Admin runtime release validation
      operationId: runtime_admin_validation_v1_admin_runtime_validation_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeReleaseValidationResponse'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/admin/egress-policy:
    get:
      tags:
      - System
      summary: Admin privacy egress policy
      operationId: admin_egress_policy_v1_admin_egress_policy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEgressPolicyResponse'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/admin/egress-log:
    get:
      tags:
      - System
      summary: Admin privacy egress log
      operationId: admin_egress_log_v1_admin_egress_log_get
      security:
      - BearerAuth: []
      - LegacyApiKey: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEgressLogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/privacy-report:
    get:
      tags:
      - System
      summary: Admin privacy report
      operationId: admin_privacy_report_v1_admin_privacy_report_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrivacyReportResponse'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/simulate:
    post:
      tags:
      - Simulation
      summary: Run a simulation
      description: 'Execute a Monte Carlo simulation and receive a structured decision
        envelope. Use `mode: ''auto''` for minimal setup or `mode: ''expert''` for
        full control.


        **Performance**: p50 < 15ms server-side (Mojo worker pool, async persistence).


        **Execution policy**: Algenta editions have unlimited decisions and no plan
        request meter. HTTP 429 is reserved for explicit endpoint, provider, or operator
        controls.'
      operationId: simulate_v1_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SimulateRequestAuto'
              - $ref: '#/components/schemas/SimulateRequestExpert'
              title: Payload
              discriminator:
                propertyName: mode
                mapping:
                  auto: '#/components/schemas/SimulateRequestAuto'
                  expert: '#/components/schemas/SimulateRequestExpert'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/recommend:
    post:
      tags:
      - Decision
      summary: Compare actions and get a recommendation
      description: "Run simulations for 2\u201310 named actions and return them ranked\
        \ by expected value. The top-ranked action is returned as `recommended_action`."
      operationId: recommend_v1_recommend_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/score:
    post:
      tags:
      - Decision
      summary: Score a simulation with custom weights
      operationId: score_v1_score_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/batch:
    post:
      tags:
      - Decision
      summary: Run multiple simulations in one request
      description: "Submit 1\u2013100 simulation requests. Partial failures are allowed;\
        \ failed items include an error message."
      operationId: batch_v1_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/compare:
    post:
      tags:
      - Decision
      summary: Side-by-side scenario comparison
      description: "Run and compare 2\u201310 named scenarios. Returns full results\
        \ with deltas versus the winning scenario."
      operationId: compare_v1_compare_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/models:
    get:
      tags:
      - LLM API
      summary: List currently supported LLM utility models
      description: Returns the truthful, currently executable Algenta LLM model catalog.
        Only runtime-backed or explicitly configured provider-backed models are advertised.
      operationId: list_models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMModelListResponse'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/artifacts/resolve:
    post:
      tags:
      - LLM API
      summary: Resolve a Hugging Face artifact through the Algenta artifact bridge
      description: Resolves a Hugging Face artifact path through the compatibility-ring
        artifact bridge. The default behavior is cache-only and never downloads from
        the network unless the caller explicitly sets local_files_only=false.
      operationId: resolve_artifact_v1_artifacts_resolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactBridgeResolveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactBridgeResolveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/chat/completions:
    post:
      tags:
      - LLM API
      summary: Run deterministic utility chat completion
      description: Runs the selected model over a chat transcript and returns an assistant
        message. Tokenizer-backed utility chat remains deterministic, while configured
        provider-backed models are routed through the provider service when advertised
        in GET /v1/models.
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
        required: true
      responses:
        '200':
          description: JSON chat completion by default, or Server-Sent Events chunks
            when stream=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/tokenize:
    post:
      tags:
      - LLM API
      summary: Tokenize text with a supported Algenta tokenizer model
      description: Runs the selected tokenizer model and returns the produced tokens.
        This initial LLM API tranche currently exposes deterministic word tokenization.
      operationId: tokenize_v1_tokenize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/count_tokens:
    post:
      tags:
      - LLM API
      summary: Count tokens with a supported Algenta tokenizer model
      description: Runs the selected tokenizer model and returns the deterministic
        token count.
      operationId: count_tokens_v1_count_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountTokensRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountTokensResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/responses:
    post:
      tags:
      - LLM API
      summary: Run the unified model response envelope
      description: Runs the selected model and returns a unified response envelope.
        Tokenizer-backed and lexical-embedding utility models remain deterministic,
        while configured provider-backed chat and embedding models are routed through
        the provider service when advertised in GET /v1/models.
      operationId: responses_v1_responses_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
        required: true
      responses:
        '200':
          description: JSON response envelope by default, or Server-Sent Events when
            stream=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/embeddings:
    post:
      tags:
      - LLM API
      summary: Generate embeddings from text
      description: Generates embeddings from caller-supplied text. Runtime-backed
        utility models use deterministic lexical hash embeddings, while configured
        provider-backed embedding models are routed through the provider service.
      operationId: embeddings_v1_embeddings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/embeddings/similarity:
    post:
      tags:
      - LLM API
      summary: Score similarity between two embedding vectors
      description: Runs a deterministic embedding similarity kernel over caller-supplied
        vectors. This route does not generate embeddings from text; it only scores
        precomputed embedding vectors with the selected runtime-backed metric.
      operationId: embedding_similarity_v1_embeddings_similarity_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingSimilarityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingSimilarityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/rerank:
    post:
      tags:
      - LLM API
      summary: Rerank caller-supplied document embeddings
      description: Runs a deterministic reranking pass over caller-supplied embedding
        vectors. This route does not generate embeddings from text; it ranks the provided
        documents with the selected runtime-backed similarity or distance metric.
      operationId: rerank_v1_rerank_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      - LegacyApiKey: []
  /v1/agent/runs:
    post:
      tags:
      - Agent Runtime
      summary: Create a persisted agent run
      description: Creates a deterministic persisted agent run. The run can complete
        immediately, pause before execution, or wait for approval before executing
        its selected tool.
      operationId: create_run_v1_agent_runs_post
      security:
      - BearerAuth: []
      - LegacyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunResource'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Agent Runtime
      summary: List persisted agent runs
      operationId: list_runs_v1_agent_runs_get
      security:
      - BearerAuth: []
      - LegacyApiKey: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: request_hash
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Hash
      - name: policy_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Snapshot Id
      - name: schema_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Snapshot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agent/runs/checkpoints:
    get:
      tags:
      - Agent Runtime
      summary: Query persisted agent run checkpoints across runs
      operationId: query_runs_checkpoints_v1_agent_runs_checkpoints_get
      security:
      - BearerAuth: []
      - LegacyApiKey: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: request_hash
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Hash
      - name: policy_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Snapshot Id
      - name: schema_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Snapshot Id
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
      - name: checkpoint_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkpoint Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunCheckpointListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agent/runs/mission-events:
    get:
      tags:
      - Agent Runtime
      summary: Query mission-event records across agent runs
      operationId: query_runs_mission_events_v1_agent_runs_mission_events_get
      security:
      - BearerAuth: []
      - LegacyApiKey: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: request_hash
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Hash
      - name: policy_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Snapshot Id
      - name: schema_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Snapshot Id
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunMissionEventListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agent/runs/telemetry:
    get:
      tags:
      - Agent Runtime
      summary: Query telemetry batches across agent runs
      operationId: query_runs_telemetry_v1_agent_runs_telemetry_get
      security:
      - BearerAuth: []
      - LegacyApiKey: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Limit
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: request_hash
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Hash
      - name: policy_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Snapshot Id
      - name: schema_snapshot_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Snapshot Id
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
      - name: telemetry_kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Telemetry Kind
      - name: module_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunTelemetryListResponse'
        '422':
