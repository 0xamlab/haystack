  /v1/simulate/stream:
    post:
      tags:
      - Streaming
      summary: Streaming simulation via Server-Sent Events
      description: "Run a simulation and receive progressive results via **Server-Sent\
        \ Events**.\n\nThe connection stays open and emits events as the Mojo engine\
        \ computes:\n- **`progress`** events every `checkpoint_every` runs (default:\
        \ 1000)\n  Each carries Welford online statistics: `mean`, `std`, `min`, `max`,\n\
        \  `probability_of_loss`, `runs_completed`, `progress` (0\u20131).\n- **`final`**\
        \ event when complete \u2014 contains the full `DecisionEnvelope`\n  identical\
        \ to what `/v1/simulate` returns.\n\n### Example (curl)\n```bash\ncurl -N\
        \ -X POST /v1/simulate/stream \\\n  -H \"Authorization: Bearer sk-...\" \\\
        \n  -H \"Content-Type: application/json\" \\\n  -d '{\"mode\":\"expert\",\"\
        runs\":100000,\"variables\":[...]}'\n```\n\n### Example (JavaScript EventSource)\n\
        ```javascript\nconst es = new EventSource('/v1/simulate/stream?token=sk-...');\n\
        es.addEventListener('progress', e => console.log(JSON.parse(e.data)));\nes.addEventListener('final',\
        \ e => {\n  console.log(JSON.parse(e.data).result);\n  es.close();\n});\n\
        ```\n\n### Query parameters\n- `checkpoint_every` \u2014 emit a progress event\
        \ every N runs (default: 1000, min: 100)"
      operationId: simulate_stream_v1_simulate_stream_post
      security:
      - BearerAuth: []
      parameters:
      - name: checkpoint_every
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          title: Checkpoint Every
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SimulateRequestAuto'
              - $ref: '#/components/schemas/SimulateRequestExpert'
              discriminator:
                propertyName: mode
                mapping:
                  auto: '#/components/schemas/SimulateRequestAuto'
                  expert: '#/components/schemas/SimulateRequestExpert'
              title: Payload
      responses:
        '200':
          description: SSE stream of progress events + final DecisionEnvelope
          content:
            text/event-stream: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
