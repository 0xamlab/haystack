    DecisionNode:
      properties:
        id:
          type: string
          maxLength: 200
          minLength: 1
          title: Id
        type:
          type: string
          title: Type
          description: 'Node type: decision | chance | terminal'
          default: terminal
        name:
          type: string
          maxLength: 500
          title: Name
          default: ''
        probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Probability
          description: Branch probability (for chance nodes). All siblings should
            sum to 1.0.
          default: 1.0
        condition:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Condition
          description: Optional expression condition for this branch to be active
        variables:
          additionalProperties: true
          type: object
          title: Variables
          description: "Variable overrides for this branch. Scalar value \u2192 treated\
            \ as fixed distribution. Dict \u2192 full VariableSpec override {distribution,\
            \ params}."
        objective_function:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Objective Function
          description: Expression override for this node. Inherits top-level if not
            set.
        branches:
          items:
            $ref: '#/components/schemas/DecisionNode'
          type: array
          maxItems: 50
          title: Branches
          description: Child branches. Empty = terminal node.
      type: object
      required:
      - id
      title: DecisionNode
      description: "A node in a multi-layered decision tree.\n\nNode types:\n  decision\
        \  \u2014 represents a controllable choice (e.g. \"Launch\" vs \"Don't Launch\"\
        )\n  chance    \u2014 represents an uncertain outcome with a probability (e.g.\
        \ \"Market Accepts\")\n  terminal  \u2014 leaf node; variables + objective_function\
        \ evaluated here\n\nEach node can override any parent variable with a new\
        \ distribution or scalar.\nVariable overrides cascade top-down: child inherits\
        \ parent, then applies its own."
    DecisionOption:
      properties:
        name:
          type: string
          title: Name
        rank:
          type: integer
          minimum: 1.0
          title: Rank
        expected_value:
          type: number
          title: Expected Value
        risk:
          $ref: '#/components/schemas/RiskProfile'
        score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Score
          description: "Composite score (0\u20131)"
      type: object
      required:
      - name
      - rank
      - expected_value
      - risk
      title: DecisionOption
      description: One named alternative in a multi-option decision comparison.
    DecisionPlan:
      properties:
        recommended_action:
          type: string
          title: Recommended Action
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        expected_value:
          type: number
          title: Expected Value
        risk:
          $ref: '#/components/schemas/RiskProfile'
        options:
          items:
            $ref: '#/components/schemas/DecisionOption'
          type: array
          title: Options
          description: All alternatives ranked by expected value. Single-element for
            simulate, multi for recommend.
        rationale:
          type: string
          title: Rationale
        integrity:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Integrity
          description: 'Cryptographic proof of inputs/outputs: {request_hash, result_hash}.'
        calibration:
          anyOf:
          - type: string
          - type: 'null'
          title: Calibration
          description: Human-readable calibration summary, e.g. '12 outcomes | bias=-8.3%
            (over-optimistic) | hit_rate=75%'. Null until MIN_SAMPLES (5) outcomes
            are recorded for this org.
        repository_analysis:
          anyOf:
          - $ref: '#/components/schemas/RepositoryAnalysis'
          - type: 'null'
          description: Repository-intelligence context including root cause, candidate
            fixes, workspace evidence refs, patch impact, and token reduction metrics.
      type: object
      required:
      - recommended_action
      - confidence
      - expected_value
      - risk
      - rationale
      title: DecisionPlan
      description: "Structured, LLM-readable summary of the decision output.\n\nThis\
        \ is the headline object \u2014 it surfaces all decision-critical fields\n\
        in a compact, consistent shape regardless of simulation model used.\nPopulate\
        \ ``options`` with all ranked alternatives when using /v1/recommend."
    DecisionRequest:
      properties:
        inputs:
          items:
            $ref: '#/components/schemas/DecisionInput'
          type: array
          title: Inputs
          description: Business inputs with optional uncertainty ranges
          examples:
          - - high: 180000
              low: 80000
              name: revenue
              unit: USD
              value: 120000
            - high: 100000
              low: 50000
              name: cost
              unit: USD
              value: 70000
        objective:
          type: string
          title: Objective
          description: 'What to optimize: maximize_value, minimize_risk, maximize_profit,
            minimize_cost'
          default: maximize_value
        risk_tolerance:
          type: string
          title: Risk Tolerance
          description: 'How much risk is acceptable: low, medium, high'
          default: medium
        scenarios:
          type: integer
          maximum: 1000000.0
          minimum: 1000.0
          title: Scenarios
          description: How many scenarios to evaluate (more = higher confidence)
          default: 10000
        engine:
          type: string
          title: Engine
          description: 'Simulation engine. ''auto'' (default) selects the best engine
            automatically based on your data shape. Options: monte_carlo, lhs, qmc_sobol,
            bootstrap, mcmc, importance_sampling, time_series, sensitivity'
          default: auto
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: Optional label for this decision
      type: object
      required:
      - inputs
      title: DecisionRequest
      description: "Ask Algenta: given these inputs and constraints, what should I\
        \ do?\n\nAlgenta tests thousands of possible outcomes and returns the optimal\
        \ action\nwith confidence, risk, and reasoning \u2014 no statistics knowledge\
        \ required."
    DecisionResponse:
      properties:
        decision_id:
          type: string
          title: Decision Id
        action:
          type: string
          title: Action
          description: 'Recommended action: proceed, pause, reject, or custom'
        confidence:
          type: number
          title: Confidence
          description: "Confidence in this recommendation (0\u20131)"
        reasoning:
          type: string
          title: Reasoning
          description: Plain-English explanation
        why:
          items:
            type: string
          type: array
          title: Why
          description: 3 crisp reasons behind this recommendation
        expected_outcome:
          type: number
          title: Expected Outcome
          description: Expected value in your input units
        downside_risk:
          type: number
          title: Downside Risk
          description: Value at 5th percentile (worst-case)
        upside_potential:
          type: number
          title: Upside Potential
          description: Value at 95th percentile (best-case)
        probability_of_loss:
          type: number
          title: Probability Of Loss
          description: Probability of negative outcome
        scenarios_evaluated:
          type: integer
          title: Scenarios Evaluated
        latency_ms:
          type: number
          title: Latency Ms
      type: object
      required:
      - decision_id
      - action
      - confidence
      - reasoning
      - why
      - expected_outcome
      - downside_risk
      - upside_potential
      - probability_of_loss
      - scenarios_evaluated
      - latency_ms
      title: DecisionResponse
    DecisionTreeConfig:
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/DecisionNode'
          type: array
          maxItems: 50
          minItems: 1
          title: Nodes
          description: Root nodes of the decision tree. Multiple roots = parallel
            independent decisions.
        max_depth:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Max Depth
          description: Maximum allowed tree depth
          default: 10
      type: object
      required:
      - nodes
      title: DecisionTreeConfig
      description: "Config for engine_type='decision_tree' \u2014 multi-layered decisions\
        \ with branches.\n\nExample (2-level tree):\n  nodes: [\n    {\n      id:\
        \ \"launch_decision\", type: \"decision\", name: \"Launch Product?\",\n  \
        \    branches: [\n        {\n          id: \"launch_yes\", type: \"chance\"\
        , name: \"Launch\", probability: 1.0,\n          branches: [\n           \
        \ { id: \"accept\", type: \"terminal\", name: \"Market Accepts\",\n      \
        \        probability: 0.7, objective_function: \"revenue - launch_cost\" },\n\
        \            { id: \"reject\", type: \"terminal\", name: \"Market Rejects\"\
        ,\n              probability: 0.3, variables: {\"revenue\": 0},\n        \
        \      objective_function: \"-launch_cost\" }\n          ]\n        }\n  \
        \    ]\n    }\n  ]"
