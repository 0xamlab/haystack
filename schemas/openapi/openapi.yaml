    QueryRequest:
      properties:
        dataset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset Id
          description: Public dataset ID alias for a registered source. When provided,
            query execution is scoped to that one registered dataset.
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
          description: EXACT source name from the registry (e.g. 'Bookings'). Bypasses
            source resolver entirely. Get this from POST /v1/sources/schema or the
            registration response.
        metric_column:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Column
          description: EXACT column name for the metric (e.g. 'EXT_PRICE'). Bypasses
            column resolver. The engine validates this column exists in source_name.
        group_column:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Column
          description: EXACT column name for group-by (e.g. 'CUSTOMER'). Bypasses
            group resolver. Can be in source_name or in the terminal source of join_path.
        join_path:
          anyOf:
          - $ref: '#/components/schemas/JoinPathSpec'
          - type: 'null'
          description: Explicit multi-hop join graph. Breaking replacement for single-hop
            join fields. Defaults to a safe 4-hop budget; explicit opt-in can raise
            this to 6 hops (7 tables) with per-edge constraints and path-level confidence
            gates.
        sources:
          items:
            $ref: '#/components/schemas/DataSource'
          type: array
          title: Sources
          description: "Raw data sources (inline CSV/JSON). Usually empty \u2014 use\
            \ registry."
          default: []
        metric:
          $ref: '#/components/schemas/MetricSpec'
        group_by:
          items:
            type: string
          type: array
          title: Group By
          description: 'Hint mode only: dimension words from the user''s question
            (e.g. [''customer'', ''region'']). Ignored when group_column is set.'
          default: []
        preferred_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferred Source
          description: 'Hint mode only: source name the LLM believes is correct. Hard-locks
            the source resolver. Ignored when source_name is set.'
        reject_on_ambiguity:
          type: boolean
          title: Reject On Ambiguity
          description: 'Hint mode only: when True and resolver confidence < 0.40,
            return null result with source candidates instead of guessing.'
          default: false
        min_source_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Source Confidence
          description: 'Hint mode only: minimum resolver confidence threshold.'
          default: 0.0
        aggregation:
          type: string
          title: Aggregation
          description: sum | avg | count | max | min
          default: sum
        filter:
          anyOf:
          - $ref: '#/components/schemas/FilterSpec'
          - type: 'null'
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
          description: Top-N limit
        order:
          type: string
          title: Order
          description: desc | asc
          default: desc
        min_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Min Confidence
          default: 0.5
        constraints:
          $ref: '#/components/schemas/ConstraintSpec'
        resolved_plan:
          anyOf:
          - $ref: '#/components/schemas/ResolvedPlan-Input'
          - type: 'null'
          description: Exact plan returned by POST /v1/resolve.
      additionalProperties: false
      type: object
      title: QueryRequest
      description: "Structured query execution request.\n\n\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\nPRIMARY PATH  \u2014  Exact spec  (use after reading the\
        \ schema)\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nThe correct flow:\n\
        \  1. Call POST /v1/sources/register or POST /v1/sources/schema\n  2. LLM\
        \ reads the returned schema (column names, roles, formulas)\n  3. LLM sends\
        \ exact column names \u2014 Mojo validates and executes\n\nExample (top 5\
        \ customers by revenue):\n  {\n    \"source_name\": \"S0\",\n    \"metric_column\"\
        : \"measure_total\",\n    \"group_column\": \"dimension_label\",\n    \"aggregation\"\
        : \"sum\",\n    \"limit\": 5\n  }\n\nFor multi-hop joins:\n  {\n    \"source_name\"\
        : \"S0\",\n    \"metric_column\": \"measure_total\",\n    \"group_column\"\
        : \"dimension_label\",\n    \"join_path\": {\n      \"base_source\": \"S0\"\
        ,\n      \"group_source\": \"S2\",\n      \"edges\": [\n        {\n      \
        \    \"left_source\": \"S0\",\n          \"right_source\": \"S1\",\n     \
        \     \"left_key\": \"k01_left\",\n          \"right_key\": \"k01_right\"\n\
        \        },\n        {\n          \"left_source\": \"S1\",\n          \"right_source\"\
        : \"S2\",\n          \"left_key\": \"k12_left\",\n          \"right_key\"\
        : \"k12_right\"\n        }\n      ]\n    },\n    \"aggregation\": \"sum\"\n\
        \  }\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nFALLBACK PATH  \u2014\
        \  Hint spec  (when schema is not yet known)\n\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\nThe engine resolves source and columns from structural role\
        \ hints.\nUse this ONLY for exploratory queries. Always migrate to exact spec\n\
        once you have the schema \u2014 it is faster and never ambiguous.\n\nExample:\n\
        \  {\n    \"metric\": {\"role\": \"derived_measure\", \"hint\": \"total value\"\
        },\n    \"group_by\": [\"segment\"],\n    \"aggregation\": \"sum\",\n    \"\
        limit\": 5\n  }"
    QueryResponse:
      properties:
        query_id:
          type: string
          title: Query Id
        result:
          title: Result
        result_type:
          type: string
          title: Result Type
        confidence:
          type: number
          title: Confidence
        plan:
          items:
            type: string
          type: array
          title: Plan
        resolved_column:
          type: string
          title: Resolved Column
        resolved_role:
          type: string
          title: Resolved Role
        resolved_source:
          type: string
          title: Resolved Source
        row_count:
          type: integer
          title: Row Count
        candidates:
          items:
            $ref: '#/components/schemas/CandidateColumn'
          type: array
          title: Candidates
        source_scores:
          additionalProperties:
            type: number
          type: object
          title: Source Scores
        ambiguous:
          type: boolean
          title: Ambiguous
        exact_spec:
          type: boolean
          title: Exact Spec
        explanation:
          items:
            type: string
