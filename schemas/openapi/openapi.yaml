        \ returns in <300ms. Phase 2 (join detection + relation detection) is embedded\
        \ in the response if it finishes within 200ms, otherwise `deep_analysis_pending:\
        \ true` is set and results can be retrieved via `GET /v1/map/{map_id}`.\n\n\
