[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algenta-runtime-native"
version = "1.0.6"
description = "Bundled Algenta runtime artifacts for the algenta package. Installed automatically; not a standalone API."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Proprietary: this wheel carries the compiled native runtime. Kept in its OWN distribution + import
# namespace (algenta_runtime_native) so the `algenta` CLI stays pure-Python/Apache and there is no
# cross-distribution file ownership.
license = { text = "Proprietary — (c) Algenta. The native runtime is proprietary; see https://algenta.ai/terms" }
keywords = ["algenta", "runtime", "native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = []
# No [project.scripts] — this artifact package owns no public command.

[project.urls]
Homepage = "https://algenta.ai"
Repository = "https://github.com/thyn-ai/algenta"

[tool.hatch.build.targets.wheel]
packages = ["algenta_runtime_native"]
# Force the CI-built runtime worker + signed manifest into the wheel.
artifacts = ["algenta_runtime_native/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Wheels-only, per-platform: the native lib can't be rebuilt from an sdist, so never publish one.
[tool.hatch.build.targets.sdist]
exclude = ["*"]
