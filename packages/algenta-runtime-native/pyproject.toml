[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algenta-runtime-native"
version = "1.0.0"
description = "Algenta native runtime (proprietary) — the prebuilt, in-process engine + signed manifest loaded by the `algenta` CLI. Not a standalone API."
readme = "README.md"
requires-python = ">=3.10"
# Proprietary: this wheel carries the compiled native runtime. Kept in its OWN distribution + import
# namespace (algenta_runtime_native) so the `algenta` CLI stays pure-Python/Apache and there is no
# cross-distribution file ownership.
license = { text = "Proprietary — (c) Algenta. The native runtime is proprietary; see https://algenta.ai/terms" }
keywords = ["algenta", "runtime", "native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = []
# No [project.scripts] — the sidecar owns no command.

[project.urls]
Homepage = "https://algenta.ai"
Repository = "https://github.com/thyn-ai/algenta"

[tool.hatch.build.targets.wheel]
packages = ["algenta_runtime_native"]
# Force the CI-built native lib + signed manifest (added by the hook on ALGENTA_BUNDLE_RUNTIME=1) into the wheel.
artifacts = ["algenta_runtime_native/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Wheels-only, per-platform: the native lib can't be rebuilt from an sdist, so never publish one.
[tool.hatch.build.targets.sdist]
exclude = ["*"]
