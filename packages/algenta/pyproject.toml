[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algenta"
version = "1.0.5"
description = "Algenta repository intelligence and computational runtime CLI with an automatically installed native runtime."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# The Python here (CLI, login, SDK client, runtime loader/doctor) is Apache-2.0. The proprietary native
# runtime ships as an automatic per-platform dependency, so THIS distribution stays pure-Python +
# Apache-2.0 and platform-agnostic while the native artifact remains in its own wheel.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "algenta", "repository-intelligence", "computational-runtime", "cli", "mcp",
    "runtime", "deterministic", "structured-data", "query", "resolve", "agent"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The local runtime is an automatic required dependency, not an extra. An
# unsupported platform must fail during package resolution instead of installing
# a broken CLI. Pinned == keeps the package/runtime ABI in lockstep.
# cryptography backs offline manifest/license verification.
dependencies = [
    "algenta-runtime-native==1.0.3",
    "cryptography>=42",
    "keyring>=25,<26",
]

[project.optional-dependencies]
cloud = ["algenta-sdk>=1.0.0"]
mcp = ["algenta-mcp>=1.0.0"]
benchmark = ["numpy"]
all = ["algenta-sdk>=1.0.0", "numpy"]

[project.scripts]
algenta = "algenta.cli:main"

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai"
Repository = "https://github.com/thyn-ai/algenta"

[tool.setuptools.packages.find]
where = ["."]
include = ["algenta*"]
exclude = ["build*", "tests*"]

[tool.setuptools.package-data]
# Force the embedded PUBLIC trust anchors past the repo-wide *.pem gitignore (only *_pub.pem).
# `runtime_capability_manifest.json` carries the DECLARED capabilities that `algenta.capabilities`
# serves. Leaving it out of the wheel would not raise: the loader would simply answer "undeclared"
# for every kernel, so the omission reads as "nothing is declared" rather than as a packaging bug.
algenta = [
    "_keys/*_pub.pem",
    "runtime_library_contract.json",
    "runtime_capability_manifest.json",
]
