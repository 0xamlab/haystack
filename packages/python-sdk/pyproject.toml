[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algenta-sdk"
version = "1.0.0"
description = "Python SDK for Codna — public data, query, and simulation API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["decision", "simulation", "monte-carlo", "probabilistic", "risk", "api", "algenta"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "black", "ruff"]

[project.urls]
Homepage = "https://codna.ai"
Documentation = "https://docs.codna.ai"
Repository = "https://github.com/algenta/decision-engine"
"Bug Tracker" = "https://github.com/algenta/decision-engine/issues"
Changelog = "https://docs.codna.ai/changelog"

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_engine*"]
