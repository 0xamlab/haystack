[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algenta-core"
version = "0.1.0"
description = "Algenta core runtime — local-first deterministic resolve and query execution."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-ACL-1.0"
keywords = [
    "runtime", "deterministic", "structured-data", "query", "resolve",
    "simulation", "optimization", "decision", "algenta", "mojo"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
cloud = ["algenta-sdk>=1.0.0"]
benchmark = ["numpy"]
all = ["algenta-sdk>=1.0.0", "numpy"]

[project.scripts]
algenta = "algenta.cli:main"

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai/core"
Repository = "https://github.com/algenta/decision-engine"

[tool.setuptools.packages.find]
where = ["."]
include = ["algenta*"]
