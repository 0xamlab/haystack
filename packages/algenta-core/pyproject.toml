[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algenta-core"
version = "1.0.0"
description = "DEPRECATED — algenta-core graduated into the `algenta` distribution. This is a compatibility shim that just installs `algenta` (same import name, same `algenta` command)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["algenta", "deprecated", "shim"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The whole point of the shim: pull in the graduated distribution. Pinned == so an upgrade lands the matching
# `algenta`. algenta now OWNS the `algenta` import + the `algenta` command; this ships NO package files.
dependencies = ["algenta==1.0.0"]

[project.urls]
Homepage = "https://algenta.ai"
Repository = "https://github.com/thyn-ai/algenta"

# Metadata-only shim: ship NO importable files — `algenta` owns the `algenta/` package now. bypass-selection
# keeps hatchling from auto-collecting anything.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
exclude = ["*"]
