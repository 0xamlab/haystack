# ----------------------------------------------------------------------------------------
# Trade secrets and know-how: categories only, nothing that discloses the secret itself.
# ----------------------------------------------------------------------------------------

[[trade_secrets]]
category = "Mojo engine source"
description = "The proprietary source of the compiled kernel library under mojo/engine/ (families listed in the sub-table), including the numerical hot paths behind the published functions."
held_in = "thyn-ai/algenta (private); shipped only as compiled, signed binaries"

[[trade_secrets]]
category = "Dispatch and compilation architecture"
description = "How the runtime selects, compiles, and races kernels across CPU, Metal, and CUDA backends, including the accelerator ahead-of-time paths and the determinism guarantees."
held_in = "thyn-ai/algenta (private)"

[[trade_secrets]]
category = "Benchmark harness, oracles, and calibration data"
description = "The scripted, ground-truth-scored benchmark corpus and timing methodology re-measured every release."
held_in = "thyn-ai/algenta (private); results published, harness internals not"

[[trade_secrets]]
category = "Licensing and activation design"
description = "Offline license verification, key issuance, device and compute-unit accounting, and anti-fleet-abuse enforcement."
held_in = "thyn-ai/algenta and thyn-ai/accounts (private)"

[[trade_secrets]]
category = "Evidence and replay record format"
description = "The content-hashed, versioned decision-record structure and the replay protocol under pinned inputs, seed, and engine version."
held_in = "thyn-ai/algenta (private); documented externally at the interface level only"

[[trade_secrets]]
category = "Codna repository mapping"
description = "How Codna maps a repository before spending tokens, anchors reviews to changed code, and proves reachability of scanner findings."
held_in = "thyn-ai/codna (private repository; Apache-2.0 source distributed in packages)"

[[trade_secrets]]
category = "Telys index format and retrieval path"
description = "The on-device index layout, filtered vector search, and temporal-truth model."
held_in = "thyn-ai/telys (private repository; Apache-2.0 source distributed in packages)"

[[trade_secrets]]
category = "SQAI planning and policy checks"
description = "How a question becomes a typed, policy-checked plan pinned to a runtime with replay hashes."
held_in = "thyn-ai/sqai (private repository; Apache-2.0 source distributed in packages)"


