# Inputs for the Schedule of Intellectual Property generator (scripts/ip_schedule).
#
# Everything measurable is measured by collect.py at run time (git, GitHub, PyPI, npm,
# WHOIS). This file holds the facts that are not derivable from a repository: who the
# owner is, which repositories and domains belong to the schedule, the non-revealing
# trade-secret categories, and the inbound/outbound license positions.

schema_version = 1

# Root-level arrays must sit above the first [table] header, or TOML attaches them to it.
protection_measures = [
  "Private GitHub repositories under the thyn-ai organization; single-owner access with two-factor authentication",
  "Engine distributed only as compiled, signed wheels; Mojo source never leaves the private repository",
  "Algenta Community License 1.0 prohibits reverse engineering of the engine binary and sub-licensing",
  "Website Terms of Service assert ownership of software, models, interfaces, workflows, trademarks, logos, and documentation",
  "Secret scanning, dependency review, and a pinned security toolchain on every repository",
]

cleanup_items = [
  "Copyright owner harmonised to Seville AI Technologies, Inc. d/b/a Thyn across LICENSE and NOTICE files (thyn-ai/algenta #1106, codna #615, telys #147, sqai #62, algenta-sdk #107, algenta-integrations #161, mojo-kernels #56, escrypto #23).",
  "File USPTO trademark applications for Thyn, Algenta, Codna, Telys, and SQAI (word marks; Classes 9 and 42) — none filed at the snapshot date.",
  "Register copyrights for the Algenta engine and the Codna, Telys, and SQAI applications with the U.S. Copyright Office (Circular 61; redacted trade-secret deposit option).",
  "Add a copyright/SPDX header to source files; none carry one today.",
  "decimas.com is held by an unrelated third party; only decimas.ai is owned. Do not list decimas.com.",
  "Correct the investor deck's code-size slide to this snapshot's commit and figures; the slide's cited commit does not reproduce its numbers and '606 modules' matches no commit.",
  "Record the clean-room process behind thyn-ai/mojo-kernels' NOTICE claim (engineer attestation and oracle-only use of reference libraries).",
  "Push or archive the unpushed local Codna IDE backup (~/Developer/codna-ide.bak) so no company code exists only on one machine.",
  "Refresh stale local clones (codna, sqai, mojo-kernels, escrypto) or count only from origin, as this generator does.",
  "Commission a designer-produced vector master of the Thyn logo before any USPTO filing; the current SVGs in thyn-ai/thyn-site (thyn-logo-assets/) are traced from a raster and its README says so.",
  "Reconcile the brand list in content/legal/terms.ts across the sites: thyn-site and sqai-site omit Escrypto.ai while algenta-site, telys-site, codna-site and cohenta-site list all seven brands.",
]

[issuer]
legal_name = "Seville AI Technologies, Inc."
dba = "Thyn"
owner = "Seville AI Technologies, Inc. d/b/a Thyn"
jurisdiction = "Delaware, USA"
address = "445 Park Avenue, 9th Floor, New York, NY 10022, USA"
website = "https://thyn.ai"
github_org = "thyn-ai"
founder_assignment = "Founder-to-company intellectual property assignment on file (date and document reference to be inserted by the company before filing)."

[identity]
# Every human commit across the estate belongs to one GitHub account (numeric ID 79715912)
# that has carried several display names. Bots are recognised by pattern.
human = "Angel Marinov (founder; GitHub account 79715912)"
human_names = ["angelatgithub", "0xamlab", "Angel Marinov", "Angel"]
human_emails = [
  "79715912+angelatgithub@users.noreply.github.com",
  "79715912+0xamlab@users.noreply.github.com",
  "angel@eplane.com",
  "angel@thyn.ai",
]
bot_patterns = ['\[bot\]$', '-bot$', '^github-actions', '^dependabot']

[counting]
# Extension -> language. Only these files count as code; everything else (Markdown, JSON,
# YAML, images, datasets) is tracked-but-not-code.
[counting.languages]
".mojo" = "Mojo"
".🔥" = "Mojo"
".py" = "Python"
".ts" = "TypeScript"
".tsx" = "TypeScript"
".js" = "JavaScript"
".mjs" = "JavaScript"
".cjs" = "JavaScript"
".sql" = "SQL"
".sh" = "Shell"
".rs" = "Rust"
".go" = "Go"
".c" = "C"
".h" = "C"
".cpp" = "C++"
".cu" = "CUDA"
".metal" = "Metal"

[counting.exclude]
# Any path component equal to one of these is excluded from authored counts everywhere.
dirs = ["node_modules", "vendor", "third_party", "fixtures", "testdata", "datasets", "dist", "build", ".pixi", "__pycache__"]

[valuation]
# Cost-approach inputs for the INTERNAL valuation note only. No COCOMO: KLOC models calibrated
# on pre-AI projects give absurd effort for a codebase one founder produced in months. The
# basis is what git measures — the founder's actual production rate on the engine's PRODUCT
# Mojo (tests, benchmarks, examples, docs, generated files and Apache-2.0 helpers excluded) —
# and what an equally equipped replacement team would take, priced at market rates.
loaded_cost_per_person_month_usd = 18000
loaded_cost_note = "USD 18,000 per person-month (about USD 216,000 loaded per year) for a senior software engineer."
scarce_skill_loaded_cost_per_person_month_usd = 25000
scarce_skill_note = "USD 25,000 per person-month (about USD 300,000 loaded) for engineers able to write production Mojo and CUDA/Metal kernels: 2026 US kernel-engineer base pay runs USD 176k-309k, GPU-optimization skills carry a premium of about USD 32k over standard ML roles, and the Mojo pool is small (about 140k developers worldwide by search-engine estimates; roughly 22k on the Modular Discord, about 260 language contributors), so a buyer pays the top of the market and waits to staff."
# A replacement team that has never seen the design works at a fraction of the founder's measured rate.
replacement_relative_productivity = [0.5, 0.25]
replacement_team_size = 3
hiring_lead_months = 4
verification_allowance = 0.20
developer_profit = 0.25
cost_notes = [
  "Relative productivity 0.5 and 0.25: a hired team re-deriving the architecture, without the founder's context, is assumed to produce at one half to one quarter of the measured founder rate with the same AI-assisted tooling.",
  "Verification allowance 20%: re-running the bit-exact differential suites, benchmark oracles and determinism checks that gate every release.",
  "Developer's profit and entrepreneurial incentive 25%: the standard cost-approach mark-up a rational builder requires over bare cost.",
  "Hiring lead time 4 months: time to recruit production Mojo/GPU-kernel engineers; it lengthens the schedule and adds recruiting cost but not engineering effort.",
]
non_product_dirs = ["tests", "test", "benchmarks", "bench", "examples", "docs", "scripts", "infra", "ci", "fixtures", "training", "hello-world", "schemas", "plans", "outreach", "gitbook", "site", "www"]
market_comparables = [
  "Modular (Mojo + MAX) acquired by Qualcomm, June 2026, about USD 3.9B (2.4x its September 2025 valuation) — the only exit of a compiler-driven AI runtime",
  "vLLM team seeded at about USD 800M and the SGLang spin-out at about USD 400M (2026) — the two serving engines the published benchmarks beat 16.9x and 19.2x",
  "AI-infrastructure seed rounds: median post-money USD 10–15M; Series A median USD 30–35M (2026 sector benchmarks)",
]

