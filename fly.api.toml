# codna-api — public FastAPI app (behind Cloudflare). Stateless: it enqueues the fix pipeline to
# codna-engine (queue=repository) and serves the GitHub App webhook + REST API. Scales independently.
#
# Deploy:  flyctl deploy -c fly.api.toml -i ghcr.io/thyn-ai/algenta/api:<tag>
# Secrets: set via `flyctl secrets set -a codna-api ...` (see scripts/bootstrap.sh / DEPLOY.md).
app = "codna-api"
primary_region = "iad"

[build]
  # Overridden by scripts/deploy-fly.sh with the pinned git-<sha> tag/digest from CI.
  image = "ghcr.io/thyn-ai/algenta/api:latest"

[deploy]
  # Run DB migrations once per release on a throwaway Machine before the new version goes live.
  release_command = "python -m alembic -c apps/api_server/alembic.ini upgrade head"
  strategy = "rolling"

[env]
  API_ENV = "production"
  LOG_LEVEL = "info"
  RUNTIME_FALLBACK_MODE = "deny"
  MOJO_BINARY_PATH = "/app/mojo_build/simulate"
  MOJO_ALLOW_SUBPROCESS_FALLBACK = "false"
  RESULT_STORAGE_ENABLED = "true"
  # Durable artifacts + cross-replica reads via Tigris (S3 API). Creds are secrets (S3_*).
  ALGENTA_RI_OBJECT_STORE = "s3"
  S3_REGION = "auto"
  # Multi-replica coordination/idempotency via Upstash (REDIS_URL is a secret).
  ALGENTA_COORDINATION = "redis"
  ALGENTA_REPOSITORIES_PIPELINE_ENABLED = "true"
  # The agent-core sidecar lives on codna-engine, reachable over Fly private networking.
  ALGENTA_AGENT_CORE_URL = "http://codna-engine.internal:8787"
  ALGENTA_SOURCES_DIR = "/home/app/.algenta/sources"
  ALGENTA_RUNTIME_DIR = "/home/app/.algenta/runtime"
  CORS_ORIGINS = "https://app.codna.ai,https://codna.ai"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to ZERO when idle. This is the HOSTED/dogfood engine API — the shipped product is
  # self-hosted, so there's no paying-customer hot path to keep warm here. "suspend" snapshots RAM
  # so Fly Proxy wakes it in <1s (auto_start) — the <15ms engine benchmark is measured warm/
  # engine-level, unaffected by an idle-wake on the first hosted HTTP request. If this ever fronts
  # a latency-SLA'd hosted tier, set min_machines_running = 1 to keep one warm.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  # Dedicated CPU for the hot-path API + Mojo pool; scales out behind Cloudflare.
  # Resizable in place anytime with `fly scale vm <size> -a codna-api` (no destroy).
  size = "performance-2x"
  memory = "4gb"
